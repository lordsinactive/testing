    addresses: state => `<h2>Адреса доставки</h2><div class="addresses">${state.addresses.map((address, index) => `<div class="address"><span>${address}</span><div class="buttons"><button data-mark="Изменить адрес ${index + 1}">Изменить</button><button data-act="removeAddress" data-index="${index}" data-mark="Удалить адрес ${index + 1}">Удалить</button></div></div>`).join('') || '<p class="muted">Нет сохранённых адресов</p>'}</div><button data-mark="Добавить адрес">+ Добавить адрес</button>`,
    security: state => `<h2>Безопасность</h2><div class="plate wide">${setting('Электронная почта', state.mail, '<button data-act="changeMail" data-mark="Изменить почту">Изменить</button>')}${setting('Пароль', 'Изменён 3 месяца назад', '<button data-mark="Изменить пароль">Изменить</button>')}${setting('Вход по коду из SMS', 'Дополнительная защита аккаунта', switcher(false, 'switch', 'Вход по коду'))}</div>`,
    orders: () => `<h2>Мои заказы</h2>${Array.from({length: 3}, () => `<div class="address"><span>Заказ №${integer(100000, 999999)} · ${pick(goods)}</span><span class="pill">${pick(orderStatuses)}</span></div>`).join('')}`,
}


function accountPage(record, signal, frame, look, state, load, setup) {
    arrive(record, signal, frame, look, `<button class="user" data-mark="Профиль"><i>${state.first[0]}${state.last[0]}</i><span>${state.first} ${state.last}</span> ▾</button>`, () => `${crumbs(['Главная', 'Личный кабинет'])}<h1>Личный кабинет</h1><div class="columns${state.flip ? ' flip' : ''}"><div class="side"><div class="navlist">${accountSections.map(([id, label]) => `<button data-section="${id}" data-mark="${label}"${id === state.section ? ' class="current"' : ''}>${label}</button>`).join('')}</div></div><div class="body">${accountPages[state.section](state)}</div></div>`, main => {
        const body = main.querySelector('.body')
        main.querySelector('.navlist').addEventListener('click', e => {
            const button = e.target.closest('[data-section]')
            if (!button || button.dataset.section === state.section) {
                return
            }
            state.section = button.dataset.section
            for (const other of main.querySelectorAll('[data-section]')) {
                other.classList.toggle('current', other === button)
            }
            refresh(record, signal, body, () => {
                body.innerHTML = accountPages[state.section](state)
                body.dispatchEvent(new Event('render'))
                mark(record, body.querySelectorAll('[data-mark]'))
            })
        })
        setup(body)
        body.addEventListener('render', () => {
            const slot = body.querySelector('.birthday')
            if (slot) {
                slot.replaceWith(datePicker(record, signal, ['Дата рождения'], {value: state.birthday, max: state.now}).element)
            }
        })
        body.dispatchEvent(new Event('render'))
    }, load)
}


function profileStep(look, state, step, instruction, meta, setup, load = false) {
    return web('profile', step, instruction, look, ({record, signal, done, frame, say}) => {
        Object.assign(record.meta, {wrong: 0}, meta)
        const finish = text => {
            toast(frame, look, signal, text)
            later(signal, 1200, done)
        }
        accountPage(record, signal, frame, look, state, load, body => setup({record, signal, frame, body, finish, say}))
    })
}


function removeAddress(look, state) {
    const address = pick(state.addresses)
    return profileStep(look, state, 'addresses', `Откройте раздел «Адреса», удалите адрес «${address.split(', ').slice(1, 3).join(', ')}» и подтвердите удаление`, {address: state.addresses.indexOf(address), cancels: 0}, ({record, signal, frame, body, finish}) => {
        body.addEventListener('click', e => {
            const button = e.target.closest('[data-act=removeAddress]')
            if (!button) {
                return
            }
            const chosen = state.addresses[button.dataset.index]
            confirmBox(frame, look, 'Удалить адрес?', `${chosen} пропадёт из списка адресов доставки.`, 'Удалить', () => record.meta.cancels++, (ok, close) => busy(record, signal, ok, () => {
                close()
                state.addresses.splice(state.addresses.indexOf(chosen), 1)
                if (state.section === 'addresses') {
                    body.innerHTML = accountPages.addresses(state)
                    mark(record, body.querySelectorAll('[data-mark]'))
                }
                if (chosen === address) {
                    finish('Адрес удалён')
                } else {
                    record.meta.wrong++
                    toast(frame, look, signal, 'Адрес удалён')
                }
            }))
            mark(record, frame.querySelectorAll('.modal [data-mark]'))
        })
    })
}


function changeMail(look, state) {
    return profileStep(look, state, 'security', 'Откройте раздел «Безопасность» и смените почту: нажмите «Изменить» у почты, введите любую новую почту и любой пароль, нажмите «Сохранить» и подтвердите смену', {opens: 0, submits: 0, errors: 0, cancels: 0}, ({record, signal, frame, body, finish}) => {
        body.addEventListener('click', e => {
            if (!e.target.closest('[data-act=changeMail]') || frame.querySelector('.backdrop')) {
                return
            }
            record.meta.opens++
            const dialog = frame.appendChild(html(`<div class="backdrop"><div class="modal"><button class="close" data-mark="Закрыть окно">×</button><h2>Смена почты</h2><p class="muted">Сейчас: ${state.mail}</p>${field('Новая почта', 'Новая почта', 'type="email" inputmode="email"')}${secret('Текущий пароль', 'Текущий пароль')}<p class="error"></p><div class="buttons"><button data-mark="Отмена">Отмена</button><button class="primary" data-mark="Сохранить почту">Сохранить</button></div></div></div>`))
            mark(record, dialog.querySelectorAll('[data-mark]'))
            dialog.addEventListener('click', event => {
                const button = event.target.closest('button')
                if (dialog.querySelector('.busy') || button?.classList.contains('eye')) {
                    return
                }
                if (button?.classList.contains('primary')) {
                    record.meta.submits++
                    const mail = dialog.querySelector('[data-mark="Новая почта"]')
                    const password = dialog.querySelector('[data-mark="Текущий пароль"]')
                    if (!verify([[mail, emailPattern.test(mail.value.trim()), 'Введите адрес почты, например name@mail.ru'], [password, password.value !== '', 'Введите пароль']], dialog.querySelector('.error'))) {
                        record.meta.errors++
                        return
                    }
                    busy(record, signal, button, () => {
                        dialog.remove()
                        confirmBox(frame, look, 'Подтвердите смену почты', 'На новый адрес придёт письмо со ссылкой. Старый адрес перестанет работать после подтверждения.', 'Подтвердить', () => record.meta.cancels++, (ok, close) => busy(record, signal, ok, () => {
                            close()
                            finish('Письмо отправлено на новый адрес')
                        }))
                        mark(record, frame.querySelectorAll('.modal [data-mark]'))
                    })
                } else if (button || event.target === dialog) {
                    record.meta.cancels++
                    dialog.remove()
                }
            })
        })
    })
}


async function cabinet() {
    const look = {...theme(), nav: sample(['Каталог', 'Доставка', 'Акции', 'Помощь', 'Магазины'], integer(3, 4))}
    const state = account()

    await profileStep(look, state, 'personal', `Личный кабинет «${look.name}»: смените имя на любое другое, поставьте дату рождения ${spoken(birthday, true)}, пол «${genderLabel}» и нажмите «Сохранить изменения»`, {birthday: iso(birthday), otherMonth: birthday.getMonth() !== state.birthday.getMonth(), gender, submits: 0, errors: 0}, ({record, signal, body, finish}) => {
        let picker = null
        body.addEventListener('render', () => {
            const slot = body.querySelector('.birthday')
            if (slot) {
                picker = datePicker(record, signal, ['Дата рождения'], {value: state.birthday, max: state.now})
                slot.replaceWith(picker.element)
            }
        })
        body.addEventListener('click', e => {
            const button = e.target.closest('[data-act=savePersonal]')
            if (!button) {
                return
            }
            record.meta.submits++
            const name = body.querySelector('[data-mark=Имя]')
            const sex = body.querySelector('input[name=gender]:checked')?.value
            const ok = verify([
                [name, name.value.trim() !== '' && name.value.trim() !== state.first, 'Введите новое имя'],
                [picker.element.querySelector('.datefield'), same(picker.chosen.from, birthday), `Нужна дата рождения ${spoken(birthday, true)}`],
                [body.querySelector('.ticks'), sex === gender, `Отметьте пол «${genderLabel}»`],
            ], body.querySelector('.error'))
            if (ok) {
                busy(record, signal, button, () => {
                    state.birthday = birthday
                    state.gender = gender
                    finish('Изменения сохранены')
                })
            } else {
                record.meta.errors++
            }
        })
    }, true)

    const keys = Object.keys(state.switches)
    const changes = sample(keys, 3)
    const wanted = {...state.switches, ...Object.fromEntries(changes.map(key => [key, !state.switches[key]]))}
    const asked = changes.map(key => {
        const [group, channel] = key.split(': ')
        return `${wanted[key] ? 'включите' : 'выключите'} «${channel}» в группе «${group}»`
    }).join(', ')
    await profileStep(look, state, 'notifications', `Откройте раздел «Уведомления», ${asked} и нажмите «Сохранить»`, {changes, saves: 0, mismatches: 0}, ({record, signal, frame, body, finish, say}) => {
        body.addEventListener('click', e => {
            const button = e.target.closest('[data-act=saveNotify]')
            if (!button) {
                return
            }
            record.meta.saves++
            for (const toggle of body.querySelectorAll('.switch')) {
                state.switches[toggle.dataset.mark] = toggle.classList.contains('checked')
            }
            busy(record, signal, button, () => {
                if (keys.every(key => state.switches[key] === wanted[key])) {
                    finish('Настройки уведомлений сохранены')
                } else {
                    record.meta.mismatches++
                    toast(frame, look, signal, 'Настройки уведомлений сохранены')
                    say(`Сохранено, но не всё как в задании: ${asked} и снова нажмите «Сохранить»`)
                }
            })
        })
    })

    for (const step of shuffle([removeAddress, changeMail])) {
        await step(look, state)
    }
}

function extra(previous) {
    const options = bonus.filter(([, step]) => step !== previous)
    let roll = Math.random() * options.reduce((sum, [weight]) => sum + weight, 0)
    return options.find(([weight]) => (roll -= weight) < 0)[1]
}

function measureHz(duration) {
    return new Promise(resolve => {
        const stamps = []
        const tick = time => {
            if (document.visibilityState !== 'visible' || !document.hasFocus()) {
                resolve(null)
                return
            }
            stamps.push(time)
            if (time - stamps[0] < duration) {
                requestAnimationFrame(tick)
                return
            }
            const deltas = stamps.slice(1).map((value, index) => value - stamps[index]).filter(delta => delta <= 100).sort((a, b) => a - b)
            const hz = deltas.length >= 10 ? Math.round(10000 / deltas[deltas.length >> 1]) / 10 : null
            resolve(hz >= 20 && hz <= 500 ? hz : null)
        }
        requestAnimationFrame(tick)
    })
}


async function updateHz() {
    while (displayHz === null) {
        const hz = await measureHz(2000)
        if (hz !== null) {
            displayHz = hz
            if ($('hz')) {
                $('hz').textContent = `${hz} Гц`
            }
            return
        }
        await new Promise(resolve => setTimeout(resolve, 1000))
    }
}


async function enter(step, intro) {
    section = step
    counter = ''
    if (intro) {
        await read(step.title, intro, 'Понятно, начать')
    }
    await step.run()
}


async function main() {
    section = {title: 'Начало'}
    examStart = (await setup()).tEnd
    measureHz(2000).then(hz => {
        if (hz !== null) {
            displayHz = hz
        }
    })
    for (const step of plan) {
        if (!remaining()) {
            break
        }
        await enter(step, step.intro)
    }
    let step = null
    while (remaining()) {
        step = extra(step)
        await enter(step)
    }
    section = {title: 'Готово'}
    counter = ''
    finished = true
    updateBar()
    finale()
}
