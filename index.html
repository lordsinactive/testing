const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/


function luminance(hue, saturation, lightness) {
    const chroma = (1 - Math.abs(2 * lightness - 1)) * saturation
    const second = chroma * (1 - Math.abs((hue / 60) % 2 - 1))
    const base = lightness - chroma / 2
    const sector = [[chroma, second, 0], [second, chroma, 0], [0, chroma, second], [0, second, chroma], [second, 0, chroma], [chroma, 0, second]][Math.floor(hue / 60) % 6]
    const linear = value => value <= 0.03928 ? value / 12.92 : ((value + 0.055) / 1.055) ** 2.4
    return sector.map(value => linear(value + base)).reduce((sum, value, index) => sum + value * [0.2126, 0.7152, 0.0722][index], 0)
}


function theme() {
    const hue = integer(0, 359)
    const dark = Math.random() < 0.25
    const colored = Math.random() < 0.3
    const card = dark ? `hsl(${hue} 14% 13%)` : '#fff'
    const saturation = integer(55, 85)
    let lightness = dark ? integer(58, 66) : integer(36, 46)
    const contrast = () => dark ? (luminance(hue, saturation / 100, lightness / 100) + 0.05) / 0.0546 : 1.05 / (luminance(hue, saturation / 100, lightness / 100) + 0.05)
    while (contrast() < 4.5 && lightness > 20 && lightness < 80) {
        lightness += dark ? 2 : -2
    }
    const vars = {
        brand: `hsl(${hue} ${saturation}% ${lightness}%)`,
        'on-brand': dark ? '#0b0f14' : '#fff',
        bg: dark ? `hsl(${hue} 16% 9%)` : pick(['#fff', `hsl(${hue} 35% 97%)`, '#f3f4f6']),
        card,
        field: dark ? `hsl(${hue} 14% 17%)` : '#fff',
        text: dark ? '#d5dbe3' : '#2b3038',
        strong: dark ? '#fff' : '#111418',
        dim: dark ? '#8d96a5' : '#6b7280',
        line: dark ? `hsl(${hue} 12% 24%)` : '#d9dee5',
        head: colored ? 'var(--s-brand)' : card,
        'head-text': colored ? 'var(--s-on-brand)' : 'var(--s-text)',
        radius: `${pick([0, 3, 6, 8, 12])}px`,
        font: pick(fontStacks),
        'head-height': `${integer(52, 72)}px`,
        width: `${integer(340, 480)}px`,
        max: `${integer(900, 1240)}px`,
        side: `${integer(180, 250)}px`,
    }
    const [name, domain] = pick(brands)
    return {
        name,
        domain,
        vars: [...Object.entries(vars).map(([key, value]) => `--s-${key}:${value}`), `color-scheme:${dark ? 'dark' : 'light'}`].join(';'),
        header: `${pick(['nav-left', 'nav-center', 'nav-right', 'logo-center'])}${colored ? ' colored' : ''}`,
        colored,
        layout: pick(['center', 'top', 'left', 'right']),
        nav: sample(navLinks, integer(3, 5)),
        account: shuffle(['Войти', 'Регистрация']),
        footer: sample(footerLinks, 4),
        since: integer(2008, 2022),
        hero: pick(heroes),
        cta: pick(['Попробовать', 'Начать', 'Подробнее', 'Смотреть каталог']),
        slogan: pick(slogans),
        stretch: Math.random() < 0.5,
        forgot: pick(['label', 'row', 'below']),
        okFirst: Math.random() < 0.25,
        corner: pick(['top-right', 'bottom-right', 'bottom-left', 'top']),
        flip: Math.random() < 0.2,
    }
}


function browse(look, frame, body, wide = false) {
    const header = `<header class="${look.header}"><a class="logo" data-mark="${look.name}"><i>${look.name[0]}</i>${look.name}</a><nav>${look.nav.map(link => `<a data-mark="${link}">${link}</a>`).join('')}</nav><div class="account">${look.account.map(label => `<button data-mark="${label}"${label === 'Регистрация' ? ' class="primary"' : ''}>${label}</button>`).join('')}</div></header>`
    const aside = wide || look.layout === 'center' || look.layout === 'top' ? '' : `<aside><h2>${look.name}</h2><p>${look.slogan}</p></aside>`
    frame.innerHTML = `<div class="site">${header}<main class="${wide ? 'wide' : look.layout}">${body}${aside}</main><footer><span>© ${look.name}, ${look.since}–2026</span>${look.footer.map(link => `<a data-mark="${link}">${link}</a>`).join('')}</footer></div>`
    return frame.querySelector('main')
}


function web(kind, step, instruction, look, setup) {
    return task(kind, instruction, ({record, signal, done}) => {
        record.meta = {step, site: look.name, loads: []}
        const view = add(`<div class="web"><div class="brief">${instruction}</div><div class="frame" style="${look.vars}"></div></div>`)
        const [brief, frame] = view.children
        frame.addEventListener('click', e => {
            const toggle = e.target.closest('.switch, .eye')
            if (toggle?.classList.contains('eye')) {
                const input = toggle.previousElementSibling
                input.type = input.type === 'password' ? 'text' : 'password'
                toggle.classList.toggle('shown', input.type === 'text')
                record.meta.reveals = (record.meta.reveals ?? 0) + 1
            } else if (toggle) {
                toggle.classList.toggle('checked')
            }
        })
        const say = text => {
            brief.textContent = text
        }
        setup({record, signal, done, frame, say})
    })
}


function delay(record, signal, show, list = record.meta.loads) {
    const start = ms(performance.now())
    later(signal, uniform(500, 5000), () => {
        if (show() !== false) {
            list.push([start, ms(performance.now())])
        }
    })
}


const skeleton = () => `<div class="skeleton">${Array.from({length: integer(4, 9)}, () => `<i style="width:${integer(30, 100)}%"></i>`).join('')}</div>`


function loadInto(record, signal, container, render) {
    container.innerHTML = Math.random() < 0.4 ? '<div class="spinner"></div>' : skeleton()
    delay(record, signal, render)
}


function busy(record, signal, button, then, leave = false) {
    const scope = button.closest('.sheet, .modal, .pop, .drop') ?? button
    const controls = [...scope.querySelectorAll('input, button')].filter(control => !control.disabled)
    for (const control of [button, ...controls]) {
        control.disabled = true
    }
    button.classList.add('busy')
    const main = button.closest('.site > main')
    if (leave && main && Math.random() < 0.5) {
        main.className = 'wide'
        main.innerHTML = skeleton()
    }
    delay(record, signal, () => {
        for (const control of [button, ...controls]) {
            control.disabled = false
        }
        button.classList.remove('busy')
        then()
    })
}


const field = (label, mark, attributes = '') => `<div class="field"><span>${label}</span><input data-mark="${mark}" autocomplete="off" spellcheck="false" ${attributes}></div>`
const secret = (label, mark) => `<div class="field">${label ? `<span>${label}</span>` : ''}<div class="secret"><input type="password" data-mark="${mark}" autocomplete="new-password" autocapitalize="off" spellcheck="false"><button class="eye" data-mark="Показать пароль">👁</button></div></div>`
const tick = (text, mark, type = 'checkbox', name = '') => `<label class="tick" data-mark="${mark}"><input type="${type}"${name ? ` name="${name}"` : ''}>${text}</label>`
const sheet = (look, body) => `<div class="sheet${look.stretch ? ' stretch' : ''}">${body}</div>`


function verify(checks, error) {
    for (const [element, ok] of checks) {
        element.classList.toggle('wrong', !ok)
    }
    const failed = checks.find(([, ok]) => !ok)
    error.textContent = failed?.[2] ?? ''
    return !failed
}


function toast(frame, look, signal, text) {
    const element = frame.appendChild(html(`<div class="toast ${look.corner}"><span>${text}</span><button class="close" data-mark="Закрыть уведомление">×</button></div>`))
    element.lastElementChild.addEventListener('click', () => element.remove())
    later(signal, 4000, () => element.remove())
}


function confirmBox(frame, look, title, text, ok, cancelled, confirmed) {
    const buttons = ['<button data-mark="Отмена">Отмена</button>', `<button class="primary" data-mark="${ok}">${ok}</button>`]
    const dialog = frame.appendChild(html(`<div class="backdrop"><div class="modal"><button class="close" data-mark="Закрыть окно">×</button><h2>${title}</h2><p class="muted">${text}</p><div class="buttons">${(look.okFirst ? buttons.reverse() : buttons).join('')}</div></div></div>`))
    const close = () => dialog.remove()
    dialog.addEventListener('click', e => {
        const button = e.target.closest('button')
        if (dialog.querySelector('.busy')) {
            return
        }
        if (button?.classList.contains('primary')) {
            confirmed(button, close)
        } else if (button || e.target === dialog) {
            close()
            cancelled()
        }
    })
}


const cookieGoals = [['accept', 'примите cookie кнопкой «Принять все»'], ['necessary', 'разрешите только необходимые cookie'], ['settings', 'откройте настройки cookie, выключите «Маркетинг» и сохраните выбор']]


function cookieBanner(record, frame, settle) {
    const style = pick(['bar', 'box', 'modal'])
    const choices = shuffle([['Принять все', 'accept'], ['Только необходимые', 'necessary'], ['Настройки', 'settings']])
    const body = `<div><h2>Мы используем cookie</h2><p class="muted">Они помогают сайту работать и подбирать предложения. Подробнее — в <a data-mark="Политика cookie">политике cookie</a>.</p></div><div class="buttons">${choices.map(([label, choice]) => `<button data-choice="${choice}" data-mark="${label}"${choice === 'accept' ? ' class="primary"' : ''}>${label}</button>`).join('')}</div>`
    const banner = frame.appendChild(html(style === 'modal' ? `<div class="backdrop"><div class="modal">${body}</div></div>` : `<div class="cookie ${style} ${pick(['left', 'right'])}">${body}</div>`))
    record.meta.cookieShown = ms(performance.now())
    mark(record, banner.querySelectorAll('button'))
    banner.addEventListener('click', e => {
        const choice = e.target.closest('[data-choice]')?.dataset.choice
        if (!choice) {
            return
        }
        banner.remove()
        if (choice === 'settings') {
            cookieSettings(record, frame, settle)
        } else {
            record.meta.cookieChoice = choice
            settle(choice, null)
        }
    })
}


function cookieSettings(record, frame, settle) {
    const kinds = [['Необходимые', true], ['Аналитика', Math.random() < 0.5], ['Маркетинг', true], ['Персонализация', Math.random() < 0.5]]
    const dialog = frame.appendChild(html(`<div class="backdrop"><div class="modal"><button class="close" data-mark="Закрыть настройки">×</button><h2>Настройки cookie</h2>${kinds.map(([label, on], index) => `<div class="setting"><span>${label}</span><button class="switch${on ? ' checked' : ''}" data-mark="${label}"${index ? '' : ' disabled'}></button></div>`).join('')}<div class="buttons"><button class="primary" data-mark="Сохранить выбор">Сохранить выбор</button></div></div></div>`))
    mark(record, dialog.querySelectorAll('[data-mark]'))
    dialog.addEventListener('click', e => {
        if (e.target.closest('.close')) {
            dialog.remove()
            cookieBanner(record, frame, settle)
        } else if (e.target.closest('.primary')) {
            const marketing = dialog.querySelectorAll('.switch')[2].classList.contains('checked')
            dialog.remove()
            record.meta.cookieChoice = 'settings'
            settle('settings', marketing)
        }
    })
}


const offers = [['Скидка 10% на первый заказ', 'Оставьте почту — пришлём промокод.'], ['Не пропустите распродажу', 'Подпишитесь на рассылку и узнавайте об акциях первыми.'], ['Подарок за подписку', 'Бесплатная доставка первого заказа для подписчиков.']]


function promo(record, frame, close) {
    const [title, text] = pick(offers)
    const cross = `close${Math.random() < 0.8 ? '' : ' left'}${Math.random() < 0.3 ? ' small' : ''}`
    const dialog = frame.appendChild(html(`<div class="backdrop"><div class="modal"><button class="${cross}" data-mark="×">×</button><h2>${title}</h2><p class="muted">${text}</p>${field('Электронная почта', 'Email подписки', 'type="email"')}<button class="primary" data-mark="Подписаться">Подписаться</button><a class="link" data-mark="Нет, спасибо">Нет, спасибо</a></div></div>`))
    record.meta.shown = ms(performance.now())
    mark(record, dialog.querySelectorAll('[data-mark]'))
    dialog.addEventListener('click', e => {
        const how = e.target === dialog ? 'backdrop' : e.target.closest('.close') ? 'cross' : e.target.closest('.link') ? 'decline' : e.target.closest('.primary') ? 'subscribe' : null
        if (how) {
            dialog.remove()
            record.meta.closed = how
            close()
        }
    })
}


const symbols = ['★', '●', '▲', '■', '♥', '◆']


function puzzle(record, frame, solved, cancelled) {
    const size = pick([3, 4])
    const goal = pick(symbols)
    const others = symbols.filter(symbol => symbol !== goal)
    const dialog = frame.appendChild(html(`<div class="backdrop"><div class="modal"><button class="close" data-mark="Закрыть проверку">×</button><h2>Выберите все клетки с ${goal}</h2><div class="cells" style="grid-template-columns:repeat(${size}, 1fr)"></div><p class="error"></p><div class="buttons"><button class="primary" data-mark="Подтвердить">Подтвердить</button></div></div></div>`))
    const grid = dialog.querySelector('.cells')
    const fill = () => {
        const count = integer(2, size + 1)
        const cells = shuffle([...Array(count).fill(goal), ...Array.from({length: size * size - count}, () => pick(others))])
        grid.innerHTML = cells.map((symbol, index) => `<button data-symbol="${symbol}" data-mark="Клетка ${index + 1}">${symbol}</button>`).join('')
        mark(record, grid.children)
    }
    fill()
    record.meta.puzzle = {size, errors: 0}
    dialog.addEventListener('click', e => {
        const cell = e.target.closest('[data-symbol]')
        if (cell) {
            cell.classList.toggle('picked')
        } else if (e.target.closest('.close')) {
            dialog.remove()
            cancelled()
        } else if (e.target.closest('.primary')) {
            if ([...grid.children].every(button => button.classList.contains('picked') === (button.dataset.symbol === goal))) {
                dialog.remove()
                solved()
            } else {
                record.meta.puzzle.errors++
                dialog.querySelector('.error').textContent = 'Не совсем. Попробуйте ещё раз.'
                fill()
            }
        }
    })
}


function robotCheck(record, signal, frame, slot, challenge) {
    const element = html(`<div class="robot"><button class="box" data-mark="Я не робот"></button><span>Я не робот</span><small>${pick(['АнтиБот', 'Страж', 'Барьер'])}<br>защита</small></div>`)
    slot.replaceWith(element)
    const box = element.firstElementChild
    let state = 'idle'
    const pass = () => {
        state = 'passed'
        box.classList.add('passed')
        box.textContent = '✓'
    }
    box.addEventListener('click', () => {
        if (state !== 'idle') {
            return
        }
        state = 'checking'
        box.innerHTML = '<div class="spinner"></div>'
        delay(record, signal, () => {
            if (!challenge) {
                pass()
                return
            }
            box.innerHTML = ''
            puzzle(record, frame, pass, () => {
                state = 'idle'
            })
        })
    })
    return {element, passed: () => state === 'passed'}
}


function showcase(look) {
    const [title, text] = look.hero
    return `<section class="hero"><h1>${title}</h1><p>${text}</p><button class="primary" data-mark="${look.cta}">${look.cta}</button></section><h2>Популярное</h2><div class="cards">${sample(goods, integer(4, 8)).map(name => `<div class="offer"><div class="pic"></div><b>${name}</b><span class="muted">${integer(5, 90) * 100 - 10} ₽</span><button data-mark="В корзину">В корзину</button></div>`).join('')}</div>`
}


function landing(kind, look, goal) {
    const cookie = Math.random() < 0.6 ? pick(cookieGoals) : null
    return web(kind, 'landing', `Сайт «${look.name}»: ${cookie ? `${cookie[1]}, затем ` : ''}нажмите «${goal}» вверху страницы`, look, ({record, signal, done, frame}) => {
        record.meta.cookie = cookie?.[0] ?? null
        const main = browse(look, frame, skeleton(), true)
        const button = frame.querySelector(`header [data-mark="${goal}"]`)
        mark(record, [button])
        button.addEventListener('click', () => busy(record, signal, button, done, true))
        delay(record, signal, () => {
            main.innerHTML = showcase(look)
            if (cookie) {
                later(signal, uniform(300, 1500), () => cookieBanner(record, frame, () => {}))
            }
        })
    })
}


function signupPage(look, step, instruction, body, checks, taken = null) {
    return web('signup', step, instruction, look, ({record, signal, done, frame, say}) => {
        Object.assign(record.meta, {submits: 0, errors: 0})
        const main = browse(look, frame, sheet(look, `${body}<p class="error"></p><button class="primary" data-mark="Далее">Далее</button>`))
        const page = main.querySelector('.sheet')
        const extras = {}
        if (page.querySelector('.month')) {
            extras.month = dropdown('Месяц', monthNames, signal)
            page.querySelector('.month').replaceWith(extras.month)
        }
        if (page.querySelector('.gender')) {
            extras.gender = dropdown('Пол', ['Мужской', 'Женский'], signal)
            page.querySelector('.gender').replaceWith(extras.gender)
        }
        if (page.querySelector('.robot-slot')) {
            extras.robot = robotCheck(record, signal, frame, page.querySelector('.robot-slot'), Math.random() < 0.4)
        }
        mark(record, page.querySelectorAll('[data-mark]'))
        const input = name => page.querySelector(`input[data-mark="${name}"]`)
        const button = page.querySelector('button.primary')
        const error = page.querySelector('.error')
        let rejected = taken === null ? undefined : null
        button.addEventListener('click', () => {
            record.meta.submits++
            const list = checks(input, extras, page)
            if (rejected) {
                list.unshift([rejected[0], rejected[0].value !== rejected[1], taken])
            }
            if (!verify(list, error)) {
                record.meta.errors++
                return
            }
            const reject = rejected === null
            busy(record, signal, button, () => {
                if (!reject) {
                    done()
                    return
                }
                const element = page.querySelector('input')
                rejected = [element, element.value]
                record.meta.rejected = true
                verify([[element, false, taken]], error)
                say('Сайт ответил, что это имя занято: придумайте другое и снова нажмите «Далее»')
            }, !reject)
        })
    })
}


async function signup() {
    const look = theme()
    const filled = (input, ...names) => names.map(name => [input(name), input(name).value.trim() !== '', 'Заполните все поля'])
    if (Math.random() < 0.6) {
        await landing('signup', look, 'Регистрация')
    }
    await signupPage(look, 'name', 'Регистрация: введите выдуманные имя и фамилию и нажмите «Далее»', `<span class="muted">Шаг 1 из 4</span><h1>Как вас зовут?</h1>${Math.random() < 0.5 ? `<div class="pair">${field('Имя', 'Имя')}${field('Фамилия', 'Фамилия')}</div>` : `${field('Имя', 'Имя')}${field('Фамилия', 'Фамилия')}`}`, input => filled(input, 'Имя', 'Фамилия'))
    await signupPage(look, 'birth', 'Регистрация: укажите любую дату рождения (день, месяц из списка, год), пол и нажмите «Далее»', `<span class="muted">Шаг 2 из 4</span><h1>Дата рождения и пол</h1><div class="field"><span>Дата рождения</span><div class="date"><input data-mark="День" placeholder="ДД" inputmode="numeric" maxlength="2" autocomplete="off"><div class="month"></div><input data-mark="Год" placeholder="ГГГГ" inputmode="numeric" maxlength="4" autocomplete="off"></div></div><div class="field"><span>Пол</span>${Math.random() < 0.5 ? '<div class="gender"></div>' : `<div class="ticks">${tick('Мужской', 'Мужской', 'radio', 'gender')}${tick('Женский', 'Женский', 'radio', 'gender')}</div>`}</div>`, (input, {month, gender}, page) => {
        const day = Number(input('День').value)
        const year = Number(input('Год').value)
        const sex = gender ?? page.querySelector('.ticks')
        return [
            [input('День'), Number.isInteger(day) && day >= 1 && day <= 31, 'Проверьте день рождения'],
            [month, Boolean(month.dataset.value), 'Выберите месяц'],
            [input('Год'), year >= 1920 && year <= 2012, 'Год рождения — от 1920 до 2012'],
            [sex, gender ? Boolean(gender.dataset.value) : Boolean(page.querySelector('input:checked')), 'Укажите пол'],
        ]
    })
    await signupPage(look, 'username', `Регистрация: придумайте любое имя для почты на ${look.domain}.mail (латиницей) и нажмите «Далее»`, `<span class="muted">Шаг 3 из 4</span><h1>Адрес почты</h1><p class="muted">Это будет ваш адрес и логин для входа.</p><div class="field"><span>Имя пользователя</span><div class="suffix"><input data-mark="Имя пользователя" autocomplete="off" autocapitalize="off" spellcheck="false"><span>@${look.domain}.mail</span></div></div>`, input => [[input('Имя пользователя'), /^[a-z0-9._-]{3,}$/i.test(input('Имя пользователя').value.trim()), 'Не меньше 3 символов: латинские буквы, цифры, точка']], Math.random() < 0.3 ? 'Это имя уже занято, придумайте другое' : null)
    await signupPage(look, 'password', 'Регистрация: придумайте любой пароль (от 6 символов), повторите его, примите условия и нажмите «Далее»', `<span class="muted">Шаг 4 из 4</span><h1>Пароль</h1>${secret('Пароль', 'Пароль')}${secret('Повторите пароль', 'Повтор пароля')}${Math.random() < 0.3 ? '<div class="robot-slot"></div>' : ''}${tick('Я принимаю <a data-mark="Условия">условия использования</a>', 'Принимаю условия')}`, (input, {robot}, page) => [
        [input('Пароль'), input('Пароль').value.length >= 6, 'Пароль — не короче 6 символов'],
        [input('Повтор пароля'), input('Повтор пароля').value === input('Пароль').value, 'Пароли не совпадают'],
        ...robot ? [[robot.element, robot.passed(), 'Подтвердите, что вы не робот']] : [],
        [page.querySelector('.tick'), page.querySelector('.tick input').checked, 'Нужно принять условия'],
    ])
    await signupPage(look, 'success', 'Регистрация завершена: нажмите «Далее»', `<div class="done-mark">✓</div><h1>Регистрация завершена</h1><p class="muted">Добро пожаловать в ${look.name}! Аккаунт готов.</p>`, () => [])
}


const providerButton = (name, label) => `<button class="provider" data-provider="${name}" data-mark="${name}"><i style="background:hsl(${providers.indexOf(name) * 67} 60% 45%)">${name[0]}</i>${label}</button>`


function loginSheet(look, extra = '') {
    const forgot = '<a class="link forgot" data-mark="Забыли пароль?">Забыли пароль?</a>'
    return sheet(look, `<h1>Вход</h1>${field('Электронная почта', 'Email', 'type="email" inputmode="email"')}${look.forgot === 'label' ? `<div class="split"><span>Пароль</span>${forgot}</div>` : ''}${secret(look.forgot === 'label' ? '' : 'Пароль', 'Пароль')}<div class="split">${tick('Запомнить меня', 'Запомнить меня')}${look.forgot === 'row' ? forgot : ''}</div><div class="robot-slot" hidden></div><p class="error"></p><button class="primary" data-mark="Войти">Войти</button>${look.forgot === 'below' ? forgot : ''}${extra}<p class="muted">Нет аккаунта? <a data-mark="Зарегистрироваться">Зарегистрироваться</a></p>`)
}


function loginForm(look) {
    const reveal = Math.random() < 0.5
    const remember = Math.random() < 0.5
    const fail = Math.random() < 0.4
    const captcha = fail && Math.random() < 0.5
    const asks = ['введите выдуманные email и пароль', ...reveal ? ['нажмите на глаз 👁, чтобы проверить пароль'] : [], ...remember ? ['отметьте «Запомнить меня»'] : []]
    return web('login', 'form', `Вход на сайт «${look.name}»: ${asks.join(', ')} и нажмите «Войти»`, look, ({record, signal, done, frame, say}) => {
        Object.assign(record.meta, {reveal, remember, fail, captcha, submits: 0, errors: 0, rejected: 0})
        const others = Math.random() < 0.5 ? `<span class="muted">или войдите через</span><div class="providers">${sample(providers, integer(2, 3)).map(name => providerButton(name, name)).join('')}</div>` : ''
        const page = browse(look, frame, loginSheet(look, others)).querySelector('.sheet')
        const email = page.querySelector('input[data-mark="Email"]')
        const password = page.querySelector('input[data-mark="Пароль"]')
        const button = page.querySelector('button.primary')
        const error = page.querySelector('.error')
        let robot = null
        mark(record, page.querySelectorAll('[data-mark]'))
        button.addEventListener('click', () => {
            record.meta.submits++
            const checks = [[email, emailPattern.test(email.value.trim()), 'Введите адрес почты, например name@mail.ru'], [password, password.value !== '', 'Введите пароль']]
            if (robot) {
                checks.push([robot.element, robot.passed(), 'Подтвердите, что вы не робот'])
            }
            if (!verify(checks, error)) {
                record.meta.errors++
                return
            }
            busy(record, signal, button, () => {
                if (fail && !record.meta.rejected) {
                    record.meta.rejected++
                    password.value = ''
                    verify([[password, false, 'Неверный email или пароль']], error)
                    if (captcha) {
                        const slot = page.querySelector('.robot-slot')
                        slot.hidden = false
                        robot = robotCheck(record, signal, frame, slot, Math.random() < 0.4)
                    }
                    say(`Сайт ответил «неверный пароль»: введите пароль ещё раз${captcha ? ', отметьте «Я не робот»' : ''} и снова нажмите «Войти»`)
                    return
                }
                record.meta.remembered = page.querySelector('.tick input').checked
                done()
            }, !fail || record.meta.rejected > 0)
        })
    })
}


function consent(record, signal, frame, look, provider, done) {
    const accounts = Array.from({length: integer(1, 3)}, person)
    const dialog = frame.appendChild(html(`<div class="backdrop"><div class="modal"><button class="close" data-mark="Закрыть">×</button><span class="muted">${provider}</span><h2>Выберите аккаунт</h2>${accounts.map((name, index) => `<button class="persona" data-mark="Аккаунт ${index + 1}"><i>${initials(name)}</i>${name}</button>`).join('')}<p class="muted">Сайт «${look.name}» получит ваше имя и адрес почты.</p><p class="error"></p><div class="buttons"><button data-mark="Отмена">Отмена</button><button class="primary" data-mark="Разрешить">Разрешить</button></div></div></div>`))
    mark(record, dialog.querySelectorAll('[data-mark]'))
    let chosen = null
    dialog.addEventListener('click', e => {
        const button = e.target.closest('button')
        if (dialog.querySelector('.busy')) {
            return
        }
        if (button?.classList.contains('persona')) {
            chosen?.classList.remove('current')
            chosen = button
            chosen.classList.add('current')
        } else if (button?.classList.contains('primary')) {
            if (chosen) {
                busy(record, signal, button, done)
            } else {
                dialog.querySelector('.error').textContent = 'Выберите аккаунт'
            }
        } else if (button || e.target === dialog) {
            dialog.remove()
        }
    })
}


function providerLogin(look) {
    const names = sample(providers, integer(3, 5))
    const goal = pick(names)
    return web('login', 'provider', `Вход на сайт «${look.name}»: войдите через «${goal}», выберите любой аккаунт и нажмите «Разрешить»`, look, ({record, signal, done, frame}) => {
        Object.assign(record.meta, {provider: goal, chosen: []})
        const page = browse(look, frame, sheet(look, `<h1>Войти в ${look.name}</h1><div class="providers column">${names.map(name => providerButton(name, `Продолжить с ${name}`)).join('')}</div><span class="muted">или по почте</span>${field('Электронная почта', 'Email', 'type="email"')}<button data-mark="Продолжить">Продолжить</button>`)).querySelector('.sheet')
        mark(record, page.querySelectorAll('[data-mark]'))
        page.addEventListener('click', e => {
            const button = e.target.closest('[data-provider]')
            if (button && !frame.querySelector('.backdrop')) {
                record.meta.chosen.push(button.dataset.provider)
                busy(record, signal, button, () => consent(record, signal, frame, look, button.dataset.provider, done))
            }
        })
    })
}


async function login() {
    const look = theme()
    if (Math.random() < 0.5) {
        await landing('login', look, 'Войти')
    }
    await (Math.random() < 0.3 ? providerLogin(look) : loginForm(look))
}


function forgotten(look) {
    return web('recover', 'login', `Вход на сайт «${look.name}»: вы не помните пароль — нажмите «Забыли пароль?»`, look, ({record, signal, done, frame}) => {
        const page = browse(look, frame, loginSheet(look)).querySelector('.sheet')
        const link = page.querySelector('.forgot')
        mark(record, page.querySelectorAll('[data-mark]'))
        link.addEventListener('click', () => {
            if (!page.querySelector('.busy')) {
                busy(record, signal, page.querySelector('button.primary'), done, true)
            }
        })
    })
}


function recoverPage(look, step, instruction, body, action, checks) {
    return web('recover', step, instruction, look, ({record, signal, done, frame}) => {
        Object.assign(record.meta, {submits: 0, errors: 0})
        const page = browse(look, frame, sheet(look, `${body}<p class="error"></p><button class="primary" data-mark="${action}">${action}</button>`)).querySelector('.sheet')
        const input = name => page.querySelector(`input[data-mark="${name}"]`)
        const button = page.querySelector('button.primary')
        mark(record, page.querySelectorAll('[data-mark]'))
        button.addEventListener('click', () => {
            record.meta.submits++
            if (verify(checks(input), page.querySelector('.error'))) {
                busy(record, signal, button, done, true)
            } else {
                record.meta.errors++
            }
        })
    })
}


function recoverCode(look) {
    const code = String(integer(0, 999999)).padStart(6, '0')
    const boxes = Math.random() < 0.6
    return web('recover', 'code', 'Дождитесь письма с кодом (появится на экране), введите код и нажмите «Подтвердить»', look, ({record, signal, done, frame}) => {
        Object.assign(record.meta, {boxes, errors: 0, resends: 0, mail: []})
        const entry = boxes ? `<div class="code">${Array.from({length: 6}, (_, index) => `<input data-mark="Цифра ${index + 1}" inputmode="numeric" autocomplete="off">`).join('')}</div>` : field('Код из письма', 'Код', 'inputmode="numeric" maxlength="6"')
        const page = browse(look, frame, sheet(look, `<h1>Проверьте почту</h1><p class="muted">Мы отправили письмо с шестизначным кодом. Письмо может прийти не сразу.</p>${entry}<p class="error"></p><button class="primary" data-mark="Подтвердить">Подтвердить</button><a class="link" data-mark="Отправить код ещё раз">Отправить код ещё раз</a>`)).querySelector('.sheet')
        const fields = [...page.querySelectorAll('input')]
        const button = page.querySelector('button.primary')
        const error = page.querySelector('.error')
        mark(record, page.querySelectorAll('[data-mark]'))
        const deliver = () => delay(record, signal, () => {
            frame.querySelector('.mail')?.remove()
            const mail = frame.appendChild(html(`<div class="mail"><button class="close" data-mark="Закрыть письмо">×</button><span class="muted">Новое письмо · ${look.name}</span><p>Код для сброса пароля:</p><big>${code.slice(0, 3)} ${code.slice(3)}</big></div>`))
            mail.firstElementChild.addEventListener('click', () => mail.remove())
        }, record.meta.mail)
        deliver()
        page.querySelector('.link').addEventListener('click', () => {
            record.meta.resends++
            deliver()
        })
        if (boxes) {
            const row = page.querySelector('.code')
            row.addEventListener('input', e => {
                const digits = e.target.value.replace(/\D/g, '')
                e.target.value = digits.slice(-1)
                if (digits) {
                    fields[fields.indexOf(e.target) + 1]?.focus()
                }
            })
            row.addEventListener('keydown', e => {
                if (e.key === 'Backspace' && !e.target.value) {
                    fields[fields.indexOf(e.target) - 1]?.focus()
                }
            })
        }
        button.addEventListener('click', () => {
            const typed = fields.map(input => input.value).join('').replace(/\D/g, '')
            if (verify(fields.map(input => [input, typed === code, typed.length < 6 ? 'Введите все 6 цифр' : 'Неверный код, проверьте письмо']), error)) {
                busy(record, signal, button, done, true)
            } else {
                record.meta.errors++
            }
        })
    })
}


async function recover() {
    const look = theme()
    await forgotten(look)
    await recoverPage(look, 'email', 'Восстановление пароля: введите выдуманный email и нажмите «Отправить код»', `<h1>Восстановление пароля</h1><p class="muted">Укажите почту, с которой вы регистрировались. Мы пришлём код для сброса пароля.</p>${field('Электронная почта', 'Email', 'type="email" inputmode="email"')}`, 'Отправить код', input => [[input('Email'), emailPattern.test(input('Email').value.trim()), 'Введите адрес почты, например name@mail.ru']])
    await recoverCode(look)
    await recoverPage(look, 'password', 'Придумайте новый пароль (любой, от 8 символов), повторите его и нажмите «Сохранить пароль»', `<h1>Новый пароль</h1><p class="muted">Не короче 8 символов.</p>${secret('Новый пароль', 'Новый пароль')}${secret('Повторите пароль', 'Повтор пароля')}`, 'Сохранить пароль', input => [
        [input('Новый пароль'), input('Новый пароль').value.length >= 8, 'Пароль — не короче 8 символов'],
        [input('Повтор пароля'), input('Повтор пароля').value === input('Новый пароль').value, 'Пароли не совпадают'],
    ])
    await recoverPage(look, 'success', 'Пароль изменён: нажмите «Войти»', '<div class="done-mark">✓</div><h1>Пароль изменён</h1><p class="muted">Теперь можно войти с новым паролем.</p>', 'Войти', () => [])
}

const planSets = [['Базовый', 'Стандарт', 'Премиум'], ['Старт', 'Команда', 'Бизнес'], ['Лайт', 'Плюс', 'Про']]
const planFeatures = [['Хранилище', 'Сколько файлов можно хранить в аккаунте.'], ['Поддержка', 'Как быстро отвечает служба поддержки.'], ['Пользователи', 'Сколько человек работают в одном аккаунте.'], ['Возврат денег', 'В течение 14 дней без объяснения причин.'], ['Резервные копии', 'Как часто сохраняются копии ваших данных.'], ['Интеграции', 'Подключение сторонних сервисов.']]


function tooltipWidget(look) {
    const plans = pick(planSets)
    const features = sample(planFeatures, 4)
    const [row, column] = [integer(0, 2), integer(0, 3)]
    return web('widget', 'tooltip', `Тарифы «${look.name}»: ${either('наведите курсор', 'нажмите')} на значок i у пункта «${features[column][0]}» в тарифе «${plans[row]}» и нажмите «Подробнее» в подсказке`, look, ({record, signal, done, frame}) => {
        Object.assign(record.meta, {plan: row, feature: column, opened: 0, wrong: 0})
        const main = browse(look, frame, skeleton(), true)
        delay(record, signal, () => {
            const prices = [0, integer(3, 6) * 100 - 1, integer(9, 15) * 100 - 1]
            main.innerHTML = `<h1>Тарифы</h1><p class="muted">Выберите подходящий тариф. Сменить его можно в любой момент.</p><div class="cards">${plans.map((plan, index) => `<div class="offer"><h2>${plan}</h2><big>${prices[index]} ₽/мес</big><ul>${features.map(([feature, text], line) => `<li>${feature}<span class="info"><button data-mark="i ${plan}: ${feature}">i</button><span class="tooltip"><span>${text} <a data-mark="Подробнее ${plan}: ${feature}"${index === row && line === column ? ' data-goal' : ''}>Подробнее</a></span></span></span></li>`).join('')}</ul><button class="primary" data-mark="Выбрать ${plan}">Выбрать</button></div>`).join('')}</div>`
            const infos = [...main.querySelectorAll('.info')]
            for (const info of infos) {
                info.addEventListener('pointerenter', e => {
                    if (e.pointerType === 'mouse') {
                        record.meta.opened++
                    }
                })
            }
            mark(record, [main.querySelector('[data-goal]').closest('.info').firstElementChild])
            main.addEventListener('click', e => {
                const info = e.target.closest('.info > button')?.parentElement
                if (info) {
                    const open = !info.classList.contains('open')
                    for (const other of infos) {
                        other.classList.toggle('open', open && other === info)
                    }
                }
                const link = e.target.closest('.tooltip a')
                if (link?.hasAttribute('data-goal')) {
                    done()
                } else if (link) {
                    record.meta.wrong++
                }
            })
        })
    })
}

function faqWidget(look) {
    const items = sample(faqItems, integer(6, 9))
    const goal = integer(0, items.length - 1)
    const single = Math.random() < 0.5
    return web('widget', 'faq', `Помощь на сайте «${look.name}»: откройте вопрос «${items[goal][0]}» и нажмите в ответе «${items[goal][2]}»`, look, ({record, signal, done, frame}) => {
        Object.assign(record.meta, {items: items.length, goal, opened: 0, wrong: 0})
        const main = browse(look, frame, skeleton(), true)
        delay(record, signal, () => {
            main.innerHTML = `<h1>Вопросы и ответы</h1><div class="faq">${items.map(([question, answer, action], index) => `<div><button class="q" data-mark="${question}">${question}</button><div class="answer" hidden><p>${answer}</p><button data-mark="${action}"${index === goal ? ' data-goal' : ''}>${action}</button></div></div>`).join('')}</div>`
            const questions = [...main.querySelectorAll('.q')]
            mark(record, [questions[goal]])
            main.addEventListener('click', e => {
                const question = e.target.closest('.q')
                const action = e.target.closest('.answer button')
                if (question) {
                    const answer = question.nextElementSibling
                    const open = answer.hidden
                    for (const other of questions) {
                        if (other === question || single) {
                            other.nextElementSibling.hidden = other !== question || !open
                            other.parentElement.classList.toggle('open', other === question && open)
                        }
                    }
                    record.meta.opened += open
                } else if (action?.hasAttribute('data-goal')) {
                    done()
                } else if (action) {
                    record.meta.wrong++
                }
            })
        })
    })
}

        const main = browse(look, frame, skeleton(), true)
        delay(record, signal, () => {
            main.innerHTML = `<div class="product"><div class="pic"></div><div class="buy"><h1>${name}</h1><span class="muted">★ 4.${integer(1, 9)} · ${integer(12, 480)} отзывов</span><big>${integer(5, 90) * 100 - 10} ₽</big><button class="primary" data-mark="В корзину">В корзину</button></div></div><div class="tabs">${Object.keys(panes).map(label => `<button data-tab="${label}" data-mark="${label}"${label === 'Описание' ? ' class="current"' : ''}>${label}</button>`).join('')}</div><div class="pane">${panes.Описание()}</div>`
            const pane = main.querySelector('.pane')
            mark(record, [main.querySelector(`[data-tab="${tab}"]`)])
            main.addEventListener('click', e => {
                const button = e.target.closest('[data-tab]')
                const inner = e.target.closest('.pane button')
                if (button) {
                    record.meta.switches++
                    for (const other of main.querySelectorAll('[data-tab]')) {
                        other.classList.toggle('current', other === button)
                    }
                    const label = button.dataset.tab
                    if (label === 'Отзывы' && !reviewsLoaded) {
                        reviewsLoaded = true
                        loadInto(record, signal, pane, () => {
                            if (main.querySelector('.tabs .current').dataset.tab === 'Отзывы') {
                                pane.innerHTML = panes.Отзывы()
                            }
                        })
                    } else {
                        pane.innerHTML = panes[label]()
                    }
                } else if (inner?.hasAttribute('data-goal')) {
                    done()
                } else if (inner) {
                    record.meta.wrong++
                }
            })
        })
    })
}

function office() {

    const channelsOn = Object.fromEntries(channels.map(channel => [channel, Math.random() < 0.5]))
    return {
        page: 'overview',
        tab: 'Профиль',
        filter: 'Все',
        pageIndex: 0,
        found: null,
        customer: 0,
        user: person(),
        customers,
        orders: Array.from({length: integer(36, 60)}, (_, index) => ({number: first + index, customer: pick(customers), date: day(), sum: integer(5, 400) * 100 - 10, status: pick(orderStatuses)})).reverse(),
        sections: [deskSections[0], ...shuffle(deskSections.slice(1, -1)), deskSections.at(-1)],
        products: sample(goods, 9).map(name => ({name, price: integer(5, 90) * 100 - 10, on: Math.random() < 0.7})),
        reports: sample(reportNames, 5).map(name => [name, day()]),
        stats: [['Выручка', `${integer(100, 990)} ${integer(100, 999)} ₽`], ['Заказы', integer(80, 900)], ['Клиенты', integer(300, 5000)], ['Конверсия', `${uniform(1, 6).toFixed(1)}%`]],
        notes: sample(noteTexts, 5).map(text => ({text, time: `${integer(2, 59)} мин назад`, read: Math.random() < 0.4})),

function ordersTable(state, rows, editable) {
    return `<table><tr><th>№</th><th>Клиент</th><th>Дата</th><th>Сумма</th><th>Статус</th>${editable ? '<th></th>' : ''}</tr>${rows.map(order => `<tr${order.number === state.found ? ' class="found"' : ''}><td>${order.number}</td><td>${order.customer}</td><td>${order.date}</td><td>${order.sum} ₽</td><td><span class="pill">${order.status}</span></td>${editable ? `<td><button data-act="edit:${order.number}" data-mark="Изменить ${order.number}">Изменить</button></td>` : ''}</tr>`).join('')}</table>`
}

const stat = (label, value) => `<div class="stat"><span class="muted">${label}</span><big>${value}</big></div>`
const figures = state => `<div class="stats">${['Посетители', 'Заказы', 'Средний чек'].map(label => stat(`${label} · ${state.period.toLowerCase()}`, integer(100, 9000))).join('')}</div>${chart(periodBars[state.period])}`

const switcher = (on, act, label) => `<button class="switch${on ? ' checked' : ''}" data-act="${act}" data-mark="${label}"></button>`

    products: state => `<h1>Товары</h1><div class="cards">${state.products.map((product, index) => `<div class="offer"><div class="pic"></div><b>${product.name}</b><span class="muted">${product.price} ₽</span><div class="setting" style="align-self:stretch"><span>В продаже</span>${switcher(product.on, `sale:${index}`, `В продаже: ${product.name}`)}</div><button data-act="remove:${index}" data-mark="Удалить ${product.name}">Удалить</button></div>`).join('')}</div>`,
    customers: state => `<h1>Клиенты</h1><div class="block"><table><tr><th>Имя</th><th>Заказов</th><th>Последний заказ</th><th></th></tr>${state.customers.map((name, index) => {

        return `<tr><td>${name}</td><td>${own.length}</td><td>${own[0]?.date ?? '—'}</td><td><button data-act="customer:${index}" data-mark="Открыть ${name}">Открыть</button></td></tr>`

    reports: state => `<h1>Отчёты</h1><div class="block rows">${state.reports.map(([name, date], index) => `<div class="split"><div><b>${name}</b><p class="muted">Обновлён ${date}</p></div><div class="drop"><button data-act="menu" data-mark="Экспорт: ${name}">Экспорт ▾</button><div class="pop" hidden>${formats.map(format => `<button data-act="export:${index}:${format}" data-mark="${format}">${format}</button>`).join('')}</div></div></div>`).join('')}</div>`,

function editOrder(record, signal, frame, order, saved) {
    const dialog = frame.appendChild(html(`<div class="backdrop"><div class="modal"><button class="close" data-mark="Закрыть окно">×</button><h2>Заказ №${order.number}</h2><p class="muted">${order.customer} · ${order.date} · ${order.sum} ₽</p><div class="field"><span>Статус</span><div class="status-slot"></div></div>${field('Комментарий', 'Комментарий')}<div class="buttons"><button data-mark="Отмена">Отмена</button><button class="primary" data-mark="Сохранить">Сохранить</button></div></div></div>`))
    const status = dropdown('Статус', orderStatuses, signal)
    status.dataset.value = status.firstElementChild.textContent = order.status
    dialog.querySelector('.status-slot').replaceWith(status)
    mark(record, dialog.querySelectorAll('[data-mark]'))
    dialog.addEventListener('click', e => {
        const button = e.target.closest('button')
        if (dialog.querySelector('.busy')) {
            return
        }
        if (button?.classList.contains('primary')) {
            busy(record, signal, button, () => {
                order.status = status.dataset.value
                dialog.remove()
                saved(order)
            })
        } else if (button || e.target === dialog) {
            dialog.remove()
        }
    })
}


function desk(record, signal, frame, look, state, emit) {
    frame.innerHTML = `<div class="app${look.flip ? ' flip' : ''}"><aside${look.colored ? ' class="colored"' : ''}><div class="logo"><i>${look.name[0]}</i>${look.name}</div>${state.sections.map(([id, label, icon]) => `<button data-act="page:${id}" data-mark="${label}"><span>${icon}</span>${label}</button>`).join('')}</aside><header><button class="burger" data-act="drawer" data-mark="Меню">☰</button><div class="search drop"><input data-mark="Поиск" placeholder="Поиск клиентов и заказов" autocomplete="off" spellcheck="false"><div class="pop" hidden data-private></div></div><span class="spacer"></span><div class="drop"><button class="bell" data-act="menu" data-mark="Уведомления"></button><div class="pop notes" hidden></div></div><div class="drop"><button class="user" data-act="menu" data-mark="Профиль"><i>${initials(state.user)}</i><span>${state.user}</span> ▾</button><div class="pop" hidden><button data-act="profile" data-mark="Мой профиль">Мой профиль</button><button data-act="page:settings" data-mark="Настройки">Настройки</button><button data-act="help" data-mark="Помощь">Помощь</button><button data-act="logout" data-mark="Выйти">Выйти</button></div></div></header><main></main></div>`
    const app = frame.firstElementChild
    const main = app.querySelector('main')
    const notes = app.querySelector('.notes')
    const chrome = () => {
        for (const button of app.querySelectorAll('aside [data-act]')) {
            button.classList.toggle('current', button.dataset.act === `page:${state.page === 'customer' ? 'customers' : state.page}`)
        }
        const unread = state.notes.filter(note => !note.read).length
        app.querySelector('.bell').innerHTML = `🔔${unread ? `<span class="badge">${unread}</span>` : ''}`
        notes.innerHTML = `<div class="split"><b>Уведомления</b><button data-act="readAll" data-mark="Прочитать все">Прочитать все</button></div>${state.notes.map((note, index) => `<button data-act="note:${index}" data-mark="${note.text}"${note.read ? '' : ' class="unread"'}><span>${note.text}</span><small class="muted">${note.time}</small></button>`).join('')}`
    }
    const draw = () => {
        main.innerHTML = deskPages[state.page](state)
        chrome()
    }
    const visit = (changes, then) => {
        Object.assign(state, changes)
        app.classList.remove('drawer')
        chrome()
        main.scrollTop = 0
        loadInto(record, signal, main, () => {
            draw()
            then?.()
        })
    }
    const pop = (title, text, ok, event, success) => confirmBox(frame, look, title, text, ok, () => emit(event, false), (button, close) => busy(record, signal, button, () => {
        close()
        if (success) {
            toast(frame, look, signal, success)
        }
        emit(event, true)
    }))
    const actions = {
        page: (_, id) => visit({page: id, pageIndex: 0, found: null, filter: 'Все'}),
        drawer: () => app.classList.toggle('drawer'),
        menu: button => {
            const list = button.nextElementSibling
            const open = list.hidden
            for (const other of app.querySelectorAll('.drop > .pop')) {
                other.hidden = true
            }
            list.hidden = !open
        },
        filter: (_, value) => visit({filter: value, pageIndex: 0}),
        turn: (_, index) => visit({pageIndex: Number(index)}),
        edit: (_, number) => editOrder(record, signal, frame, state.orders.find(order => order.number === Number(number)), order => {
            draw()
            toast(frame, look, signal, `Заказ №${order.number} сохранён`)
            emit('order', order)
        }),
        order: (_, number) => visit({page: 'orders', filter: 'Все', pageIndex: Math.floor(state.orders.findIndex(order => order.number === Number(number)) / perPage), found: Number(number)}),
        customer: (_, index) => visit({page: 'customer', customer: Number(index)}, () => emit('customer', state.customers[index])),
        sale: (button, index) => {
            const product = state.products[index]
            product.on = button.classList.contains('checked')
            toast(frame, look, signal, `«${product.name}» ${product.on ? 'снова в продаже' : 'снят с продажи'}`)
            emit('sale', product)
        },
        remove: (_, index) => {
            const product = state.products[index]
            confirmBox(frame, look, 'Удалить товар?', `«${product.name}» пропадёт из каталога.`, 'Удалить', () => emit('remove', [product, false]), (button, close) => busy(record, signal, button, () => {
                state.products.splice(state.products.indexOf(product), 1)
                close()
                draw()
                toast(frame, look, signal, `Товар «${product.name}» удалён`)
                emit('remove', [product, true])
            }))
        },
        period: (_, value) => {
            state.period = value
            for (const button of main.querySelectorAll('.segmented button')) {
                button.classList.toggle('current', button.dataset.act === `period:${value}`)
            }
            const area = main.querySelector('.figures')
            loadInto(record, signal, area, () => {
                area.innerHTML = figures(state)
                emit('period', value)
            })
        },
        export: (button, index, format) => {
            const trigger = button.closest('.drop').firstElementChild
            busy(record, signal, trigger, () => {
                toast(frame, look, signal, `Файл «${state.reports[index][0]}.${format.toLowerCase()}» готов`)
                emit('export', [state.reports[index][0], format])
            })
        },
        tab: (_, value) => {
            state.tab = value
            draw()
        },
        twofa: button => {
            if (!button.classList.contains('checked')) {
                state.twofa = false
                toast(frame, look, signal, 'Двухфакторная защита выключена')
                return
            }
            confirmBox(frame, look, 'Включить двухфакторную защиту?', 'При входе понадобится код из приложения-аутентификатора.', 'Включить', () => button.classList.remove('checked'), (ok, close) => busy(record, signal, ok, () => {
                state.twofa = true
                close()
                toast(frame, look, signal, 'Двухфакторная защита включена')
                emit('twofa')
            }))
        },
        alerts: button => {
            state.alerts = button.classList.contains('checked')
        },
        sessions: () => pop('Завершить другие сеансы?', 'На других устройствах придётся войти заново.', 'Завершить', 'sessions', 'Другие сеансы завершены'),
        channel: (button, channel) => {
            state.channels[channel] = button.classList.contains('checked')
        },
        saveChannels: button => busy(record, signal, button, () => {
            state.saved = {...state.channels}
            toast(frame, look, signal, 'Настройки уведомлений сохранены')
            emit('channels')
        }),
        saveProfile: button => busy(record, signal, button, () => toast(frame, look, signal, 'Профиль сохранён')),
        readAll: () => {
            for (const note of state.notes) {
                note.read = true
            }
            chrome()
            emit('readAll')
        },
        note: (_, index) => {
            state.notes[index].read = true
            chrome()
        },
        profile: () => visit({page: 'settings', tab: 'Профиль'}),
        help: () => {},
        logout: () => pop('Выйти из аккаунта?', 'Несохранённые изменения пропадут.', 'Выйти', 'logout', null),
    }
    draw()
    mark(record, app.querySelectorAll('aside [data-mark], header [data-mark]'))
    frame.addEventListener('click', e => {
        const element = e.target.closest('[data-act]')
        if (!element) {
            return
        }
        const list = element.closest('.pop')
        if (list && !list.classList.contains('notes')) {
            list.hidden = true
        }
        const [act, ...args] = element.dataset.act.split(':')
        actions[act](element, ...args)
    })
    addEventListener('pointerdown', e => {
        for (const list of app.querySelectorAll('.drop > .pop:not([hidden])')) {
            if (!list.parentElement.contains(e.target)) {
                list.hidden = true
            }
        }
    }, {signal})

    const search = app.querySelector('.search input')
    const results = search.nextElementSibling
    let query = 0
    search.addEventListener('focus', () => {
        results.hidden = !search.value.trim()
    })
    search.addEventListener('input', () => {
        const token = ++query
        const text = search.value.trim().toLowerCase()
        results.hidden = !text
        results.innerHTML = '<div class="spinner"></div>'
        later(signal, 300, () => token === query && text && delay(record, signal, () => {
            if (token !== query) {
                return false
            }
            const people = state.customers.map((name, index) => [name, index]).filter(([name]) => name.toLowerCase().includes(text)).slice(0, 5)
            const orders = state.orders.filter(order => String(order.number).includes(text)).slice(0, 4)
            const found = [...people.map(([name, index]) => [`customer:${index}`, name, 'клиент']), ...orders.map(order => [`order:${order.number}`, `Заказ №${order.number}`, order.customer])]
            results.innerHTML = found.map(([act, text, note], index) => `<button data-act="${act}" data-mark="Результат ${index + 1}"><span>${text}</span><small class="muted">${note}</small></button>`).join('') || '<p class="muted">Ничего не найдено</p>'
        }))
    })
}


const panelOps = {
    twofa: state => ({
        instruction: 'Откройте Настройки → Безопасность и включите двухфакторную защиту',
        prepare: () => {
            state.twofa = false
        },
        goal: event => event === 'twofa',
    }),
    order: state => {
        const order = pick(state.orders.slice(perPage))
        const status = pick(orderStatuses.filter(value => value !== order.status))
        return {
            instruction: `Найдите в разделе «Заказы» заказ №${order.number}, нажмите «Изменить», поставьте статус «${status}» и сохраните`,
            meta: {order: order.number, status},
            goal: (event, value) => event === 'order' && value === order && order.status === status,
        }
    },
    bell: state => ({
        instruction: 'Откройте уведомления (колокольчик вверху) и нажмите «Прочитать все»',
        prepare: () => {
            for (const note of sample(state.notes, integer(2, 4))) {
                note.read = false
            }
        },
        goal: event => event === 'readAll',
    }),
    logout: state => {
        const confirm = Math.random() < 0.6
        return {
            instruction: `Откройте меню профиля (${state.user}, вверху справа), нажмите «Выйти» и ${confirm ? 'подтвердите выход' : 'в окне подтверждения передумайте: «Отмена»'}`,
            meta: {confirm},
            goal: (event, value) => event === 'logout' && value === confirm,
        }
    },
    remove: state => {
        const product = pick(state.products)
        const confirm = Math.random() < 0.7
        return {
            instruction: `В разделе «Товары» удалите «${product.name}»${confirm ? ' и подтвердите удаление' : ', но в окне подтверждения нажмите «Отмена»'}`,
            meta: {product: product.name, confirm},
            goal: (event, value) => event === 'remove' && value[0] === product && value[1] === confirm,
        }
    },
    sale: state => {
        const product = pick(state.products)
        const on = !product.on
        return {
            instruction: `В разделе «Товары» ${on ? 'верните в продажу' : 'снимите с продажи'} «${product.name}» (переключатель «В продаже»)`,
            meta: {product: product.name, on},
            goal: (event, value) => event === 'sale' && value === product && product.on === on,
        }
    },
    period: state => {
        const period = pick(periods.filter(value => value !== state.period))
        return {
            instruction: `Откройте «Аналитика» и переключите период на «${period}»`,
            meta: {period},
            goal: (event, value) => event === 'period' && value === period,
        }
    },
    search: state => {
        const name = pick(state.customers)
        return {
            instruction: `Через поиск вверху найдите клиента «${name}» и откройте его карточку`,
            meta: {customer: name},
            goal: (event, value) => event === 'customer' && value === name,
        }
    },
    channels: state => {
        const wanted = Object.fromEntries(channels.map(channel => [channel, Math.random() < 0.5]))
        if (channels.every(channel => wanted[channel] === state.saved[channel])) {
            wanted.SMS = !wanted.SMS
        }
        const changes = channels.filter(channel => wanted[channel] !== state.saved[channel])
        return {
            instruction: `Откройте Настройки → Уведомления, ${changes.map(channel => `${wanted[channel] ? 'включите' : 'выключите'} «${channel}»`).join(', ')} и нажмите «Сохранить»`,
            meta: {wanted},
            goal: event => event === 'channels' && channels.every(channel => state.saved[channel] === wanted[channel]),
        }
    },
    export: state => {
        const [report] = pick(state.reports)
        const format = pick(formats)
        return {
            instruction: `Откройте «Отчёты» и выгрузите «${report}» в формате ${format} (кнопка «Экспорт»)`,
            meta: {report, format},
            goal: (event, value) => event === 'export' && value[0] === report && value[1] === format,
        }
    },
    sessions: () => ({
        instruction: 'Откройте Настройки → Безопасность, завершите другие сеансы и подтвердите',
        goal: (event, value) => event === 'sessions' && value,
    }),
}


function panelStep(look, state, name) {
    const op = panelOps[name](state)
    return web('panel', name, op.instruction, look, ({record, signal, done, frame}) => {
        Object.assign(record.meta, op.meta)
        op.prepare?.()
        desk(record, signal, frame, look, state, (event, value) => op.goal(event, value) && done())
    })
}


async function panel() {
    const look = theme()
    const state = office()
    const names = sample(Object.keys(panelOps), integer(3, 5))
    if (names.includes('logout')) {
        names.push(...names.splice(names.indexOf('logout'), 1))
    }
    for (const name of names) {
        await panelStep(look, state, name)
    }
}

function extra(previous) {
    const options = bonus.filter(([, step]) => step !== previous)
    let roll = Math.random() * options.reduce((sum, [weight]) => sum + weight, 0)
    return options.find(([weight]) => (roll -= weight) < 0)[1]
}

function measureHz(duration) {
    return new Promise(resolve => {
        const stamps = []
        const tick = time => {
            if (document.visibilityState !== 'visible' || !document.hasFocus()) {
                resolve(null)
                return
            }
            stamps.push(time)
            if (time - stamps[0] < duration) {
                requestAnimationFrame(tick)
                return
            }
            const deltas = stamps.slice(1).map((value, index) => value - stamps[index]).filter(delta => delta <= 100).sort((a, b) => a - b)
            const hz = deltas.length >= 10 ? Math.round(10000 / deltas[deltas.length >> 1]) / 10 : null
            resolve(hz >= 20 && hz <= 500 ? hz : null)
        }
        requestAnimationFrame(tick)
    })
}


async function updateHz() {
    while (displayHz === null) {
        const hz = await measureHz(2000)
        if (hz !== null) {
            displayHz = hz
            if ($('hz')) {
                $('hz').textContent = `${hz} Гц`
            }
            return
        }
        await new Promise(resolve => setTimeout(resolve, 1000))
    }
}


async function enter(step, intro) {
    section = step
    counter = ''
    if (intro) {
        await read(step.title, intro, 'Понятно, начать')
    }
    await step.run()
}


async function main() {
    section = {title: 'Начало'}
    examStart = (await setup()).tEnd
    measureHz(2000).then(hz => {
        if (hz !== null) {
            displayHz = hz
        }
    })
    for (const step of plan) {
        if (!remaining()) {
            break
        }
        await enter(step, step.intro)
    }
    if (remaining()) {
        await enter({title: 'Дополнительные задания', run: () => read('Дополнительные задания', [`Основные задания пройдены. До конца экзамена ещё ${clock(remaining())} — дальше случайные задания из разных блоков.`, 'Отчёт можно будет скачать, когда пройдёт 20 минут и закончится текущий блок.'], 'Продолжить')})
    }
    let step = null
    while (remaining()) {
        step = extra(step)
        await enter(step)
    }
    section = {title: 'Готово'}
    counter = ''
    finished = true
    updateBar()
    finale()
}
