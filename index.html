<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Lordium — Экзамен</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#0b0e14; --panel:#131924; --panel2:#0f141c; --field:#0a0e15; --button:#1a2231; --border:#27313f; --line:#1c2431; --thumb:#36445a;
    --text:#cfd8e3; --strong:#f3f6fa; --dim:#8a96a8; --faint:#5e6a7c;
    --accent:#4d8dff; --accent2:#2ec4ee; --accent-hover:#6aa0ff; --on-accent:#06101f; --accent-soft:rgba(77,141,255,.14); --accent-line:rgba(77,141,255,.45);
    --good:#36d399; --good-soft:rgba(54,211,153,.1); --bad:#ff6b6b; --warn:#f5b73b; --warn-soft:rgba(245,183,59,.16); --mod:#a98bff;
    --t-click:#4d8dff; --on-click:#06101f; --t-double:#a98bff; --on-double:#120a2a; --t-right:#f5b73b; --on-right:#2a1b00;
    --grid:rgba(255,255,255,.05);
    --shadow:0 10px 30px rgba(0,0,0,.45);
    --mono:'SF Mono','Cascadia Code','JetBrains Mono',Consolas,'Liberation Mono',monospace;
    --bar:32px;
  }
  @media (prefers-color-scheme: light){
    :root{
      color-scheme:light;
      --bg:#eef1f5; --panel:#fff; --panel2:#f3f5f9; --field:#f6f8fb; --button:#f7f8fb; --border:#d5dbe5; --line:#e6eaf0; --thumb:#b9c2d0;
      --text:#222a36; --strong:#0f141b; --dim:#5a6577; --faint:#8b95a5;
      --accent:#2458e5; --accent2:#0a9bd1; --accent-hover:#1b49c7; --on-accent:#fff; --accent-soft:rgba(36,88,229,.1); --accent-line:rgba(36,88,229,.35);
      --good:#0f9f6e; --good-soft:rgba(15,159,110,.1); --bad:#d7333c; --warn:#9a5a00; --warn-soft:rgba(228,160,20,.18); --mod:#6d3fe0;
      --t-click:#2458e5; --on-click:#fff; --t-double:#7c4dff; --on-double:#fff; --t-right:#f3b32a; --on-right:#2a1b00;
      --grid:rgba(20,30,50,.09);
      --shadow:0 8px 24px rgba(20,30,50,.08);
    }
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0; height:100%; overscroll-behavior:none}
  body{background:var(--bg); color:var(--text); font:13px/1.55 var(--mono); overflow:hidden; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:manipulation; -webkit-tap-highlight-color:transparent}
  button:focus-visible, a:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  #bar{position:fixed; z-index:30; inset:0 0 auto; height:var(--bar); display:flex; align-items:center; gap:10px; padding:0 12px; background:var(--panel); border-bottom:1px solid var(--border); font-size:12px; white-space:nowrap}
  #section{position:relative; flex:0 1 auto; min-width:0; padding-left:16px; overflow:hidden; text-overflow:ellipsis; color:var(--strong); font-weight:bold}
  #section::before{content:''; position:absolute; left:0; top:50%; width:8px; height:8px; margin-top:-4px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  #counter{flex:none; padding:0 8px; border-radius:999px; background:var(--panel2); border:1px solid var(--line); color:var(--dim); font-size:11px; line-height:18px}
  #counter:empty{display:none}
  .spacer{flex:1}
  #remaining{flex:none; color:var(--strong)}
  #notice{flex:none; padding:0 9px; border-radius:999px; background:var(--warn-soft); color:var(--warn); font-size:11px; line-height:20px}
  #bar button{flex:none; padding:3px 9px; border-radius:999px; background:transparent; font-size:11px; transition:background-color .12s, border-color .12s}
  #bar button:hover{background:var(--accent-soft)}
  #bar button svg{vertical-align:-1px}
  #bar button.on{background:var(--accent)}
  #bar a{flex:none; padding:4px 12px; border-radius:999px; background:var(--accent); color:var(--on-accent); font-weight:bold; text-decoration:none}
  #bar a:hover{background:var(--accent-hover)}
  .progress{position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--line)}
  .progress > i{display:block; height:100%; width:0; background:linear-gradient(90deg, var(--accent), var(--accent2)); transition:width .25s}
  #stage{position:fixed; inset:0}
  .screen{position:absolute; inset:var(--bar) 0 0; display:flex; padding:24px; overflow-y:auto; background-image:radial-gradient(var(--grid) 1px, transparent 1.5px); background-size:22px 22px}
  .card{position:relative; margin:auto; width:min(680px,100%); padding:20px 22px; display:flex; flex-direction:column; gap:12px; background:var(--panel); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow)}
  .card::before{content:''; position:absolute; inset:-1px -1px auto; height:3px; border-radius:14px 14px 0 0; background:linear-gradient(90deg, var(--accent), var(--accent2))}
  .card h2{margin:0; font-size:15px; color:var(--strong)}
  .card p{margin:0}
  b{color:var(--warn); font-weight:normal}
  .hint{color:var(--dim)}
  .actions{display:flex; justify-content:flex-end; align-items:center; gap:12px}
  .msg{flex:1; color:var(--bad)}
  .float{position:absolute}
  .tip{position:absolute; top:calc(var(--bar) + 14px); left:50%; transform:translateX(-50%); padding:8px 14px; background:var(--panel); border:1px solid var(--border); border-radius:999px; color:var(--strong); box-shadow:var(--shadow)}
  button{font:12px var(--mono); background:var(--button); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:6px 12px; cursor:pointer}
  button:where(:not(:disabled)):hover{border-color:var(--accent); color:var(--strong); background:var(--accent-soft)}
  button.on{background:var(--accent); color:var(--on-accent); border-color:var(--accent); font-weight:bold}
  button.on:where(:not(:disabled)):hover{background:var(--accent-hover); border-color:var(--accent-hover); color:var(--on-accent)}
  button.big{font-size:14px; padding:10px 18px}
  button:disabled{opacity:.4; cursor:not-allowed}
  input,textarea{font:13px var(--mono); background:var(--field); color:var(--strong); border:1px solid var(--border); border-radius:8px; padding:6px 9px; outline:none; user-select:text}
  input::placeholder,textarea::placeholder{color:var(--faint)}
  input:focus,textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  textarea{width:100%; resize:none}
  .wrong{outline:1px solid var(--bad); outline-offset:3px; border-radius:8px}
  .form{display:grid; grid-template-columns:auto 1fr; gap:10px 16px; align-items:center}
  .form > span{color:var(--dim)}
  .choices{display:flex; flex-wrap:wrap; gap:6px}
  .chip{display:inline-flex; align-items:center; gap:6px; padding:5px 11px; background:var(--button); border:1px solid var(--border); border-radius:20px; color:var(--dim); cursor:pointer}
  .chip:hover{border-color:var(--accent); color:var(--text)}
  .chip:has(input:checked){border-color:var(--accent); background:var(--accent-soft); color:var(--accent)}
  .chip:has(input:focus-visible){box-shadow:0 0 0 3px var(--accent-soft)}
  .chip input{margin:0; accent-color:var(--accent)}
  .grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
  .answers{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .answers button{padding:12px}
  .phrase{padding:8px 10px; border:1px dashed var(--accent); border-radius:8px; background:var(--accent-soft); color:var(--strong)}
  .countdown{font-size:48px; color:var(--accent); text-align:center}
  .summary{display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:10px}
  .summary > div{padding:12px 14px; background:var(--field); border:1px solid var(--line); border-radius:10px}
  .summary span{display:block; font-size:11px; color:var(--dim)}
  .summary strong{display:block; margin-top:2px; font-size:22px; line-height:1.3; color:var(--strong)}
  .spinner{width:28px; height:28px; border:3px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .target{position:absolute; display:flex; align-items:center; justify-content:center; overflow:hidden; background:var(--t-click); color:var(--on-click); border-radius:4px; font-size:11px; font-weight:bold; cursor:pointer}
  .target.circle{border-radius:50%}
  .target.double{background:var(--t-double); color:var(--on-double)}
  .target.right{background:var(--t-right); color:var(--on-right)}
  .dropdown{position:relative; width:280px}
  .form .dropdown{width:auto}
  .dropdown .current{padding:6px 9px; background:var(--field); border:1px solid var(--border); border-radius:8px; cursor:pointer}
  .dropdown .current:hover{border-color:var(--accent)}
  .dropdown .current::after{content:'▾'; float:right; color:var(--dim)}
  .dropdown .options{position:absolute; z-index:5; inset:100% 0 auto; margin-top:2px; max-height:200px; overflow-y:auto; background:var(--panel); border:1px solid var(--accent); border-radius:8px; box-shadow:var(--shadow)}
  .dropdown .options > div{padding:5px 10px; cursor:pointer}
  .dropdown .options > div:hover{background:var(--accent); color:var(--on-accent)}
  .menubar ul{list-style:none; margin:0; padding:4px 0; background:var(--panel); border:1px solid var(--border); border-radius:8px}
  .menubar > ul{display:flex; padding:0; box-shadow:var(--shadow)}
  .menubar li{position:relative; padding:6px 14px; white-space:nowrap; cursor:pointer}
  .menubar > ul > li{border-radius:7px}
  .menubar ul ul{visibility:hidden; position:absolute; z-index:5; left:100%; top:-5px; min-width:170px; box-shadow:var(--shadow); transition:visibility 0s .25s}
  .menubar > ul > li > ul{left:0; top:100%}
  .menubar li.open{background:var(--accent-soft)}
  .menubar li.open > span{color:var(--strong)}
  .menubar li.open > ul{visibility:visible; z-index:6; transition-delay:0s}
  @media (hover:hover){
    .target:hover{filter:brightness(1.25)}
    .menubar li:hover{background:var(--accent-soft)}
    .menubar li:hover > span{color:var(--strong)}
    .menubar li:hover > ul{visibility:visible; z-index:6; transition-delay:0s}
    .menubar ul ul li:hover > ul{transition-delay:.15s}
    .list .item:hover{background:var(--panel2)}
    .scroller .row:hover, .tile:hover{background:var(--panel2)}
    .scroller .goal:hover{background:var(--accent-hover)}
    .post:hover{border-color:var(--accent-line)}
    .page h3:hover{color:var(--accent)}
  }
  .menubar ul ul li.sub > span::after{content:' ▸'; color:var(--dim)}
  .list{overflow-y:auto; overscroll-behavior:contain; background:var(--panel); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow)}
  .list .item{display:flex; align-items:center; gap:12px; padding:8px 12px; border-bottom:1px solid var(--line)}
  .list .item span:first-child{flex:1; color:var(--strong)}
  .list .status{width:100px; color:var(--dim)}
  .slider{height:28px; cursor:pointer; touch-action:none}
  .slider::before{content:''; position:absolute; inset:12px 0 auto; height:4px; border-radius:2px; background:linear-gradient(90deg, var(--accent) var(--fill, 0%), var(--border) 0)}
  .slider .handle{position:absolute; top:3px; width:22px; height:22px; margin-left:-11px; border-radius:50%; background:var(--panel); border:3px solid var(--accent); box-shadow:0 2px 8px rgba(0,0,0,.35)}
  .cargo{width:64px; height:64px; display:flex; align-items:center; justify-content:center; background:var(--t-click); color:var(--on-click); border-radius:10px; font-weight:bold; cursor:grab; touch-action:none; box-shadow:var(--shadow)}
  .slot{width:88px; height:88px; border:2px dashed var(--good); border-radius:12px; background:var(--good-soft)}
  .paged, .paged body{height:auto}
  .paged body{overflow:visible}
  .paged #stage{position:static; height:auto !important}
  .paged .tip{position:fixed; top:auto; bottom:14px; pointer-events:none}
  .page{max-width:640px; margin:0 auto; padding:calc(var(--bar) + 24px) 24px 64px}
  .page h1{margin:0 0 12px; font-size:18px; color:var(--strong)}
  .page h3{margin:28px 0 8px; font-size:15px; color:var(--strong); cursor:pointer}
  .page p{margin:0 0 10px}
  .page .actions{margin-top:24px}
  .banner{margin:12px 0; padding:10px 14px; background:var(--accent-soft); border:1px solid var(--accent-line); border-radius:10px; color:var(--strong)}
  .scroller{overflow:auto; overscroll-behavior:contain; background:var(--field); border:1px solid var(--border); border-radius:10px}
  .scroller .row{padding:8px 12px; border-bottom:1px solid var(--line); cursor:pointer}
  .scroller .goal{background:var(--accent); color:var(--on-accent); font-weight:bold}
  .scroller.wide{display:flex; gap:10px; padding:10px; overflow-y:hidden}
  .tile{flex:0 0 120px; height:110px; display:flex; align-items:center; justify-content:center; text-align:center; background:var(--panel); border:1px solid var(--border); border-radius:10px; cursor:pointer}
  .scroller.thick::-webkit-scrollbar{width:16px; height:16px}
  .scroller.thick::-webkit-scrollbar-thumb{background:var(--thumb); border:3px solid var(--field); border-radius:8px}
  .scroller.thick::-webkit-scrollbar-track{background:var(--field)}
  .scroller.prose{padding:12px 16px}
  .scroller.prose p{margin:0 0 10px}
  .post{margin:0 0 12px; padding:10px 14px; background:var(--panel); border:1px solid var(--border); border-radius:10px; cursor:pointer}
  .post p:first-child{color:var(--dim)}
  .post p:last-child{margin:0}
  .post.goal{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent); background:var(--accent-soft); color:var(--strong)}
  .web{position:absolute; inset:var(--bar) 0 0; display:flex; flex-direction:column}
  .brief{flex:none; padding:7px 14px; background:var(--accent-soft); border-bottom:1px solid var(--accent-line); color:var(--strong); text-align:center}
  .frame{position:relative; flex:1; min-height:0; overflow:hidden; background:var(--s-bg); color:var(--s-text); font:14px/1.5 var(--s-font)}
  .frame b{color:inherit; font-weight:600}
  .frame a{color:var(--s-brand); cursor:pointer; text-decoration:underline; text-underline-offset:2px}
  .frame h1{margin:0; font-size:24px; line-height:1.25; color:var(--s-strong)}
  .frame h2{margin:0; font-size:17px; color:var(--s-strong)}
  .frame p{margin:0}
  .frame big{font-size:22px; color:var(--s-strong)}
  .frame button, .frame input{font:inherit; color:var(--s-text); background:var(--s-field); border:1px solid var(--s-line); border-radius:var(--s-radius)}
  .frame button{padding:8px 16px}
  .frame button:hover{border-color:var(--s-brand); color:var(--s-text)}
  .frame button:disabled{opacity:.6; cursor:default}
  .frame button.primary{background:var(--s-brand); border-color:var(--s-brand); color:var(--s-on-brand); font-weight:600}
  .frame button.primary:hover{color:var(--s-on-brand); filter:brightness(1.08)}
  .frame input{width:100%; padding:9px 12px}
  .frame input:focus{border-color:var(--s-brand); box-shadow:0 0 0 3px color-mix(in srgb, var(--s-brand) 25%, transparent)}
  .frame input:disabled{opacity:.6}
  .frame input::placeholder{color:var(--s-dim); opacity:.8}
  .frame .close:hover, .frame .eye:hover{color:var(--s-strong); opacity:1}
  .frame :focus-visible{outline-color:var(--s-brand)}
  .frame .wrong{outline:2px solid #e5484d; outline-offset:2px; border-radius:var(--s-radius)}
  .frame .spinner{margin:auto; border-color:var(--s-line); border-top-color:var(--s-brand)}
  .muted{color:var(--s-dim)}
  .error{color:#e5484d}
  .error:empty{display:none}
  .busy::before{content:''; display:inline-block; width:12px; height:12px; margin-right:8px; vertical-align:-1px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:spin .8s linear infinite}
  .skeleton{display:flex; flex-direction:column; gap:14px; width:min(100%, 720px); margin:0 auto}
  .skeleton i{display:block; height:18px; border-radius:4px; background:linear-gradient(90deg, var(--s-line) 40%, var(--s-field) 50%, var(--s-line) 60%) 0 0 / 300% 100%; animation:shimmer 1.3s linear infinite}
  @keyframes shimmer{from{background-position:100% 0} to{background-position:0 0}}
  .site{position:absolute; inset:0; overflow-y:auto; overscroll-behavior:contain; display:flex; flex-direction:column}
  .site > header{flex:none; display:flex; align-items:center; gap:22px; min-height:var(--s-head-height); padding:0 max(16px, calc(50% - var(--s-max) / 2)); background:var(--s-head); color:var(--s-head-text); border-bottom:1px solid var(--s-line)}
  .frame .logo{display:flex; align-items:center; gap:8px; font-size:18px; font-weight:700; color:inherit; text-decoration:none}
  .colored .logo i, .frame .site > header.colored button.primary{background:var(--s-on-brand); border-color:var(--s-on-brand); color:var(--s-brand)}
  .date .current{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .logo i{display:flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:var(--s-radius); background:var(--s-brand); color:var(--s-on-brand); font-style:normal; font-size:15px}
  .site > header nav{flex:1; display:flex; gap:20px}
  .frame .site > header nav a{color:inherit; opacity:.85; text-decoration:none}
  .site > header .account{display:flex; gap:8px}
  .nav-center nav{justify-content:center}
  .nav-right nav{justify-content:flex-end}
  .site > header.logo-center nav{order:-1; flex:none}
  .logo-center .logo{flex:1; justify-content:center}
  .site > main{flex:1 0 auto; display:flex; gap:40px; padding:32px max(16px, calc(50% - var(--s-max) / 2))}
  .site > main.center > .sheet{margin:auto}
  .site > main.top > .sheet{margin:0 auto auto}
  .site > main.right{flex-direction:row-reverse}
  .site > main.wide{flex-direction:column; gap:20px}
  .site > main > aside{flex:1; align-self:center; display:flex; flex-direction:column; gap:10px; padding:28px; border-radius:var(--s-radius); background:color-mix(in srgb, var(--s-brand) 12%, var(--s-bg)); font-size:16px}
  .site > footer{flex:none; display:flex; flex-wrap:wrap; gap:8px 20px; padding:18px max(16px, calc(50% - var(--s-max) / 2)) 22px; border-top:1px solid var(--s-line); color:var(--s-dim); font-size:12px}
  .frame .site > footer a{color:inherit}
  .sheet{flex:none; align-self:flex-start; width:min(var(--s-width), 100%); display:flex; flex-direction:column; gap:14px; padding:26px; background:var(--s-card); border:1px solid var(--s-line); border-radius:var(--s-radius); box-shadow:0 4px 18px rgba(0,0,0,.06)}
  .sheet.flat{width:min(560px, 100%); box-shadow:none}
  .stretch > button.primary{width:100%}
  .field{display:flex; flex-direction:column; gap:5px}
  .field > span, .split > span{font-size:13px; color:var(--s-dim)}
  .pair{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .date{display:grid; grid-template-columns:64px 1fr 84px; gap:8px}
  .suffix{display:flex; align-items:center; gap:6px; white-space:nowrap}
  .secret{position:relative}
  .secret input{padding-right:44px}
  .frame .eye{position:absolute; right:4px; top:50%; transform:translateY(-50%); padding:4px 8px; border:0; background:none; opacity:.5}
  .frame .eye.shown{opacity:1}
  .tick{display:flex; align-items:center; gap:8px; cursor:pointer}
  .frame .tick input{width:auto; margin:0; padding:0; accent-color:var(--s-brand); box-shadow:none}
  .ticks{display:flex; gap:18px; flex-wrap:wrap}
  .split{display:flex; justify-content:space-between; align-items:center; gap:12px}
  .code{display:flex; gap:8px}
  .frame .code input{width:44px; height:52px; padding:0; text-align:center; font-size:22px}
  .frame .link{align-self:flex-start; font-size:13px}
  .done-mark{width:56px; height:56px; display:flex; align-items:center; justify-content:center; border-radius:50%; background:color-mix(in srgb, var(--s-brand) 18%, transparent); color:var(--s-brand); font-size:28px}
  .frame .dropdown{width:auto}
  .frame .dropdown .current{padding:9px 12px; background:var(--s-field); border-color:var(--s-line); border-radius:var(--s-radius)}
  .frame .dropdown .current:hover{border-color:var(--s-brand)}
  .frame .dropdown .options{background:var(--s-card); border-color:var(--s-line)}
  .frame .dropdown .options > div:hover{background:var(--s-brand); color:var(--s-on-brand)}
  .backdrop{position:absolute; inset:0; z-index:10; display:flex; padding:16px; overflow-y:auto; background:rgba(10,14,20,.5)}
  .modal{position:relative; margin:auto; width:min(420px, 100%); display:flex; flex-direction:column; gap:14px; padding:26px; background:var(--s-card); border-radius:var(--s-radius); box-shadow:0 12px 40px rgba(0,0,0,.3)}
  .buttons{display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap}
  .frame .close{position:absolute; top:8px; right:8px; width:32px; height:32px; padding:0; border:0; background:none; font-size:22px; line-height:1; color:var(--s-dim)}
  .frame .close.left{right:auto; left:8px}
  .frame .close.small{top:4px; right:4px; width:22px; height:22px; font-size:15px}
  .toast{position:absolute; z-index:20; display:flex; align-items:center; gap:12px; padding:10px 8px 10px 16px; max-width:min(380px, calc(100% - 32px)); background:var(--s-strong); color:var(--s-bg); border-radius:var(--s-radius); box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .toast.top-right{top:16px; right:16px}
  .toast.bottom-right{bottom:16px; right:16px}
  .toast.bottom-left{bottom:16px; left:16px}
  .toast.top{top:16px; left:50%; transform:translateX(-50%)}

<script>
'use strict'

const CHUNK_ROWS = 16384
const BAR = 32
const MARGIN = 10
const DIRECTIONS = 16
const distanceBins = [[20, 50], [50, 100], [100, 200], [200, 400], [400, 800], [800, 1200], [1200, Infinity]]
const allBins = distanceBins.map((_, bin) => bin)

const $ = id => document.getElementById(id)
const stage = $('stage')
const coarse = matchMedia('(pointer: coarse)').matches
const either = (desktop, touch) => coarse ? touch : desktop
document.documentElement.classList.toggle('mobile', coarse)
const ms = value => Math.round(value * 100) / 100
const px = value => Math.round(value * 256) / 256
const uniform = (min, max) => min + Math.random() * (max - min)
const integer = (min, max) => Math.floor(uniform(min, max + 1))
const pick = items => items[integer(0, items.length - 1)]
const shuffle = items => items.map(item => [Math.random(), item]).sort((a, b) => a[0] - b[0]).map(pair => pair[1])
const sample = (items, count) => shuffle(items).slice(0, count)
const clock = seconds => `${Math.floor(seconds / 60)}:${String(Math.floor(seconds % 60)).padStart(2, '0')}`


class Series {
    constructor(stride) {
        this.stride = stride
        this.chunks = []
        this.used = CHUNK_ROWS
        this.count = 0
    }

    push(...values) {
        if (this.used === CHUNK_ROWS) {
            this.chunks.push(new Float64Array(CHUNK_ROWS * this.stride))
            this.used = 0
        }
        this.chunks.at(-1).set(values, this.used++ * this.stride)
        this.count++
    }

    json() {
        const parts = ['[']
        for (const [index, chunk] of this.chunks.entries()) {
            const rows = index === this.chunks.length - 1 ? this.used : CHUNK_ROWS
            const lines = new Array(rows)
            for (let row = 0; row < rows; row++) {
                const offset = row * this.stride
                let line = `[${chunk[offset]}`
                for (let column = 1; column < this.stride; column++) {
                    line += `,${chunk[offset + column]}`
                }
                lines[row] = `${line}]`
            }
            parts.push((index ? ',' : '') + lines.join(','))
        }
        parts.push(']')
        return parts
    }
}


const raw = new Series(6)
const frames = new Series(7)
const touches = new Series(11)
const touchEvents = new Series(10)
const events = []
const tasks = []
const pointer = {x: innerWidth / 2, y: innerHeight / 2}
const profile = {device: null, hand: null, pollingRate: null}
const rawSource = 'onpointerrawupdate' in window ? 'pointerrawupdate' : 'pointermove'
let displayHz = null
let firstPointerType = null
let dirty = false
let finished = false
let examStart = null
const examMinutes = 20


const pointerCodes = {mouse: 0, touch: 1, pen: 2}


function pushRaw(samples) {
    for (const sample of samples) {
        raw.push(ms(sample.timeStamp), px(sample.clientX), px(sample.clientY), sample.buttons, pointerCodes[sample.pointerType] ?? -1, sample.pointerId)
    }
}


function onRawUpdate(e) {
    const coalesced = e.getCoalescedEvents()
    pushRaw(coalesced.length ? coalesced : [e])
}


function onMove(e) {
    const coalesced = e.getCoalescedEvents?.() ?? []
    frames.push(ms(e.timeStamp), px(e.clientX), px(e.clientY), e.buttons, coalesced.length, pointerCodes[e.pointerType] ?? -1, e.pointerId)
    pointer.x = e.clientX
    pointer.y = e.clientY
    if (rawSource === 'pointermove') {
        pushRaw(coalesced.length ? coalesced : [e])
    }
}


const pointerPhases = {pointerdown: 0, pointermove: 1, pointerup: 2, pointercancel: 3}
const touchPhases = {touchstart: 0, touchmove: 1, touchend: 2, touchcancel: 3}
const ratio = value => Math.round((value ?? 0) * 10000) / 10000


function onPointer(e) {
    if (e.type === 'pointerdown') {
        firstPointerType ??= e.pointerType
    }
    if (e.pointerType === 'mouse') {
        return
    }
    if (e.type !== 'pointermove') {
        pointer.x = e.clientX
        pointer.y = e.clientY
    }
    const coalesced = e.type === 'pointermove' ? e.getCoalescedEvents?.() ?? [] : []
    for (const sample of coalesced.length ? coalesced : [e]) {
        touches.push(ms(sample.timeStamp), e.pointerId, pointerPhases[e.type], px(sample.clientX), px(sample.clientY), px(sample.width ?? 0), px(sample.height ?? 0), ratio(sample.pressure), sample.tiltX ?? 0, sample.tiltY ?? 0, sample.twist ?? 0)
    }
}


const touchTargets = new WeakSet()


function onDetachedTouch(e) {
    if (!e.target.isConnected) {
        onTouch(e)
    }
}


function onTouch(e) {
    if (e.type === 'touchstart' && !touchTargets.has(e.target)) {
        touchTargets.add(e.target)
        for (const type of ['touchmove', 'touchend', 'touchcancel']) {
            e.target.addEventListener(type, onDetachedTouch, {passive: true})
        }
    }
    for (const touch of e.changedTouches) {
        touchEvents.push(ms(e.timeStamp), touchPhases[e.type], touch.identifier, px(touch.clientX), px(touch.clientY), px(touch.radiusX ?? 0), px(touch.radiusY ?? 0), ratio(touch.rotationAngle), ratio(touch.force), e.touches.length)
    }
}


const discreteTypes = ['pointerdown', 'pointerup', 'click', 'dblclick', 'contextmenu', 'wheel', 'keydown', 'keyup', 'focusin', 'focusout', 'scroll', 'visibilitychange', 'blur', 'focus', 'resize', 'fullscreenchange']

const extras = {
    wheel: e => [px(e.deltaX), px(e.deltaY), e.deltaMode],
    focusin: e => describe(e.target),
    focusout: e => describe(e.target),
    scroll: e => {
        const element = e.target === document ? document.scrollingElement : e.target
        return [px(element.scrollLeft), px(element.scrollTop), e.target === document ? 'document' : describe(element)]
    },
    visibilitychange: () => document.visibilityState,
    resize: () => [innerWidth, innerHeight],
    fullscreenchange: () => Boolean(document.fullscreenElement),
}


function describe(element) {
    const mark = element.dataset.mark ? `[${element.dataset.mark}]` : ''
    return element.tagName.toLowerCase() + (element.id ? `#${element.id}` : '') + (element.classList[0] ? `.${element.classList[0]}` : '') + mark
}


function onDiscrete(e) {
    if ((e.type === 'blur' || e.type === 'focus') && e.target !== window) {
        return
    }
    if (e.type === 'scroll' && e.target instanceof Element && e.target.matches('input, textarea')) {
        return
    }
    const mouse = e instanceof MouseEvent
    events.push([
        ms(e.timeStamp),
        e.type,
        mouse ? px(e.clientX) : null,
        mouse ? px(e.clientY) : null,
        mouse ? e.button : null,
        mouse ? e.buttons : null,
        extras[e.type]?.(e) ?? null,
    ])
}


function listen() {
    const options = {capture: true, passive: true}
    if (rawSource === 'pointerrawupdate') {
        addEventListener('pointerrawupdate', onRawUpdate, options)
    }
    addEventListener('pointermove', onMove, options)
    for (const type of discreteTypes) {
        addEventListener(type, onDiscrete, options)
    }
    for (const type of Object.keys(pointerPhases)) {
        addEventListener(type, onPointer, options)
    }
    for (const type of Object.keys(touchPhases)) {
        addEventListener(type, onTouch, options)
    }
    addEventListener('pointerdown', press, options)
    addEventListener('blur', invalidate)
    document.addEventListener('visibilitychange', () => document.hidden && invalidate())
    addEventListener('contextmenu', e => e.preventDefault())
    addEventListener('beforeunload', e => dirty && e.preventDefault())
}


function environment() {
    return {
        devicePixelRatio,
        screen: [screen.width, screen.height],
        availSize: [screen.availWidth, screen.availHeight],
        innerSize: [innerWidth, innerHeight],
        userAgent: navigator.userAgent,
        platform: navigator.userAgentData?.platform ?? navigator.platform,
        displayHz,
        ...profile,
        rawSource,
        coalescedSupported: 'getCoalescedEvents' in PointerEvent.prototype,
        startedAt: new Date(performance.timeOrigin).toISOString(),
        pointerType: firstPointerType,
        coarse,
        maxTouchPoints: navigator.maxTouchPoints,
        exportVersion: 4,
        examMinutes,
        fingerprint,
    }
}


function digest(text) {
    let first = 0xdeadbeef
    let second = 0x41c6ce57
    for (let index = 0; index < text.length; index++) {
        const code = text.charCodeAt(index)
        first = Math.imul(first ^ code, 2654435761)
        second = Math.imul(second ^ code, 1597334677)
    }
    first = Math.imul(first ^ (first >>> 16), 2246822507) ^ Math.imul(second ^ (second >>> 13), 3266489909)
    second = Math.imul(second ^ (second >>> 16), 2246822507) ^ Math.imul(first ^ (first >>> 13), 3266489909)
    return [second, first].map(value => (value >>> 0).toString(16).padStart(8, '0')).join('')
}


function storedUuid() {
    try {
        const uuid = localStorage.getItem('examUuid') ?? crypto.randomUUID()
        localStorage.setItem('examUuid', uuid)
        return uuid
    } catch {
        return crypto.randomUUID()
    }
}


function graphics() {
    const gl = document.createElement('canvas').getContext('webgl')
    if (!gl) {
        return [null, null]
    }
    const info = gl.getExtension('WEBGL_debug_renderer_info')
    const names = [gl.getParameter(info?.UNMASKED_VENDOR_WEBGL ?? gl.VENDOR), gl.getParameter(info?.UNMASKED_RENDERER_WEBGL ?? gl.RENDERER)]
    gl.getExtension('WEBGL_lose_context')?.loseContext()
    return names
}


function drawing() {
    const canvas = Object.assign(document.createElement('canvas'), {width: 240, height: 60})
    const context = canvas.getContext('2d')
    context.textBaseline = 'top'
    context.font = '16px Arial'
    context.fillStyle = '#f60'
    context.fillRect(110, 4, 90, 30)
    context.fillStyle = '#069'
    context.fillText('Lordium, экзамен ½ ∑ ≈', 4, 8)
    context.font = '18px serif'
    context.fillStyle = 'rgba(102, 204, 0, 0.7)'
    context.fillText('Lordium, экзамен ½ ∑ ≈', 8, 30)
    return digest(canvas.toDataURL())
}


function scene() {
    const canvas = Object.assign(document.createElement('canvas'), {width: 64, height: 64})
    const gl = canvas.getContext('webgl', {preserveDrawingBuffer: true})
    if (!gl) {
        return null
    }
    const program = gl.createProgram()
    const sources = [
        [gl.VERTEX_SHADER, 'attribute vec2 p; attribute vec3 c; varying vec3 v; void main() { v = c; gl_Position = vec4(p, 0.0, 1.0); }'],
        [gl.FRAGMENT_SHADER, 'precision mediump float; varying vec3 v; void main() { gl_FragColor = vec4(v * 0.9 + 0.05, 1.0); }'],
    ]
    for (const [type, source] of sources) {
        const shader = gl.createShader(type)
        gl.shaderSource(shader, source)
        gl.compileShader(shader)
        gl.attachShader(program, shader)
    }
    gl.linkProgram(program)
    gl.useProgram(program)
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer())
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-0.9, -0.8, 1, 0.2, 0, 0.85, -0.6, 0, 1, 0.3, 0.1, 0.95, 0.2, 0.4, 1]), gl.STATIC_DRAW)
    const position = gl.getAttribLocation(program, 'p')
    const color = gl.getAttribLocation(program, 'c')
    gl.enableVertexAttribArray(position)
    gl.enableVertexAttribArray(color)
    gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 20, 0)
    gl.vertexAttribPointer(color, 3, gl.FLOAT, false, 20, 8)
    gl.clearColor(0.1, 0.2, 0.3, 1)
    gl.clear(gl.COLOR_BUFFER_BIT)
    gl.drawArrays(gl.TRIANGLES, 0, 3)
    return gl
}


const glParameters = ['MAX_TEXTURE_SIZE', 'MAX_RENDERBUFFER_SIZE', 'MAX_VIEWPORT_DIMS', 'ALIASED_LINE_WIDTH_RANGE', 'ALIASED_POINT_SIZE_RANGE', 'MAX_VERTEX_ATTRIBS', 'MAX_VERTEX_UNIFORM_VECTORS', 'MAX_FRAGMENT_UNIFORM_VECTORS', 'MAX_VARYING_VECTORS', 'MAX_COMBINED_TEXTURE_IMAGE_UNITS', 'MAX_TEXTURE_IMAGE_UNITS', 'MAX_VERTEX_TEXTURE_IMAGE_UNITS', 'MAX_CUBE_MAP_TEXTURE_SIZE', 'RED_BITS', 'GREEN_BITS', 'BLUE_BITS', 'ALPHA_BITS', 'DEPTH_BITS', 'STENCIL_BITS', 'SUBPIXEL_BITS', 'SAMPLES', 'SAMPLE_BUFFERS', 'VERSION', 'SHADING_LANGUAGE_VERSION', 'VENDOR', 'RENDERER']


function glDump(gl) {
    const values = glParameters.map(name => [name, gl.getParameter(gl[name])])
    for (const shader of ['VERTEX_SHADER', 'FRAGMENT_SHADER']) {
        for (const precision of ['LOW_FLOAT', 'MEDIUM_FLOAT', 'HIGH_FLOAT', 'LOW_INT', 'MEDIUM_INT', 'HIGH_INT']) {
            const format = gl.getShaderPrecisionFormat(gl[shader], gl[precision])
            values.push([`${shader}.${precision}`, format && [format.rangeMin, format.rangeMax, format.precision]])
        }
    }
    const anisotropy = gl.getExtension('EXT_texture_filter_anisotropic')
    values.push(['MAX_TEXTURE_MAX_ANISOTROPY', anisotropy && gl.getParameter(anisotropy.MAX_TEXTURE_MAX_ANISOTROPY_EXT)])
    return values.map(([name, value]) => [name, ArrayBuffer.isView(value) ? [...value] : value]).sort((a, b) => a[0] < b[0] ? -1 : 1)
}


async function audio() {
    const Context = window.OfflineAudioContext ?? window.webkitOfflineAudioContext
    if (!Context) {
        return null
    }
    const context = new Context(1, 5000, 44100)
    const oscillator = context.createOscillator()
    oscillator.type = 'triangle'
    oscillator.frequency.value = 10000
    const compressor = context.createDynamicsCompressor()
    for (const [name, value] of [['threshold', -50], ['knee', 40], ['ratio', 12], ['attack', 0], ['release', 0.25]]) {
        compressor[name].value = value
    }
    oscillator.connect(compressor)
    compressor.connect(context.destination)
    oscillator.start(0)
    const samples = (await context.startRendering()).getChannelData(0).slice(4500)
    return {sum: Math.round(samples.reduce((sum, value) => sum + Math.abs(value), 0) * 1e6) / 1e6, hash: digest(samples.join(','))}
}


const fontNames = ['Arial', 'Arial Black', 'Arial Narrow', 'Bahnschrift', 'Book Antiqua', 'Bookman Old Style', 'Calibri', 'Cambria', 'Cambria Math', 'Candara', 'Century Gothic', 'Comic Sans MS', 'Consolas', 'Constantia', 'Corbel', 'Courier New', 'Ebrima', 'Franklin Gothic Medium', 'Gabriola', 'Gadugi', 'Garamond', 'Georgia', 'Impact', 'Leelawadee UI', 'Lucida Console', 'Lucida Sans Unicode', 'Malgun Gothic', 'Microsoft Sans Serif', 'MS Gothic', 'Palatino Linotype', 'Segoe Print', 'Segoe Script', 'Segoe UI', 'Sitka Text', 'Sylfaen', 'Tahoma', 'Times New Roman', 'Trebuchet MS', 'Verdana', 'Yu Gothic', 'American Typewriter', 'Andale Mono', 'Avenir', 'Avenir Next', 'Baskerville', 'Chalkboard', 'Cochin', 'Copperplate', 'Didot', 'Futura', 'Geneva', 'Gill Sans', 'Helvetica', 'Helvetica Neue', 'Hoefler Text', 'Lucida Grande', 'Menlo', 'Monaco', 'Optima', 'Palatino', 'PT Sans', 'Skia', 'DejaVu Sans', 'DejaVu Serif', 'Liberation Sans', 'Liberation Serif', 'Noto Sans', 'Ubuntu', 'Cantarell', 'Droid Sans', 'Roboto']


function fonts() {
    const context = document.createElement('canvas').getContext('2d')
    const size = family => {
        context.font = `72px ${family}`
        const metrics = context.measureText('mmmmmmmmmmlliWW@#йЖ')
        return `${metrics.width}/${metrics.actualBoundingBoxAscent}/${metrics.actualBoundingBoxDescent}`
    }
    const bases = ['monospace', 'serif', 'sans-serif']
    const fallback = bases.map(size)
    return fontNames.filter(name => bases.some((base, index) => size(`'${name}', ${base}`) !== fallback[index]))
}


function voices() {
    if (!window.speechSynthesis) {
        return null
    }
    const list = () => speechSynthesis.getVoices().map(voice => `${voice.name}|${voice.lang}|${voice.localService}`).sort()
    return new Promise(resolve => {
        const finish = () => resolve(digest(list().join(';')))
        if (list().length) {
            finish()
            return
        }
        speechSynthesis.addEventListener('voiceschanged', finish, {once: true})
        setTimeout(finish, 2000)
    })
}


function mathDigest() {
    const values = [Math.tan(-1e300), Math.sin(-1e300), Math.cos(10.000000000123), Math.sinh(1), Math.cosh(1), Math.tanh(1), Math.asinh(1), Math.acosh(1e300), Math.atanh(0.5), Math.expm1(1), Math.log1p(10), Math.cbrt(100), Math.acos(0.123124234234234242), Math.asin(0.123124234234234242), Math.atan(2), Math.atan2(0.04, 0.7), Math.exp(1), Math.log(10), Math.log2(3), Math.log10(7), Math.pow(Math.PI, -100), Math.hypot(3e-200, 4e-200), Math.sqrt(2) ** Math.E]
    return digest(values.join(','))
}


function mediaQueries() {
    const queries = {
        colorGamut: ['color-gamut', ['rec2020', 'p3', 'srgb']],
        dynamicRange: ['dynamic-range', ['high', 'standard']],
        prefersColorScheme: ['prefers-color-scheme', ['dark', 'light']],
        prefersReducedMotion: ['prefers-reduced-motion', ['reduce', 'no-preference']],
        forcedColors: ['forced-colors', ['active', 'none']],
        invertedColors: ['inverted-colors', ['inverted', 'none']],
        pointer: ['pointer', ['fine', 'coarse', 'none']],
        hover: ['hover', ['hover', 'none']],
        anyPointer: ['any-pointer', ['fine', 'coarse', 'none']],
        anyHover: ['any-hover', ['hover', 'none']],
    }
    return Object.fromEntries(Object.entries(queries).map(([key, [feature, values]]) => [key, values.find(value => matchMedia(`(${feature}: ${value})`).matches) ?? null]))
}


function intl() {
    const options = Intl.DateTimeFormat().resolvedOptions()
    const date = new Date(Date.UTC(2020, 0, 2, 3, 4, 5))
    const samples = [
        new Intl.NumberFormat().format(1234567.891),
        new Intl.NumberFormat(undefined, {style: 'currency', currency: 'USD'}).format(-1234.5),
        new Intl.NumberFormat(undefined, {style: 'percent'}).format(0.256),
        new Intl.DateTimeFormat(undefined, {dateStyle: 'full', timeStyle: 'long', timeZone: 'UTC'}).format(date),
        new Intl.DateTimeFormat().format(date),
        date.toLocaleString(),
    ]
    return {locale: options.locale, numberingSystem: options.numberingSystem, calendar: options.calendar, hash: digest(samples.join('|'))}
}


async function keyboardLayout() {
    if (!navigator.keyboard?.getLayoutMap) {
        return null
    }
    const layout = await navigator.keyboard.getLayoutMap()
    return digest([...layout.entries()].sort().join(';'))
}


async function storageQuota() {
    if (!navigator.storage?.estimate) {
        return null
    }
    return Math.round((await navigator.storage.estimate()).quota / 2 ** 30)
}


async function userAgentData() {
    if (!navigator.userAgentData?.getHighEntropyValues) {
        return null
    }
    return navigator.userAgentData.getHighEntropyValues(['architecture', 'bitness', 'model', 'platformVersion', 'fullVersionList', 'wow64'])
}


function probe(compute) {
    const timeout = new Promise(resolve => setTimeout(resolve, 3000, null))
    return Promise.race([Promise.resolve().then(compute), timeout]).catch(() => null)
}


async function identify() {
    const [webglVendor, webglRenderer] = await probe(graphics) ?? [null, null]
    const gl = await probe(scene)
    const probes = {
        screen: () => [screen.width, screen.height],
        colorDepth: () => screen.colorDepth,
        devicePixelRatio: () => devicePixelRatio,
        hardwareConcurrency: () => navigator.hardwareConcurrency ?? null,
        deviceMemory: () => navigator.deviceMemory ?? null,
        platform: () => navigator.platform,
        timezone: () => Intl.DateTimeFormat().resolvedOptions().timeZone,
        languages: () => [...navigator.languages],
        maxTouchPoints: () => navigator.maxTouchPoints,
        webglVendor: () => webglVendor,
        webglRenderer: () => webglRenderer,
        canvas: drawing,
        audio,
        webglImage: () => {
            const pixels = new Uint8Array(64 * 64 * 4)
            gl.readPixels(0, 0, 64, 64, gl.RGBA, gl.UNSIGNED_BYTE, pixels)
            return digest(pixels.join(','))
        },
        webglParams: () => digest(JSON.stringify(glDump(gl))),
        webglExtensions: () => digest((gl.getSupportedExtensions() ?? []).sort().join(',')),
        fonts,
        voices,
        math: mathDigest,
        uaData: userAgentData,
        media: mediaQueries,
        intl,
        storageQuota,
        keyboardLayout,
        pdfViewer: () => navigator.pdfViewerEnabled ?? null,
        plugins: () => digest([...navigator.plugins].map(plugin => plugin.name).join(',')),
        screenFrame: () => [screen.availLeft ?? null, screen.availTop ?? null, outerWidth - innerWidth, outerHeight - innerHeight],
        touchSupport: () => ({maxTouchPoints: navigator.maxTouchPoints, touchEvent: 'ontouchstart' in window}),
    }
    const values = await Promise.all(Object.values(probes).map(probe))
    gl?.getExtension('WEBGL_lose_context')?.loseContext()
    const components = Object.fromEntries(Object.keys(probes).map((key, index) => [key, values[index] ?? null]))
    return {hash: digest(JSON.stringify(components)), components}
}

const textSelector = 'h1, h2, h3, p, .banner, .phrase, .tip, .form > span, .countdown, .brief, .frame label, .frame td, .toast, .mail, .tooltip'
const scrollSelector = '.screen, .list, .options, .scroller, .site, .app > main, .backdrop'
let layoutPending = false
let lastLayout = null


function lines(element) {
    const range = document.createRange()
    range.selectNodeContents(element)
    const rows = []
    for (const rect of range.getClientRects()) {
        if (!rect.width) {
            continue
        }
        const middle = rect.y + rect.height / 2
        const row = rows.find(row => Math.abs(row[1] + row[3] / 2 - middle) < rect.height / 2)
        if (row) {
            const right = Math.max(row[0] + row[2], rect.right)
            const bottom = Math.max(row[1] + row[3], rect.bottom)
            row[0] = Math.min(row[0], rect.x)
            row[1] = Math.min(row[1], rect.y)
            row[2] = right - row[0]
            row[3] = bottom - row[1]
        } else {
            rows.push([rect.x, rect.y, rect.width, rect.height])
        }
    }
    return rows.map(row => row.map(px))
}


function metrics(element) {
    return [px(element.scrollLeft), px(element.scrollTop), element.scrollWidth, element.scrollHeight, element.clientWidth, element.clientHeight]
}


function snapshot(record) {
    const rects = [{tag: 'document', text: '', rect: [0, 0, innerWidth, innerHeight], scroll: metrics(document.scrollingElement)}]
    for (const element of document.querySelectorAll(layoutSelector)) {
        const rect = element.getBoundingClientRect()
        if (!rect.width || !rect.height || !element.checkVisibility({visibilityProperty: true}) || element.closest('[data-private]')) {
            continue
        }
        const entry = {tag: describe(element), text: element.textContent.trim().slice(0, 80), rect: [px(rect.x), px(rect.y), px(rect.width), px(rect.height)]}
        if (element.matches(textSelector)) {
            entry.lines = lines(element)
        }
        if (element.matches(scrollSelector)) {
            entry.scroll = metrics(element)
        }
        rects.push(entry)
    }
    const key = JSON.stringify(rects)
    if (lastLayout?.record === record && lastLayout.key === key) {
        return
    }
    lastLayout = {record, key}
    record.layout.push({t: ms(performance.now()), rects})
}


function scheduleLayout() {
    if (layoutPending) {
        return
    }
    layoutPending = true
    requestAnimationFrame(() => {
        layoutPending = false
        if (active) {
            snapshot(active.record)
        }
    })
}


function later(signal, delay, callback) {
    const id = setTimeout(callback, delay)
    signal.addEventListener('abort', () => clearTimeout(id))
}


function every(signal, period, callback) {
    const id = setInterval(callback, period)
    signal.addEventListener('abort', () => clearInterval(id))
}


function register(record, element) {
    const rect = element.getBoundingClientRect()
    const id = record.targets.length
    element.dataset.target = id
    record.targets.push({
        id,
        x: px(rect.x),
        y: px(rect.y),
        w: px(rect.width),
        h: px(rect.height),
        shape: element.classList.contains('circle') ? 'circle' : 'rect',
        label: element.dataset.mark || null,
    })
    return id
}


function mark(record, elements) {
    for (const element of elements) {
        if (element.checkVisibility({visibilityProperty: true})) {
            register(record, element)
        }
    }
}


function press(e) {
    if (!active || e.target.closest('#bar')) {
        return
    }
    const {record} = active
    const point = {t: ms(e.timeStamp), x: px(e.clientX), y: px(e.clientY)}
    const element = e.target.closest('[data-mark]')
    if (element) {
        record.hits.push({...point, targetId: element.dataset.target === undefined ? register(record, element) : Number(element.dataset.target)})
    } else {
        record.misses.push(point)
    }
}


function invalidate() {
    if (active) {
        active.record.valid = false
    }
}


function task(kind, instruction, setup) {
    return new Promise(resolve => {
        const attempt = () => {
            const controller = new AbortController()
            const record = {
                id: tasks.length,
                kind,
                section: section.title,
                instruction,
                tStart: ms(performance.now()),
                tEnd: null,
                targets: [],
                hits: [],
                misses: [],
                valid: !document.hidden && document.hasFocus(),
                meta: {},
                layout: [],
            }
            const finish = () => {
                record.tEnd = ms(performance.now())
                controller.abort()
                stage.replaceChildren()
                active = null
                dirty = true
            }
            const done = () => {
                if (!controller.signal.aborted) {
                    finish()
                    resolve(record)
                }
            }
            const restart = () => {
                record.meta.restarted = true
                finish()
                attempt()
            }

            tasks.push(record)
            active = {record, restart}
            setup({record, signal: controller.signal, done})
            updateBar()
            snapshot(record)
        }
        attempt()
    })
}

const coverage = distanceBins.map(() => new Array(DIRECTIONS).fill(0))


function aim(from, bins, width, height) {
    const left = MARGIN + width / 2
    const right = innerWidth - MARGIN - width / 2
    const top = BAR + MARGIN + height / 2
    const bottom = innerHeight - MARGIN - height / 2
    const clearance = Math.hypot(width, height) / 2 + 4
    const reach = Math.hypot(innerWidth, innerHeight)
    const cells = []

    for (const bin of bins) {
        const near = Math.max(distanceBins[bin][0], clearance)
        const far = Math.min(distanceBins[bin][1], reach)
        for (let direction = 0; direction < DIRECTIONS && near < far; direction++) {
            for (let attempt = 0; attempt < 12; attempt++) {
                const distance = uniform(near, far)
                const angle = (direction + uniform(-0.5, 0.5)) * 2 * Math.PI / DIRECTIONS
                const x = from.x + distance * Math.cos(angle)
                const y = from.y + distance * Math.sin(angle)
                if (x >= left && x <= right && y >= top && y <= bottom) {
                    cells.push({bin, direction, x, y})
                    break
                }
            }
        }
    }

    if (!cells.length) {
        return aim(from, allBins, width, height)
    }
    const fewest = Math.min(...cells.map(cell => coverage[cell.bin][cell.direction]))
    return pick(cells.filter(cell => coverage[cell.bin][cell.direction] === fewest))
}


const clickKinds = either({
    click: {button: 0, style: '', instruction: 'Кликнуть по цели', label: null},
    dblclick: {button: 0, style: 'double', instruction: 'Двойной клик по цели', label: '2×'},
    rightclick: {button: 2, style: 'right', instruction: 'Клик правой кнопкой по цели', label: 'ПКМ'},
}, {

})
const buttonLabels = ['OK', 'Далее', 'Купить', 'Войти', 'Готово']


function target(kind, bins, [smallest, largest]) {
    const {button, style, instruction, label} = clickKinds[kind]
    return task(kind, instruction, ({record, signal, done}) => {
        const height = Math.round(smallest * (largest / smallest) ** Math.random())
        const circle = Math.random() < 0.6
        const width = circle ? height : Math.round(height * uniform(1, 2.5))
        const from = {...pointer}
        const spot = aim(from, bins, width, height)
        const text = label ?? (circle || height < 24 || width < 56 ? '' : pick(buttonLabels))
        const element = add(`<div class="target ${circle ? 'circle' : ''} ${style}" data-mark="${text}">${height < 24 ? '' : text}</div>`)
        Object.assign(element.style, {width: `${width}px`, height: `${height}px`})
        put(element, spot.x - width / 2, spot.y - height / 2)
        mark(record, [element])
        record.meta = {from: [px(from.x), px(from.y)], cell: [spot.bin, spot.direction]}

        const complete = () => {
            if (record.valid) {
                coverage[spot.bin][spot.direction]++
            }
            done()
        }
        let armed = false
        element.addEventListener('pointerdown', e => {
            armed = e.button === button
        })
        if (coarse && kind === 'dblclick') {
            let last = -Infinity
            element.addEventListener('pointerup', e => {
                if (e.timeStamp - last < 500) {
                    complete()
                }
                last = e.timeStamp
            })
        } else if (coarse && kind === 'rightclick') {
            let pressed = null
            element.addEventListener('pointerdown', e => {
                pressed = e.timeStamp
            })
            const release = e => {
                if (pressed !== null && e.timeStamp - pressed >= 500) {
                    complete()
                }
                pressed = null
            }
            addEventListener('pointerup', release, {signal})
            addEventListener('pointercancel', release, {signal})
        } else if (kind === 'dblclick') {
            element.addEventListener('dblclick', complete)
        } else {
            addEventListener('pointerup', e => armed && e.button === button && complete(), {signal})
        }
    })
}

function dropdown(name, values, signal) {
    const element = html(`<div class="dropdown"><div class="current" data-mark="${name}">— выберите —</div><div class="options" hidden>${values.map(value => `<div data-mark="${value}">${value}</div>`).join('')}</div></div>`)
    const [current, list] = element.children
    current.addEventListener('click', () => {
        list.hidden = !list.hidden
    })
    list.addEventListener('click', e => {
        if (e.target === list) {
            return
        }
        element.dataset.value = current.textContent = e.target.dataset.mark
        list.hidden = true
        element.dispatchEvent(new Event('change'))
    })
    addEventListener('pointerdown', e => element.contains(e.target) || (list.hidden = true), {signal})
    return element
}

function menuPaths(tree, prefix) {
    return Object.entries(tree).flatMap(([label, children]) => {
        const path = [...prefix, label]
        if (children) {
            return menuPaths(children, path)
        }
        return path.length > 2 ? [path] : []
    })
}


function menuList(tree) {
    const items = Object.entries(tree).map(([label, children]) => `<li data-mark="${label}"${children ? ' class="sub"' : ''}><span>${label}</span>${children ? menuList(children) : ''}</li>`)
    return `<ul>${items.join('')}</ul>`
}


function menu(path) {
    const route = path.join(' → ')
    return task('menu', `Выбрать в меню: ${route}`, ({record, done}) => {
        record.meta = {path, wrong: 0}
        add(`<div class="tip">Выберите в меню: <b>${route}</b></div>`)
        const bar = add(`<nav class="menubar float">${menuList(menuTree)}</nav>`)
        put(bar, uniform(MARGIN, Math.max(MARGIN, innerWidth - 760)), uniform(BAR + 70, innerHeight * 0.45))
        mark(record, bar.querySelectorAll('[data-mark]'))
        bar.addEventListener('click', e => {
            const item = e.target.closest('li')
            if (item?.classList.contains('sub') && coarse) {
                const opened = item.classList.contains('open')
                for (const open of item.parentElement.querySelectorAll('.open')) {
                    open.classList.remove('open')
                }
                item.classList.toggle('open', !opened)
            }
            if (!item || item.classList.contains('sub')) {
                return
            }
            if (item.dataset.mark === path.at(-1)) {
                done()
            } else {
                record.meta.wrong++
            }
        })
    })
}


const statuses = ['новый', 'оплачен', 'в пути', 'доставлен', 'отменён']


const scrollKeys = ['PageDown', 'PageUp', ' ', 'ArrowDown', 'ArrowUp', 'ArrowLeft', 'ArrowRight', 'Home', 'End']


function scrollVia(record, signal, container) {
    const via = record.meta.via = {wheel: 0, keys: 0, thumb: 0, touch: 0}
    addEventListener('wheel', () => via.wheel++, {signal, passive: true})
    addEventListener('keydown', e => scrollKeys.includes(e.key) && via.keys++, {signal})
    addEventListener('pointerdown', e => {
        if (e.pointerType !== 'mouse') {
            via.touch++
            return
        }
        const rect = container === document.documentElement ? {left: 0, top: 0} : container.getBoundingClientRect()
        if (container.contains(e.target) && (e.clientX >= rect.left + container.clientLeft + container.clientWidth || e.clientY >= rect.top + container.clientTop + container.clientHeight)) {
            via.thumb++
        }
    }, {signal})
}


function scrollList() {

        put(list, uniform(MARGIN, innerWidth - MARGIN - width), top)

    })
}

function slider() {
    const goal = integer(5, 95)
    return task('drag', `Установить ползунок на ${goal}`, ({record, done}) => {
        record.meta = {subkind: 'slider', goal, releases: 0}
        const tip = add(`<div class="tip">Установите ползунок на <b>${goal}</b> — сейчас <span></span></div>`)
        const track = add('<div class="slider float" data-mark="Ползунок"><div class="handle" data-mark="Ручка"></div></div>')
        const handle = track.firstElementChild
        const width = Math.min(integer(360, 640), innerWidth - 2 * MARGIN - 22)
        track.style.width = `${width}px`
        put(track, uniform(MARGIN + 11, innerWidth - MARGIN - 11 - width), uniform(BAR + 90, innerHeight - 60))

        let value = goal < 50 ? integer(goal + 30, 100) : integer(0, goal - 30)
        let dragging = false
        const show = () => {
            handle.style.left = `${value}%`
            track.style.setProperty('--fill', `${value}%`)
            tip.querySelector('span').textContent = value
        }
        const move = e => {
            const rect = track.getBoundingClientRect()
            value = Math.round(Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1) * 100)
            show()
        }
        show()
        mark(record, [track, handle])

        track.addEventListener('pointerdown', e => {
            if (e.button === 0) {
                dragging = true
                track.setPointerCapture(e.pointerId)
                move(e)
            }
        })
        track.addEventListener('pointermove', e => dragging && move(e))
        track.addEventListener('pointerup', () => {
            if (!dragging) {
                return
            }
            dragging = false
            record.meta.releases++
            if (value === goal) {
                done()
            }
        })
    })
}


function cargo() {
    return task('drag', 'Перетащить блок в пунктирную рамку', ({record, done}) => {
        record.meta = {subkind: 'item', drops: 0}
        add('<div class="tip">Перетащите блок в пунктирную рамку</div>')
        const slot = add('<div class="slot float" data-mark="Рамка"></div>')
        const item = add('<div class="cargo float" data-mark="Блок">груз</div>')
        const spot = () => ({x: uniform(MARGIN, innerWidth - MARGIN - 88), y: uniform(BAR + 60, innerHeight - MARGIN - 88)})
        const start = spot()
        let end = spot()
        while (Math.hypot(end.x - start.x, end.y - start.y) < 250) {
            end = spot()
        }
        put(item, start.x, start.y)
        put(slot, end.x, end.y)
        mark(record, [item, slot])

        let grip = null
        item.addEventListener('pointerdown', e => {
            if (e.button === 0) {
                grip = {x: e.clientX - item.offsetLeft, y: e.clientY - item.offsetTop}
                item.setPointerCapture(e.pointerId)
            }
        })
        item.addEventListener('pointermove', e => grip && put(item, e.clientX - grip.x, e.clientY - grip.y))
        item.addEventListener('pointerup', () => {
            if (!grip) {
                return
            }
            grip = null
            record.meta.drops++
            const box = item.getBoundingClientRect()
            const frame = slot.getBoundingClientRect()
            const x = box.x + box.width / 2
            const y = box.y + box.height / 2
            if (x >= frame.left && x <= frame.right && y >= frame.top && y <= frame.bottom) {
                done()
            }
        })
    })
}


function pause(seconds) {
    return task('pause', `Перерыв ${seconds} с: ничего не делать или водить мышью как угодно`, ({signal, done}) => {
        const box = card(`<h2>Перерыв</h2><div class="countdown">${seconds}</div><p class="hint">Отдохните. ${either('Мышью можно делать что угодно или ничего.', 'Можно ничего не делать.')} Задание закончится само.</p>`)
        const deadline = performance.now() + seconds * 1000
        every(signal, 250, () => {
            box.querySelector('.countdown').textContent = Math.max(0, Math.ceil((deadline - performance.now()) / 1000))
        })
        later(signal, seconds * 1000, done)
    })
}

function feed(direction, distance) {
    const up = direction === 'up'
    const screens = uniform(...feedScreens[distance])
    return task('scroll', `Прокрутить ленту ${up ? 'вверх' : 'вниз'} до выделенного поста и нажать на него`, ({record, signal, done}) => {
        const count = Math.ceil((screens + 2) * innerHeight / 90)
        const posts = Array.from({length: count}, () => `<div class="post"><p>${pick(senders)} · ${integer(1, 59)} мин назад</p><p>${sample(snippets, integer(1, 3)).join('<br>')}</p></div>`)
        const content = paged(`<h1>Лента</h1>${posts.join('')}<p class="banner">Конец ленты</p>`, signal)
        add(`<div class="tip">Найдите <b>выделенный пост</b> ${up ? 'выше' : 'ниже'} и нажмите на него</div>`)
        if (up) {
            scrollTo(0, document.scrollingElement.scrollHeight)
        }
        const items = [...content.querySelectorAll('.post')]
        const offset = innerHeight / 2 + (up ? -screens : screens) * innerHeight
        const gaps = items.map(item => Math.abs(item.getBoundingClientRect().top - offset))
        const goal = gaps.indexOf(Math.min(...gaps))
        items[goal].classList.add('goal')
        items[goal].dataset.mark = 'Цель'
        record.meta = {subkind: 'feed', direction, distance, screens: ms(screens), posts: count, goal, wrong: 0}
        pickGoal(document.documentElement, items[goal], record, signal, done)
    })
}


function waypoints(count) {
    const sections = integer(30, 40)
    const stops = [integer(4, sections - 1)]
    while (stops.length < count) {
        const next = integer(0, sections - 1)
        if (Math.abs(next - stops.at(-1)) >= 4 && !stops.includes(next)) {
            stops.push(next)
        }
    }
    return task('scroll', `Нажать на заголовки разделов по порядку: ${stops.map(stop => stop + 1).join(' → ')}`, ({record, signal, done}) => {
        record.meta = {subkind: 'waypoints', sections, stops, reached: [], wrong: 0}
        const blocks = Array.from({length: sections}, (_, index) => `<h3 data-mark="Раздел ${index + 1}">Раздел ${index + 1}</h3>${sample(rules, integer(2, 5)).map(text => `<p>${text}</p>`).join('')}`)
        const tip = add('<div class="tip"></div>')
        const content = paged(`<h1>Справочник</h1>${blocks.join('')}`, signal)
        const headings = content.querySelectorAll('h3')
        let step = 0
        const show = () => {
            tip.innerHTML = `Нажмите на заголовок <b>«Раздел ${stops[step] + 1}»</b> · ${step + 1} из ${count}`
        }
        show()
        mark(record, stops.map(stop => headings[stop]))
        scrollVia(record, signal, document.documentElement)
        content.addEventListener('click', e => {
            const heading = e.target.closest('h3')
            if (heading === headings[stops[step]]) {
                record.meta.reached.push(ms(e.timeStamp))
                step++
                if (step === count) {
                    done()
                } else {
                    show()
                }
            } else if (heading) {
                record.meta.wrong++
            }
        })
    })
}

function luminance(hue, saturation, lightness) {
    const chroma = (1 - Math.abs(2 * lightness - 1)) * saturation
    const second = chroma * (1 - Math.abs((hue / 60) % 2 - 1))
    const base = lightness - chroma / 2
    const sector = [[chroma, second, 0], [second, chroma, 0], [0, chroma, second], [0, second, chroma], [second, 0, chroma], [chroma, 0, second]][Math.floor(hue / 60) % 6]
    const linear = value => value <= 0.03928 ? value / 12.92 : ((value + 0.055) / 1.055) ** 2.4
    return sector.map(value => linear(value + base)).reduce((sum, value, index) => sum + value * [0.2126, 0.7152, 0.0722][index], 0)
}


function theme() {
    const hue = integer(0, 359)
    const dark = Math.random() < 0.25
    const colored = Math.random() < 0.3
    const card = dark ? `hsl(${hue} 14% 13%)` : '#fff'
    const saturation = integer(55, 85)
    let lightness = dark ? integer(58, 66) : integer(36, 46)
    const contrast = () => dark ? (luminance(hue, saturation / 100, lightness / 100) + 0.05) / 0.0546 : 1.05 / (luminance(hue, saturation / 100, lightness / 100) + 0.05)
    while (contrast() < 4.5 && lightness > 20 && lightness < 80) {
        lightness += dark ? 2 : -2
    }
    const vars = {
        brand: `hsl(${hue} ${saturation}% ${lightness}%)`,
        'on-brand': dark ? '#0b0f14' : '#fff',
        bg: dark ? `hsl(${hue} 16% 9%)` : pick(['#fff', `hsl(${hue} 35% 97%)`, '#f3f4f6']),
        card,
        field: dark ? `hsl(${hue} 14% 17%)` : '#fff',
        text: dark ? '#d5dbe3' : '#2b3038',
        strong: dark ? '#fff' : '#111418',

function busy(record, signal, button, then, leave = false) {
    const scope = button.closest('.sheet, .modal, .pop, .drop') ?? button
    const controls = [...scope.querySelectorAll('input, button')].filter(control => !control.disabled)
    for (const control of [button, ...controls]) {
        control.disabled = true
    }
    button.classList.add('busy')
    const main = button.closest('.site > main')
    if (leave && main && Math.random() < 0.5) {
        main.className = 'wide'
        main.innerHTML = skeleton()
    }
    delay(record, signal, () => {
        for (const control of [button, ...controls]) {
            control.disabled = false
        }
        button.classList.remove('busy')
        then()
    })
}

function confirmBox(frame, look, title, text, ok, cancelled, confirmed) {
    const buttons = ['<button data-mark="Отмена">Отмена</button>', `<button class="primary" data-mark="${ok}">${ok}</button>`]
    const dialog = frame.appendChild(html(`<div class="backdrop"><div class="modal"><button class="close" data-mark="Закрыть окно">×</button><h2>${title}</h2><p class="muted">${text}</p><div class="buttons">${(look.okFirst ? buttons.reverse() : buttons).join('')}</div></div></div>`))
    const close = () => dialog.remove()
    dialog.addEventListener('click', e => {
        const button = e.target.closest('button')
        if (dialog.querySelector('.busy')) {
            return
        }
        if (button?.classList.contains('primary')) {
            confirmed(button, close)
        } else if (button || e.target === dialog) {
            close()
            cancelled()
        }
    })
}

const symbols = ['★', '●', '▲', '■', '♥', '◆']


function puzzle(record, frame, solved, cancelled) {
    const size = pick([3, 4])
    const goal = pick(symbols)
    const others = symbols.filter(symbol => symbol !== goal)
    const dialog = frame.appendChild(html(`<div class="backdrop"><div class="modal"><button class="close" data-mark="Закрыть проверку">×</button><h2>Выберите все клетки с ${goal}</h2><div class="cells" style="grid-template-columns:repeat(${size}, 1fr)"></div><p class="error"></p><div class="buttons"><button class="primary" data-mark="Подтвердить">Подтвердить</button></div></div></div>`))
    const grid = dialog.querySelector('.cells')
    const fill = () => {
        const count = integer(2, size + 1)
        const cells = shuffle([...Array(count).fill(goal), ...Array.from({length: size * size - count}, () => pick(others))])
        grid.innerHTML = cells.map((symbol, index) => `<button data-symbol="${symbol}" data-mark="Клетка ${index + 1}">${symbol}</button>`).join('')
        mark(record, grid.children)
    }
    fill()
    record.meta.puzzle = {size, errors: 0}
    dialog.addEventListener('click', e => {
        const cell = e.target.closest('[data-symbol]')
        if (cell) {
            cell.classList.toggle('picked')
        } else if (e.target.closest('.close')) {
            dialog.remove()
            cancelled()
        } else if (e.target.closest('.primary')) {
            if ([...grid.children].every(button => button.classList.contains('picked') === (button.dataset.symbol === goal))) {
                dialog.remove()
                solved()
            } else {
                record.meta.puzzle.errors++
                dialog.querySelector('.error').textContent = 'Не совсем. Попробуйте ещё раз.'
                fill()
            }
        }
    })
}


function robotCheck(record, signal, frame, slot, challenge) {
    const element = html(`<div class="robot"><button class="box" data-mark="Я не робот"></button><span>Я не робот</span><small>${pick(['АнтиБот', 'Страж', 'Барьер'])}<br>защита</small></div>`)
    slot.replaceWith(element)
    const box = element.firstElementChild
    let state = 'idle'
    const pass = () => {
        state = 'passed'
        box.classList.add('passed')
        box.textContent = '✓'
    }
    box.addEventListener('click', () => {
        if (state !== 'idle') {
            return
        }
        state = 'checking'
        box.innerHTML = '<div class="spinner"></div>'
        delay(record, signal, () => {
            if (!challenge) {
                pass()
                return
            }
            box.innerHTML = ''
            puzzle(record, frame, pass, () => {
                state = 'idle'
            })
        })
    })
    return {element, passed: () => state === 'passed'}
}

function signupPage(look, step, instruction, body, checks, taken = null) {
    return web('signup', step, instruction, look, ({record, signal, done, frame, say}) => {
        Object.assign(record.meta, {submits: 0, errors: 0})
        const main = browse(look, frame, sheet(look, `${body}<p class="error"></p><button class="primary" data-mark="Далее">Далее</button>`))
        const page = main.querySelector('.sheet')
        const extras = {}
        if (page.querySelector('.month')) {
            extras.month = dropdown('Месяц', monthNames, signal)
            page.querySelector('.month').replaceWith(extras.month)
        }
        if (page.querySelector('.gender')) {
            extras.gender = dropdown('Пол', ['Мужской', 'Женский'], signal)
            page.querySelector('.gender').replaceWith(extras.gender)
        }
        if (page.querySelector('.robot-slot')) {
            extras.robot = robotCheck(record, signal, frame, page.querySelector('.robot-slot'), Math.random() < 0.4)
        }
        mark(record, page.querySelectorAll('[data-mark]'))
        const input = name => page.querySelector(`input[data-mark="${name}"]`)
        const button = page.querySelector('button.primary')
        const error = page.querySelector('.error')
        let rejected = taken === null ? undefined : null
        button.addEventListener('click', () => {
            record.meta.submits++
            const list = checks(input, extras, page)
            if (rejected) {
                list.unshift([rejected[0], rejected[0].value !== rejected[1], taken])
            }
            if (!verify(list, error)) {
                record.meta.errors++
                return
            }
            const reject = rejected === null
            busy(record, signal, button, () => {
                if (!reject) {
                    done()
                    return
                }
                const element = page.querySelector('input')
                rejected = [element, element.value]
                record.meta.rejected = true
                verify([[element, false, taken]], error)
                say('Сайт ответил, что это имя занято: придумайте другое и снова нажмите «Далее»')
            }, !reject)
        })
    })
}

function loginForm(look) {
    const reveal = Math.random() < 0.5
    const remember = Math.random() < 0.5
    const fail = Math.random() < 0.4
    const captcha = fail && Math.random() < 0.5
    const asks = ['введите выдуманные email и пароль', ...reveal ? ['нажмите на глаз 👁, чтобы проверить пароль'] : [], ...remember ? ['отметьте «Запомнить меня»'] : []]
    return web('login', 'form', `Вход на сайт «${look.name}»: ${asks.join(', ')} и нажмите «Войти»`, look, ({record, signal, done, frame, say}) => {
        Object.assign(record.meta, {reveal, remember, fail, captcha, submits: 0, errors: 0, rejected: 0})
        const others = Math.random() < 0.5 ? `<span class="muted">или войдите через</span><div class="providers">${sample(providers, integer(2, 3)).map(name => providerButton(name, name)).join('')}</div>` : ''
        const page = browse(look, frame, loginSheet(look, others)).querySelector('.sheet')
        const email = page.querySelector('input[data-mark="Email"]')
        const password = page.querySelector('input[data-mark="Пароль"]')
        const button = page.querySelector('button.primary')
        const error = page.querySelector('.error')
        let robot = null
        mark(record, page.querySelectorAll('[data-mark]'))
        button.addEventListener('click', () => {
            record.meta.submits++
            const checks = [[email, emailPattern.test(email.value.trim()), 'Введите адрес почты, например name@mail.ru'], [password, password.value !== '', 'Введите пароль']]
            if (robot) {
                checks.push([robot.element, robot.passed(), 'Подтвердите, что вы не робот'])
            }
            if (!verify(checks, error)) {
                record.meta.errors++
                return
            }
            busy(record, signal, button, () => {
                if (fail && !record.meta.rejected) {
                    record.meta.rejected++
                    password.value = ''
                    verify([[password, false, 'Неверный email или пароль']], error)
                    if (captcha) {
                        const slot = page.querySelector('.robot-slot')
                        slot.hidden = false
                        robot = robotCheck(record, signal, frame, slot, Math.random() < 0.4)
                    }
                    say(`Сайт ответил «неверный пароль»: введите пароль ещё раз${captcha ? ', отметьте «Я не робот»' : ''} и снова нажмите «Войти»`)
                    return

                done()
            }, !fail || record.meta.rejected > 0)

    })

function consent(record, signal, frame, look, provider, done) {

            if (chosen) {
                busy(record, signal, button, done)
            } else {
                dialog.querySelector('.error').textContent = 'Выберите аккаунт'

        }
    })

    return web('recover', 'code', 'Дождитесь письма с кодом (появится на экране), введите код и нажмите «Подтвердить»', look, ({record, signal, done, frame}) => {

        const fields = [...page.querySelectorAll('input')]
        const button = page.querySelector('button.primary')
        const error = page.querySelector('.error')
        mark(record, page.querySelectorAll('[data-mark]'))
        const deliver = () => delay(record, signal, () => {
            frame.querySelector('.mail')?.remove()
            const mail = frame.appendChild(html(`<div class="mail"><button class="close" data-mark="Закрыть письмо">×</button><span class="muted">Новое письмо · ${look.name}</span><p>Код для сброса пароля:</p><big>${code.slice(0, 3)} ${code.slice(3)}</big></div>`))
            mail.firstElementChild.addEventListener('click', () => mail.remove())
        }, record.meta.mail)
        deliver()
        page.querySelector('.link').addEventListener('click', () => {
            record.meta.resends++
            deliver()
        })
        if (boxes) {
            const row = page.querySelector('.code')
            row.addEventListener('input', e => {
                const digits = e.target.value.replace(/\D/g, '')
                e.target.value = digits.slice(-1)
                if (digits) {
                    fields[fields.indexOf(e.target) + 1]?.focus()
                }
            })
            row.addEventListener('keydown', e => {
                if (e.key === 'Backspace' && !e.target.value) {
                    fields[fields.indexOf(e.target) - 1]?.focus()
                }
            })
        }
        button.addEventListener('click', () => {
            const typed = fields.map(input => input.value).join('').replace(/\D/g, '')
            if (verify(fields.map(input => [input, typed === code, typed.length < 6 ? 'Введите все 6 цифр' : 'Неверный код, проверьте письмо']), error)) {
                busy(record, signal, button, done, true)
            } else {
                record.meta.errors++
            }
        })
    })
}

            const infos = [...main.querySelectorAll('.info')]

                const info = e.target.closest('.info > button')?.parentElement
                if (info) {

function faqWidget(look) {
    const items = sample(faqItems, integer(6, 9))
    const goal = integer(0, items.length - 1)
    const single = Math.random() < 0.5
    return web('widget', 'faq', `Помощь на сайте «${look.name}»: откройте вопрос «${items[goal][0]}» и нажмите в ответе «${items[goal][2]}»`, look, ({record, signal, done, frame}) => {
        Object.assign(record.meta, {items: items.length, goal, opened: 0, wrong: 0})
        const main = browse(look, frame, skeleton(), true)
        delay(record, signal, () => {
            main.innerHTML = `<h1>Вопросы и ответы</h1><div class="faq">${items.map(([question, answer, action], index) => `<div><button class="q" data-mark="${question}">${question}</button><div class="answer" hidden><p>${answer}</p><button data-mark="${action}"${index === goal ? ' data-goal' : ''}>${action}</button></div></div>`).join('')}</div>`
            const questions = [...main.querySelectorAll('.q')]
            mark(record, [questions[goal]])
            main.addEventListener('click', e => {
                const question = e.target.closest('.q')
                const action = e.target.closest('.answer button')
                if (question) {
                    const answer = question.nextElementSibling
                    const open = answer.hidden
                    for (const other of questions) {
                        if (other === question || single) {
                            other.nextElementSibling.hidden = other !== question || !open
                            other.parentElement.classList.toggle('open', other === question && open)
                        }
                    }
                    record.meta.opened += open
                } else if (action?.hasAttribute('data-goal')) {
                    done()
                } else if (action) {
                    record.meta.wrong++
                }
            })
        })
    })
}

        const panes = {
            Описание: () => `<p>${name} из новой коллекции ${look.name}. Продуманный дизайн и надёжные материалы, подойдёт для дома и в подарок.</p><p class="muted">Гарантия производителя ${integer(1, 3)} года.</p>`,

            Отзывы: () => reviewers.map((who, index) => `<div class="review"><b>${who}</b><span class="muted">${'★'.repeat(integer(3, 5))}</span><p>${pick(reviewTexts)}</p><button data-mark="Полезно ${who}"${tab === 'Отзывы' && index === goal ? ' data-goal' : ''}>Полезно · ${integer(0, 40)}</button></div>`).join(''),
            Доставка: () => ways.map((way, index) => `<div class="split" style="width:100%"><span>${way} · ${integer(1, 6)} дн. · ${integer(0, 5) * 100} ₽</span><button data-mark="Выбрать ${way}"${tab === 'Доставка' && index === goal ? ' data-goal' : ''}>Выбрать</button></div>`).join(''),
        }

        delay(record, signal, () => {

            const pane = main.querySelector('.pane')
            mark(record, [main.querySelector(`[data-tab="${tab}"]`)])
            main.addEventListener('click', e => {
                const button = e.target.closest('[data-tab]')
                const inner = e.target.closest('.pane button')
                if (button) {
                    record.meta.switches++
                    for (const other of main.querySelectorAll('[data-tab]')) {
                        other.classList.toggle('current', other === button)
                    }
                    const label = button.dataset.tab
                    if (label === 'Отзывы' && !reviewsLoaded) {

                        loadInto(record, signal, pane, () => {

                    }
                } else if (inner?.hasAttribute('data-goal')) {
                    done()
                } else if (inner) {
                    record.meta.wrong++
                }
            })
        })
    })
}
