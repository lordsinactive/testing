    products: state => `<h1>Товары</h1><div class="cards">${state.products.map((product, index) => `<div class="offer"><div class="pic"></div><b>${product.name}</b><span class="muted">${product.price} ₽</span><div class="setting" style="align-self:stretch"><span>В продаже</span>${switcher(product.on, `sale:${index}`, `В продаже: ${product.name}`)}</div><button data-act="remove:${index}" data-mark="Удалить ${product.name}">Удалить</button></div>`).join('')}</div>`,
    customers: state => `<h1>Клиенты</h1><div class="block"><table><tr><th>Имя</th><th>Заказов</th><th>Последний заказ</th><th></th></tr>${state.customers.map((name, index) => {
        const own = state.orders.filter(order => order.customer === name)
        return `<tr><td>${name}</td><td>${own.length}</td><td>${own[0]?.date ?? '—'}</td><td><button data-act="customer:${index}" data-mark="Открыть ${name}">Открыть</button></td></tr>`
    }).join('')}</table></div>`,
    customer: state => {
        const name = state.customers[state.customer]
        const own = state.orders.filter(order => order.customer === name)
        return `<button class="back" data-act="page:customers" data-mark="Назад к клиентам">← Клиенты</button><h1>${name}</h1><div class="stats">${stat('Заказов', own.length)}${stat('Сумма', `${own.reduce((sum, order) => sum + order.sum, 0)} ₽`)}</div><div class="block">${ordersTable(state, own.slice(0, 6), false)}</div>`
    },
    analytics: state => `<h1>Аналитика</h1><div class="segmented">${periods.map(value => `<button data-act="period:${value}" data-mark="${value}"${value === state.period ? ' class="current"' : ''}>${value}</button>`).join('')}</div><div class="figures">${figures(state)}</div>`,
    reports: state => `<h1>Отчёты</h1><div class="block rows">${state.reports.map(([name, date], index) => `<div class="split"><div><b>${name}</b><p class="muted">Обновлён ${date}</p></div><div class="drop"><button data-act="menu" data-mark="Экспорт: ${name}">Экспорт ▾</button><div class="pop" hidden>${formats.map(format => `<button data-act="export:${index}:${format}" data-mark="${format}">${format}</button>`).join('')}</div></div></div>`).join('')}</div>`,
    settings: state => `<h1>Настройки</h1><div class="tabs">${settingsTabs.map(tab => `<button data-act="tab:${tab}" data-mark="${tab}"${tab === state.tab ? ' class="current"' : ''}>${tab}</button>`).join('')}</div>${settingsBody[state.tab](state)}`,
}


function editOrder(record, signal, frame, order, saved) {
    const dialog = frame.appendChild(html(`<div class="backdrop"><div class="modal"><button class="close" data-mark="Закрыть окно">×</button><h2>Заказ №${order.number}</h2><p class="muted">${order.customer} · ${order.date} · ${order.sum} ₽</p><div class="field"><span>Статус</span><div class="status-slot"></div></div>${field('Комментарий', 'Комментарий')}<div class="buttons"><button data-mark="Отмена">Отмена</button><button class="primary" data-mark="Сохранить">Сохранить</button></div></div></div>`))
    const status = dropdown('Статус', orderStatuses, signal)
    status.dataset.value = status.firstElementChild.textContent = order.status
    dialog.querySelector('.status-slot').replaceWith(status)
    mark(record, dialog.querySelectorAll('[data-mark]'))
    dialog.addEventListener('click', e => {
        const button = e.target.closest('button')
        if (dialog.querySelector('.busy')) {
            return
        }
        if (button?.classList.contains('primary')) {
            busy(record, signal, button, () => {
                order.status = status.dataset.value
                dialog.remove()
                saved(order)
            })
        } else if (button || e.target === dialog) {
            dialog.remove()
        }
    })
}


function desk(record, signal, frame, look, state, emit) {
    frame.innerHTML = `<div class="app${look.flip ? ' flip' : ''}"><aside${look.colored ? ' class="colored"' : ''}><div class="logo"><i>${look.name[0]}</i>${look.name}</div>${state.sections.map(([id, label, icon]) => `<button data-act="page:${id}" data-mark="${label}"><span>${icon}</span>${label}</button>`).join('')}</aside><header><button class="burger" data-act="drawer" data-mark="Меню">☰</button><div class="search drop"><input data-mark="Поиск" placeholder="Поиск клиентов и заказов" autocomplete="off" spellcheck="false"><div class="pop" hidden data-private></div></div><span class="spacer"></span><div class="drop"><button class="bell" data-act="menu" data-mark="Уведомления"></button><div class="pop notes" hidden></div></div><div class="drop"><button class="user" data-act="menu" data-mark="Профиль"><i>${initials(state.user)}</i><span>${state.user}</span> ▾</button><div class="pop" hidden><button data-act="profile" data-mark="Мой профиль">Мой профиль</button><button data-act="page:settings" data-mark="Настройки">Настройки</button><button data-act="help" data-mark="Помощь">Помощь</button><button data-act="logout" data-mark="Выйти">Выйти</button></div></div></header><main></main></div>`
    const app = frame.firstElementChild
    const main = app.querySelector('main')
    const notes = app.querySelector('.notes')
    const chrome = () => {
        for (const button of app.querySelectorAll('aside [data-act]')) {
            button.classList.toggle('current', button.dataset.act === `page:${state.page === 'customer' ? 'customers' : state.page}`)
        }
        const unread = state.notes.filter(note => !note.read).length
        app.querySelector('.bell').innerHTML = `🔔${unread ? `<span class="badge">${unread}</span>` : ''}`
        notes.innerHTML = `<div class="split"><b>Уведомления</b><button data-act="readAll" data-mark="Прочитать все">Прочитать все</button></div>${state.notes.map((note, index) => `<button data-act="note:${index}" data-mark="${note.text}"${note.read ? '' : ' class="unread"'}><span>${note.text}</span><small class="muted">${note.time}</small></button>`).join('')}`
    }
    const draw = () => {
        main.innerHTML = deskPages[state.page](state)
        chrome()
    }
    const visit = (changes, then) => {
        Object.assign(state, changes)
        app.classList.remove('drawer')
        chrome()
        main.scrollTop = 0
        loadInto(record, signal, main, () => {
            draw()
            then?.()
        })
    }
    const pop = (title, text, ok, event, success) => confirmBox(frame, look, title, text, ok, () => emit(event, false), (button, close) => busy(record, signal, button, () => {
        close()
        if (success) {
            toast(frame, look, signal, success)
        }
        emit(event, true)
    }))
    const actions = {
        page: (_, id) => visit({page: id, pageIndex: 0, found: null, filter: 'Все'}),
        drawer: () => app.classList.toggle('drawer'),
        menu: button => {
            const list = button.nextElementSibling
            const open = list.hidden
            for (const other of app.querySelectorAll('.drop > .pop')) {
                other.hidden = true
            }
            list.hidden = !open
        },
        filter: (_, value) => visit({filter: value, pageIndex: 0}),
        turn: (_, index) => visit({pageIndex: Number(index)}),
        edit: (_, number) => editOrder(record, signal, frame, state.orders.find(order => order.number === Number(number)), order => {
            draw()
            toast(frame, look, signal, `Заказ №${order.number} сохранён`)
            emit('order', order)
        }),
        order: (_, number) => visit({page: 'orders', filter: 'Все', pageIndex: Math.floor(state.orders.findIndex(order => order.number === Number(number)) / perPage), found: Number(number)}),
        customer: (_, index) => visit({page: 'customer', customer: Number(index)}, () => emit('customer', state.customers[index])),
        sale: (button, index) => {
            const product = state.products[index]
            product.on = button.classList.contains('checked')
            toast(frame, look, signal, `«${product.name}» ${product.on ? 'снова в продаже' : 'снят с продажи'}`)
            emit('sale', product)
        },
        remove: (_, index) => {
            const product = state.products[index]
            confirmBox(frame, look, 'Удалить товар?', `«${product.name}» пропадёт из каталога.`, 'Удалить', () => emit('remove', [product, false]), (button, close) => busy(record, signal, button, () => {
                state.products.splice(state.products.indexOf(product), 1)
                close()
                draw()
                toast(frame, look, signal, `Товар «${product.name}» удалён`)
                emit('remove', [product, true])
            }))
        },
        period: (_, value) => {
            state.period = value
            for (const button of main.querySelectorAll('.segmented button')) {
                button.classList.toggle('current', button.dataset.act === `period:${value}`)
            }
            const area = main.querySelector('.figures')
            loadInto(record, signal, area, () => {
                area.innerHTML = figures(state)
                emit('period', value)
            })
        },
        export: (button, index, format) => {
            const trigger = button.closest('.drop').firstElementChild
            busy(record, signal, trigger, () => {
                toast(frame, look, signal, `Файл «${state.reports[index][0]}.${format.toLowerCase()}» готов`)
                emit('export', [state.reports[index][0], format])
            })
        },
        tab: (_, value) => {
            state.tab = value
            draw()
        },
        twofa: button => {
            if (!button.classList.contains('checked')) {
                state.twofa = false
                toast(frame, look, signal, 'Двухфакторная защита выключена')
                return
            }
            confirmBox(frame, look, 'Включить двухфакторную защиту?', 'При входе понадобится код из приложения-аутентификатора.', 'Включить', () => button.classList.remove('checked'), (ok, close) => busy(record, signal, ok, () => {
                state.twofa = true
                close()
                toast(frame, look, signal, 'Двухфакторная защита включена')
                emit('twofa')
            }))
        },
        alerts: button => {
            state.alerts = button.classList.contains('checked')
        },
        sessions: () => pop('Завершить другие сеансы?', 'На других устройствах придётся войти заново.', 'Завершить', 'sessions', 'Другие сеансы завершены'),
        channel: (button, channel) => {
            state.channels[channel] = button.classList.contains('checked')
        },
        saveChannels: button => busy(record, signal, button, () => {
            state.saved = {...state.channels}
            toast(frame, look, signal, 'Настройки уведомлений сохранены')
            emit('channels')
        }),
        saveProfile: button => busy(record, signal, button, () => toast(frame, look, signal, 'Профиль сохранён')),
        readAll: () => {
            for (const note of state.notes) {
                note.read = true
            }
            chrome()
            emit('readAll')
        },
        note: (_, index) => {
            state.notes[index].read = true
            chrome()
        },
        profile: () => visit({page: 'settings', tab: 'Профиль'}),
        help: () => {},
        logout: () => pop('Выйти из аккаунта?', 'Несохранённые изменения пропадут.', 'Выйти', 'logout', null),
    }
    draw()
    mark(record, app.querySelectorAll('aside [data-mark], header [data-mark]'))
    frame.addEventListener('click', e => {
        const element = e.target.closest('[data-act]')
        if (!element) {
            return
        }
        const list = element.closest('.pop')
        if (list && !list.classList.contains('notes')) {
            list.hidden = true
        }
        const [act, ...args] = element.dataset.act.split(':')
        actions[act](element, ...args)
    })
    addEventListener('pointerdown', e => {
        for (const list of app.querySelectorAll('.drop > .pop:not([hidden])')) {
            if (!list.parentElement.contains(e.target)) {
                list.hidden = true
            }
        }
    }, {signal})

    const search = app.querySelector('.search input')
    const results = search.nextElementSibling
    let query = 0
    search.addEventListener('focus', () => {
        results.hidden = !search.value.trim()
    })
    search.addEventListener('input', () => {
        const token = ++query
        const text = search.value.trim().toLowerCase()
        results.hidden = !text
        results.innerHTML = '<div class="spinner"></div>'
        later(signal, 300, () => token === query && text && delay(record, signal, () => {
            if (token !== query) {
                return false
            }
            const people = state.customers.map((name, index) => [name, index]).filter(([name]) => name.toLowerCase().includes(text)).slice(0, 5)
            const orders = state.orders.filter(order => String(order.number).includes(text)).slice(0, 4)
            const found = [...people.map(([name, index]) => [`customer:${index}`, name, 'клиент']), ...orders.map(order => [`order:${order.number}`, `Заказ №${order.number}`, order.customer])]
            results.innerHTML = found.map(([act, text, note], index) => `<button data-act="${act}" data-mark="Результат ${index + 1}"><span>${text}</span><small class="muted">${note}</small></button>`).join('') || '<p class="muted">Ничего не найдено</p>'
        }))
    })
}


const panelOps = {
    twofa: state => ({
        instruction: 'Откройте Настройки → Безопасность и включите двухфакторную защиту',
        prepare: () => {
            state.twofa = false
        },
        goal: event => event === 'twofa',
    }),
    order: state => {
        const order = pick(state.orders.slice(perPage))
        const status = pick(orderStatuses.filter(value => value !== order.status))
        return {
            instruction: `Найдите в разделе «Заказы» заказ №${order.number}, нажмите «Изменить», поставьте статус «${status}» и сохраните`,
            meta: {order: order.number, status},
            goal: (event, value) => event === 'order' && value === order && order.status === status,
        }
    },
    bell: state => ({
        instruction: 'Откройте уведомления (колокольчик вверху) и нажмите «Прочитать все»',
        prepare: () => {
            for (const note of sample(state.notes, integer(2, 4))) {
                note.read = false
            }
        },
        goal: event => event === 'readAll',
    }),
    logout: state => {
        const confirm = Math.random() < 0.6
        return {
            instruction: `Откройте меню профиля (${state.user}, вверху справа), нажмите «Выйти» и ${confirm ? 'подтвердите выход' : 'в окне подтверждения передумайте: «Отмена»'}`,
            meta: {confirm},
            goal: (event, value) => event === 'logout' && value === confirm,
        }
    },
    remove: state => {
        const product = pick(state.products)
        const confirm = Math.random() < 0.7
        return {
            instruction: `В разделе «Товары» удалите «${product.name}»${confirm ? ' и подтвердите удаление' : ', но в окне подтверждения нажмите «Отмена»'}`,
            meta: {product: product.name, confirm},
            goal: (event, value) => event === 'remove' && value[0] === product && value[1] === confirm,
        }
    },
    sale: state => {
        const product = pick(state.products)
        const on = !product.on
        return {
            instruction: `В разделе «Товары» ${on ? 'верните в продажу' : 'снимите с продажи'} «${product.name}» (переключатель «В продаже»)`,
            meta: {product: product.name, on},
            goal: (event, value) => event === 'sale' && value === product && product.on === on,
        }
    },
    period: state => {
        const period = pick(periods.filter(value => value !== state.period))
        return {
            instruction: `Откройте «Аналитика» и переключите период на «${period}»`,
            meta: {period},
            goal: (event, value) => event === 'period' && value === period,
        }
    },
    search: state => {
        const name = pick(state.customers)
        return {
            instruction: `Через поиск вверху найдите клиента «${name}» и откройте его карточку`,
            meta: {customer: name},
            goal: (event, value) => event === 'customer' && value === name,
        }
    },
    channels: state => {
        const wanted = Object.fromEntries(channels.map(channel => [channel, Math.random() < 0.5]))
        if (channels.every(channel => wanted[channel] === state.saved[channel])) {
            wanted.SMS = !wanted.SMS
        }
        const changes = channels.filter(channel => wanted[channel] !== state.saved[channel])
        return {
            instruction: `Откройте Настройки → Уведомления, ${changes.map(channel => `${wanted[channel] ? 'включите' : 'выключите'} «${channel}»`).join(', ')} и нажмите «Сохранить»`,
            meta: {wanted},
            goal: event => event === 'channels' && channels.every(channel => state.saved[channel] === wanted[channel]),
        }
    },
    export: state => {
        const [report] = pick(state.reports)
        const format = pick(formats)
        return {
            instruction: `Откройте «Отчёты» и выгрузите «${report}» в формате ${format} (кнопка «Экспорт»)`,
            meta: {report, format},
            goal: (event, value) => event === 'export' && value[0] === report && value[1] === format,
        }
    },
    sessions: () => ({
        instruction: 'Откройте Настройки → Безопасность, завершите другие сеансы и подтвердите',
        goal: (event, value) => event === 'sessions' && value,
    }),
}


function panelStep(look, state, name) {
    const op = panelOps[name](state)
    return web('panel', name, op.instruction, look, ({record, signal, done, frame}) => {
        Object.assign(record.meta, op.meta)
        op.prepare?.()
        desk(record, signal, frame, look, state, (event, value) => op.goal(event, value) && done())
    })
}


async function panel() {
    const look = theme()
    const state = office()
    const names = sample(Object.keys(panelOps), integer(3, 5))
    if (names.includes('logout')) {
        names.push(...names.splice(names.indexOf('logout'), 1))
    }
    for (const name of names) {
        await panelStep(look, state, name)
    }
}


const monthsGenitive = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря']
const weekdays = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс']
const dateOf = (year, month, day) => new Date(year, month, day)
const addDays = (date, days) => dateOf(date.getFullYear(), date.getMonth(), date.getDate() + days)
const monthDays = (year, month) => dateOf(year, month + 1, 0).getDate()
const two = value => String(value).padStart(2, '0')
const dotted = date => `${two(date.getDate())}.${two(date.getMonth() + 1)}.${date.getFullYear()}`
const iso = date => `${date.getFullYear()}-${two(date.getMonth() + 1)}-${two(date.getDate())}`
const same = (a, b) => Boolean(a && b) && a.getTime() === b.getTime()
const plural = (count, one, few, many) => count % 10 === 1 && count % 100 !== 11 ? one : [2, 3, 4].includes(count % 10) && ![12, 13, 14].includes(count % 100) ? few : many


function today() {
    const now = new Date()
    return dateOf(now.getFullYear(), now.getMonth(), now.getDate())
}


const spoken = (date, year = false) => `${date.getDate()} ${monthsGenitive[date.getMonth()]}${year || date.getFullYear() !== today().getFullYear() ? ` ${date.getFullYear()}` : ''}`


function monthGrid(month, limits, chosen) {
    const year = month.getFullYear()
    const index = month.getMonth()
    const offset = (month.getDay() + 6) % 7
    const now = today()
    const cells = Array.from({length: monthDays(year, index)}, (_, number) => {
        const date = dateOf(year, index, number + 1)
        const inside = chosen.from && chosen.to && date > chosen.from && date < chosen.to
        const classes = [same(date, chosen.from) || same(date, chosen.to) ? 'picked' : '', inside ? 'between' : '', same(date, now) ? 'today' : ''].filter(Boolean).join(' ')
        const off = limits.min && date < limits.min || limits.max && date > limits.max
        return `<button type="button" data-day="${date.getTime()}" data-mark="${number + 1} ${monthsGenitive[index]}"${classes ? ` class="${classes}"` : ''}${number ? '' : ` style="grid-column:${offset + 1}"`}${off ? ' disabled' : ''}>${number + 1}</button>`
    })
    return `<div class="month-grid"><b>${monthNames[index]} ${year}</b>${weekdays.map(name => `<small>${name}</small>`).join('')}${cells.join('')}</div>`
}


function calendar(stats, count, view, limits, chosen, choose) {
    const element = html('<div class="calendar"></div>')
    let first = dateOf(view.getFullYear(), view.getMonth(), 1)
    const draw = () => {
        const last = dateOf(first.getFullYear(), first.getMonth() + count, 0)
        const months = Array.from({length: count}, (_, index) => monthGrid(dateOf(first.getFullYear(), first.getMonth() + index, 1), limits, chosen))
        element.innerHTML = `<button type="button" class="arrow prev" data-move="-1" data-mark="Предыдущий месяц"${limits.min && first <= limits.min ? ' disabled' : ''}>‹</button><button type="button" class="arrow next" data-move="1" data-mark="Следующий месяц"${limits.max && last >= limits.max ? ' disabled' : ''}>›</button><div class="months">${months.join('')}</div>`
    }
    element.addEventListener('click', e => {
        const move = e.target.closest('[data-move]')
        const cell = e.target.closest('[data-day]')
        if (move) {
            first = dateOf(first.getFullYear(), first.getMonth() + Number(move.dataset.move), 1)
            stats.moves++
        } else if (cell) {
            stats.picks++
            choose(new Date(Number(cell.dataset.day)))
        } else {
            return
        }
        draw()
    })
    draw()
    return element
}


function place(pop) {
    pop.classList.remove('up')
    pop.style.left = pop.style.right = ''
    const frame = pop.closest('.frame').getBoundingClientRect()
    const anchor = pop.parentElement.getBoundingClientRect()
    let box = pop.getBoundingClientRect()
    if (box.right > frame.right - 8) {
        pop.style.left = `${Math.max(frame.left + 8, frame.right - 8 - box.width) - anchor.left}px`
        box = pop.getBoundingClientRect()
    }
    if (box.bottom > frame.bottom - 8 && anchor.top - frame.top > box.height + 16) {
        pop.classList.add('up')
    }
}


function datePicker(record, signal, labels, {count = 1, view = null, min = null, max = null, value = null} = {}) {
    const range = labels.length === 2
    const element = html(`<div class="picker">${labels.map((label, index) => `<div class="field"><span>${label}</span><button type="button" class="datefield" data-index="${index}" data-mark="${label}"></button></div>`).join('')}<div class="popover calpop" hidden></div></div>`)
    const chosen = {from: value, to: null}
    const fields = element.querySelectorAll('.datefield')
    const pop = element.lastElementChild
    const stats = record.meta.calendar ??= {opens: 0, moves: 0, picks: 0}
    let editing = 0
    const show = () => {
        fields[0].textContent = chosen.from ? dotted(chosen.from) : 'дд.мм.гггг'
        if (range) {
            fields[1].textContent = chosen.to ? dotted(chosen.to) : 'дд.мм.гггг'
        }
    }
    pop.append(calendar(stats, count, view ?? value ?? today(), {min, max}, chosen, date => {
        if (!range) {
            chosen.from = date
            pop.hidden = true
        } else if (editing === 0 || !chosen.from || date <= chosen.from) {
            chosen.from = date
            chosen.to = null
            editing = 1
        } else {
            chosen.to = date
            pop.hidden = true
        }
        show()
    }))
    element.addEventListener('click', e => {
        const field = e.target.closest('.datefield')
        if (!field) {
            return
        }
        const index = range && chosen.from ? Number(field.dataset.index) : 0
        const reopen = !pop.hidden && index !== editing
        editing = index
        pop.hidden = reopen ? false : !pop.hidden
        if (!pop.hidden) {
            stats.opens++
            place(pop)
        }
    })
    addEventListener('pointerdown', e => element.contains(e.target) || (pop.hidden = true), {signal})
    show()
    return {element, chosen}
}


function suggest(input, names, notes, signal, choose) {
    const list = html('<div class="popover hints" hidden data-private></div>')
    input.after(list)
    let token = 0
    const lookup = () => {
        const text = input.value.trim().toLowerCase()
        const current = ++token
        later(signal, 250, () => {
            if (current !== token) {
                return
            }
            const found = names.map((name, index) => [name.toLowerCase(), index]).filter(([name]) => name.includes(text)).sort((a, b) => b[0].startsWith(text) - a[0].startsWith(text)).slice(0, 6)
            list.innerHTML = found.map(([, index], order) => `<button type="button" data-pick="${index}" data-mark="Подсказка ${order + 1}"><span>${names[index]}</span><small class="muted">${notes[index]}</small></button>`).join('') || '<p class="muted">Ничего не найдено</p>'
            list.hidden = !text
        })
    }
    input.addEventListener('input', lookup)
    input.addEventListener('focus', () => input.value.trim() && lookup())
    list.addEventListener('click', e => {
        const button = e.target.closest('[data-pick]')
        if (button) {
            list.hidden = true
            choose(Number(button.dataset.pick))
        }
    })
    addEventListener('pointerdown', e => input.parentElement.contains(e.target) || (list.hidden = true), {signal})
    return lookup
}


function steppers(root, change = () => {}) {
    root.addEventListener('click', e => {
        const button = e.target.closest('[data-step]')
        if (!button) {
            return
        }
        const box = button.parentElement
        const value = Math.min(Number(box.dataset.max), Math.max(Number(box.dataset.min), Number(box.dataset.value) + Number(button.dataset.step)))
        box.dataset.value = box.querySelector('span').textContent = value
        change(box, value)
    })
}

function arrive(record, signal, frame, look, tools, markup, wire, load = true) {
    const main = browse(look, frame, load ? skeleton() : '', true)
    frame.querySelector('.account').innerHTML = tools
    mark(record, frame.querySelectorAll('header [data-mark]'))
    const show = () => {
        main.innerHTML = markup()
        wire(main)
        mark(record, main.querySelectorAll('[data-mark]'))
    }
    if (load) {
        delay(record, signal, show)
    } else {
        show()
    }
}


function leave(record, signal, frame, then) {
    const site = frame.querySelector('.site')
    const main = site.querySelector(':scope > main')
    if (main.classList.contains('leaving')) {
        return
    }
    frame.querySelector('.backdrop')?.remove()
    main.className = 'wide leaving'
    main.innerHTML = skeleton()
    site.scrollTop = 0
    delay(record, signal, then)
}


function refresh(record, signal, container, render) {
    const token = String(Number(container.dataset.token ?? 0) + 1)
    container.dataset.token = token
    container.innerHTML = Math.random() < 0.4 ? '<div class="spinner"></div>' : skeleton()
    delay(record, signal, () => {
        if (container.dataset.token !== token) {
            return false
        }
        render()
    })
}

                }
            })
        }, false)
    })
}


async function review() {
    const look = {...theme(), nav: sample(['Категории', 'Лучшие компании', 'Новые отзывы', 'Блог', 'Для бизнеса', 'Помощь'], integer(3, 4))}
    const [topic, , names] = pick(reviewTopics)
    const company = pick(names)
    const home = await reviewHome(look, company, topic, Math.random() < 0.5)
    if (home.meta.took === 'category') {
        await reviewTopic(look, company, topic, names)
    }
    await reviewCompany(look, company, topic)
    await reviewForm(look, company, topic)
    await reviewThanks(look, company)
}


const shopKinds = [['Футболка', 'tee', 'clothes'], ['Худи', 'hoodie', 'clothes'], ['Куртка', 'jacket', 'clothes'], ['Кроссовки', 'sneaker', 'shoes'], ['Кепка', 'cap', 'one'], ['Рюкзак', 'bag', 'one']]
const shopBrands = ['Тайга', 'Беркут', 'Прибой', 'Грань', 'Полюс', 'Ритмика']
const shopModels = ['Урбан', 'Лайт', 'Базис', 'Трек', 'Норд', 'Спорт', 'Классик', 'Флекс', 'Вояж', 'Квант']
const shopColors = [['чёрный', '#23262b'], ['белый', '#f4f4f2'], ['синий', '#2f5fd0'], ['зелёный', '#2f8f5b'], ['бежевый', '#d8c3a0'], ['красный', '#d23c3c'], ['серый', '#8a8f98']]
const shopSizes = {clothes: ['XS', 'S', 'M', 'L', 'XL', 'XXL'], shoes: ['38', '39', '40', '41', '42', '43', '44'], one: []}
const shopSorts = ['По популярности', 'Сначала дешевле', 'Сначала дороже', 'По рейтингу']
const shopWays = [['courier', 'Курьер', '1–2 дня · 299 ₽'], ['point', 'Пункт выдачи', '2–3 дня · бесплатно'], ['locker', 'Постамат', '2–4 дня · 99 ₽']]
const shopPayments = [['card', 'Картой онлайн', 'Visa, Мир, Mastercard'], ['fast', 'СБП', 'Через приложение банка'], ['cash', 'При получении', 'Картой или наличными']]
const promoCodes = ['SALE10', 'HELLO10', 'AUTUMN10', 'BONUS10', 'START10']


function stock() {
    const names = sample(shopKinds.flatMap(kind => shopModels.map(model => [kind, model])), 36)
    return names.map(([[kind, drawing, sizing], model], id) => {
        const price = integer(9, 120) * 100 - 10
        return {id, name: `${kind} ${model}`, drawing, sizes: shopSizes[sizing], brand: shopBrands[id % shopBrands.length], price, old: Math.random() < 0.3 ? Math.round(price * uniform(1.15, 1.5) / 100) * 100 - 10 : null, rating: uniform(3.6, 5), reviews: integer(3, 900), colors: sample(shopColors, integer(3, 5)), hue: integer(0, 359), popular: Math.random()}
    })
}


const goodCard = item => `<div class="good" data-id="${item.id}" data-mark="${item.name}">${art(item.drawing, item.hue)}<b>${item.name}</b><span class="muted">${item.brand}</span><span><strong class="price">${money(item.price)}</strong>${item.old ? `<span class="old">${money(item.old)}</span>` : ''}</span><span class="muted"><span class="score">★</span> ${item.rating.toFixed(1)} · ${item.reviews}</span></div>`
const shopTools = cart => `<button data-mark="Избранное">♡</button><button class="primary" data-act="cart" data-mark="Корзина">Корзина · ${cart}</button>`


function shopCatalog(look, items, goal) {
    const sort = pick(shopSorts.slice(1))
    const where = pick(['left', 'right', 'top'])
    const highest = Math.max(...items.map(item => item.price))
    return web('shop', 'catalog', `Магазин «${look.name}»: в фильтрах отметьте бренд «${goal.brand}», выберите сортировку «${sort}», затем откройте товар «${goal.name}»`, look, ({record, signal, done, frame, say}) => {
        Object.assign(record.meta, {brand: goal.brand, sort, product: goal.name, filters: where, changes: 0, early: 0, wrong: 0})
        const state = {brands: [], sale: false, limit: highest, sort: 'По популярности'}
        const shown = () => {
            const list = items.filter(item => (!state.brands.length || state.brands.includes(item.brand)) && (!state.sale || item.old) && item.price <= state.limit)
            const order = {'По популярности': (a, b) => b.popular - a.popular, 'Сначала дешевле': (a, b) => a.price - b.price, 'Сначала дороже': (a, b) => b.price - a.price, 'По рейтингу': (a, b) => b.rating - a.rating}[state.sort]
            return (state.brands.length ? list : list.filter(item => item !== goal).slice(0, 12)).sort(order)
        }
        const grid = () => {
            const list = shown()
            return `<p class="muted">Найдено ${state.brands.length ? list.length : integer(140, 320)} товаров</p><div class="goods">${list.map(goodCard).join('') || '<p class="muted">Ничего не найдено. Измените фильтры.</p>'}</div>`
        }
        arrive(record, signal, frame, look, shopTools(0), () => `${crumbs(['Главная', 'Каталог', 'Одежда и обувь'])}<h1>Одежда и обувь</h1><div class="columns${where === 'right' ? ' flip' : where === 'top' ? ' stack' : ''}"><div class="side"><div class="plate"><h2>Бренд</h2>${shopBrands.map(brand => tick(brand, `Бренд ${brand}`)).join('')}</div><div class="plate wide"><h2>Цена до</h2><div class="pricebar" data-mark="Цена до"><i data-mark="Ползунок цены"></i></div><span class="muted limit"></span></div><div class="plate">${tick('Только со скидкой', 'Только со скидкой')}${tick('Есть в магазине', 'Есть в магазине')}</div></div><div class="body"><div class="split"><span class="muted">Сортировка</span><div class="sorter"></div></div><div class="results">${grid()}</div></div></div>`, main => {
            const results = main.querySelector('.results')
            const update = () => {
                record.meta.changes++
                refresh(record, signal, results, () => {
                    results.innerHTML = grid()
                })
            }
            const sorter = dropdown('Сортировка', shopSorts, signal)
            sorter.dataset.value = sorter.firstElementChild.textContent = state.sort
            main.querySelector('.sorter').replaceWith(sorter)
            sorter.addEventListener('change', () => {
                state.sort = sorter.dataset.value
                update()
            })
            main.querySelector('.side').addEventListener('change', e => {
                const label = e.target.closest('.tick')?.dataset.mark ?? ''
                if (label.startsWith('Бренд ')) {
                    const brand = label.slice(6)
                    state.brands = e.target.checked ? [...state.brands, brand] : state.brands.filter(other => other !== brand)
                } else if (label === 'Только со скидкой') {
                    state.sale = e.target.checked
                }
                update()
            })
            const bar = main.querySelector('.pricebar')
            const knob = bar.firstElementChild
            const caption = main.querySelector('.limit')
            const paint = () => {
                const share = state.limit / highest * 100
                knob.style.left = `${share}%`
                bar.style.setProperty('--fill', `${share}%`)
                caption.textContent = money(state.limit)
            }
            let dragging = false
            const slide = e => {
                const rect = bar.getBoundingClientRect()
                state.limit = Math.max(500, Math.round(Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1) * highest / 100) * 100)
                paint()
            }
            bar.addEventListener('pointerdown', e => {
                if (e.button === 0) {
                    dragging = true
                    bar.setPointerCapture(e.pointerId)
                    slide(e)
                }
            })
            bar.addEventListener('pointermove', e => dragging && slide(e))
            bar.addEventListener('pointerup', () => {
                if (dragging) {
                    dragging = false
                    update()
                }
            })
            paint()
            results.addEventListener('click', e => {
                const card = e.target.closest('.good')
                if (!card) {
                    return
                }
                if (Number(card.dataset.id) !== goal.id) {
                    record.meta.wrong++
                    say(`Это другой товар. В фильтрах отметьте бренд «${goal.brand}», выберите сортировку «${sort}» и откройте «${goal.name}»`)
                } else if (state.sort !== sort) {
                    record.meta.early++
                    say(`Сначала выберите сортировку «${sort}», затем откройте «${goal.name}»`)
                } else {
                    leave(record, signal, frame, done)
                }
            })
        })
    })
}

p>${item.name} от бренда ${item.brand}: удобная посадка, прочные швы и материалы, которые не теряют вид после стирок.</p>`
}


function shopProduct(look, goal, chosen) {
    const color = pick(goal.colors)[0]
    const size = goal.sizes.length ? pick(goal.sizes) : null
    const qty = integer(2, 3)
    const photo = integer(2, 4)
    return web('shop', 'product', `Товар «${goal.name}»: посмотрите ${photo}-е фото, выберите цвет «${color}»${size ? `, размер ${size}` : ''}, количество ${qty} и нажмите «В корзину»`, look, ({record, signal, done, frame}) => {
        Object.assign(record.meta, {color, size, qty, photo, photos: 0, submits: 0, errors: 0})
        arrive(record, signal, frame, look, shopTools(2), () => productPage(goal, chosen), main => {
            const gallery = main.querySelector('.gallery')
            steppers(main, (_, value) => {
                chosen.qty = value
            })
            main.addEventListener('click', e => {
                const thumb = e.target.closest('[data-photo]')
                const swatch = e.target.closest('[data-color]')
                const sizing = e.target.closest('[data-size]')
                if (thumb) {
                    record.meta.photos++
                    chosen.photo = Number(thumb.dataset.photo)
                    gallery.firstElementChild.replaceWith(html(art(goal.drawing, goal.hue, views[chosen.photo])))
                    for (const other of gallery.querySelectorAll('[data-photo]')) {
                        other.classList.toggle('chosen', other === thumb)
                    }
                } else if (swatch) {
                    chosen.color = swatch.dataset.color
                    main.querySelector('.color-name').textContent = chosen.color
                    for (const other of main.querySelectorAll('[data-color]')) {
                        other.classList.toggle('chosen', other === swatch)
                    }
                } else if (sizing) {
                    chosen.size = sizing.dataset.size
                    for (const other of main.querySelectorAll('[data-size]')) {
                        other.classList.toggle('chosen', other === sizing)
                    }
                } else if (e.target.closest('[data-act=add]')) {
                    record.meta.submits++
                    const button = e.target.closest('[data-act=add]')
                    const ok = verify([
                        [main.querySelector('.colors'), chosen.color === color, chosen.color ? `Нужен цвет «${color}»` : 'Выберите цвет'],
                        ...size ? [[main.querySelector('.sizes'), chosen.size === size, chosen.size ? `Нужен размер ${size}` : 'Выберите размер']] : [],
                        [main.querySelector('.stepper'), chosen.qty === qty, `Укажите количество ${qty}`],
                    ], main.querySelector('.error'))
                    if (ok) {
                        busy(record, signal, button, done)
                    } else {
                        record.meta.errors++
                    }
                }
            })
        }, false)
    })
}


function shopCart(look, goal, chosen, items) {
    const others = sample(items.filter(item => item !== goal), 2)
    const [gone, more] = others
    const raise = Math.random() < 0.5
    const code = Math.random() < 0.6 ? pick(promoCodes) : null
    const asks = [`удалите «${gone.name}»`, ...raise ? [`увеличьте количество «${more.name}» до 2`] : [], ...code ? [`введите промокод ${code} и нажмите «Применить»`] : []]
    return web('shop', 'cart', `Корзина: ${asks.join(', ')}, затем нажмите «Оформить заказ»`, look, ({record, signal, done, frame, say}) => {
        Object.assign(record.meta, {removed: gone.name, raise, promo: Boolean(code), removals: 0, restores: 0, applies: 0, errors: 0})
        const lines = [{item: goal, qty: chosen.qty, note: [chosen.color, chosen.size].filter(Boolean).join(', ')}, ...others.map(item => ({item, qty: 1, note: item.colors[0][0]}))]
        const state = {discount: false, open: true}
        const total = () => lines.filter(line => !line.gone).reduce((sum, line) => sum + line.item.price * line.qty, 0)
        const count = () => lines.filter(line => !line.gone).reduce((sum, line) => sum + line.qty, 0)
        const lineHtml = (line, index) => line.gone
            ? `<div class="cartline gone"><span>«${line.item.name}» удалён</span><button data-restore="${index}" data-mark="Вернуть ${line.item.name}">Вернуть</button></div>`
            : `<div class="cartline">${art(line.item.drawing, line.item.hue)}<div><b>${line.item.name}</b><p class="muted">${line.note} · ${money(line.item.price)}</p></div><div class="split">${stepper(`Количество ${line.item.name}`, line.qty, 1, 10).replace('class="stepper"', `class="stepper" data-line="${index}"`)}<button data-remove="${index}" data-mark="Удалить ${line.item.name}">Удалить</button></div></div>`
        const summary = () => {
            const sum = total()
            const cut = state.discount ? Math.round(sum / 10) : 0
            return `<div class="split"><span>Товары, ${count()} шт.</span><span>${money(sum)}</span></div>${cut ? `<div class="split"><span>Скидка по промокоду</span><span>−${money(cut)}</span></div>` : ''}<div class="split"><span>Доставка</span><span class="muted">при оформлении</span></div><div class="split"><b>Итого</b><strong class="price">${money(sum - cut)}</strong></div>`
        }
        const drawer = () => {
            const box = frame.appendChild(html(`<div class="backdrop toside"><div class="cartbox"><button class="close" data-act="close" data-mark="Закрыть корзину">×</button><h2>Корзина</h2><div class="lines">${lines.map(lineHtml).join('')}</div><div class="field"><span>Промокод</span><div class="finder"><input data-mark="Промокод" autocomplete="off" autocapitalize="characters" spellcheck="false"><button data-act="apply" data-mark="Применить">Применить</button></div><p class="muted promo-note"></p></div><div class="totals">${summary()}</div><p class="error"></p><button class="primary" data-act="checkout" data-mark="Оформить заказ">Оформить заказ</button><a class="link" data-act="close" data-mark="Продолжить покупки">Продолжить покупки</a></div></div>`))
            mark(record, box.querySelectorAll('[data-mark]'))
            const redraw = () => {
                box.querySelector('.lines').innerHTML = lines.map(lineHtml).join('')
                box.querySelector('.totals').innerHTML = summary()
                frame.querySelector('header [data-act=cart]').textContent = `Корзина · ${count()}`
            }
            steppers(box, (stepperBox, value) => {
                lines[stepperBox.dataset.line].qty = value
                redraw()
            })
            box.addEventListener('click', e => {
                const remove = e.target.closest('[data-remove]')
                const restore = e.target.closest('[data-restore]')
                const act = e.target.closest('[data-act]')?.dataset.act
                if (remove) {
                    record.meta.removals++
                    lines[remove.dataset.remove].gone = true
                    redraw()
                } else if (restore) {
                    record.meta.restores++
                    lines[restore.dataset.restore].gone = false
                    redraw()
                } else if (act === 'close' || e.target === box) {
                    box.remove()
                } else if (act === 'apply') {
                    record.meta.applies++
                    const input = box.querySelector('[data-mark=Промокод]')
                    const note = box.querySelector('.promo-note')
                    busy(record, signal, e.target.closest('[data-act]'), () => {
                        state.discount = Boolean(code) && input.value.trim().toUpperCase() === code
                        note.textContent = state.discount ? 'Промокод применён: скидка 10%' : 'Промокод не найден'
                        redraw()
                    })
                } else if (act === 'checkout') {
                    const ok = verify([
                        [box.querySelector('.lines'), lines[0].qty > 0 && !lines[0].gone && lines[1].gone && !lines[2].gone, `Удалите из корзины только «${gone.name}»`],
                        ...raise ? [[box.querySelector('.lines'), lines[2].qty === 2, `Увеличьте количество «${more.name}» до 2`]] : [],
                        ...code ? [[box.querySelector('.finder'), state.discount, `Примените промокод ${code}`]] : [],
                    ], box.querySelector('.error'))
                    if (ok) {
                        leave(record, signal, frame, done)
                    } else {
                        record.meta.errors++
                    }
                }
            })
        }
        arrive(record, signal, frame, look, shopTools(count()), () => productPage(goal, chosen), main => {
            frame.querySelector('header [data-act=cart]').addEventListener('click', () => {
                if (!frame.querySelector('.backdrop')) {
                    drawer()
                    say(`Корзина: ${asks.join(', ')}, затем нажмите «Оформить заказ»`)
                }
            })
            drawer()
        }, false)
    })
}


function shopCheckout(look, goal, chosen) {
    const now = today()
    const ahead = Math.random() < 0.5 || now.getDate() > 24
    const when = ahead ? dateOf(now.getFullYear(), now.getMonth() + 1, integer(1, 14)) : dateOf(now.getFullYear(), now.getMonth(), integer(now.getDate() + 2, monthDays(now.getFullYear(), now.getMonth())))
    const [way, wayLabel] = pick(shopWays)
    const [payment, paymentLabel] = pick(shopPayments)
    const flip = Math.random() < 0.5
    const below = Math.random() < 0.5
    return web('shop', 'checkout', `Оформление заказа: введите любой адрес (город, улица и дом), выберите дату доставки ${spoken(when)}, способ «${wayLabel}», оплату «${paymentLabel}» и нажмите «Подтвердить заказ»`, look, ({record, signal, done, frame}) => {
        Object.assign(record.meta, {date: iso(when), nextMonth: when.getMonth() !== now.getMonth(), way, payment, flip, below, submits: 0, errors: 0})
        const confirm = '<button class="primary" data-act="confirm" data-mark="Подтвердить заказ">Подтвердить заказ</button>'
        arrive(record, signal, frame, look, shopTools(3), () => `${crumbs(['Корзина', 'Оформление заказа'])}<h1>Оформление заказа</h1><div class="columns${flip ? ' flip' : ''}"><div class="body"><div class="sheet" style="width:100%"><h2>Адрес доставки</h2>${field('Город', 'Город доставки')}${field('Улица и дом', 'Улица и дом')}<div class="pair">${field('Квартира (необязательно)', 'Квартира')}${field('Подъезд (необязательно)', 'Подъезд')}</div><h2>Когда доставить</h2><div class="when"></div><h2>Способ доставки</h2><div class="variants ways">${shopWays.map(([value, title, note]) => variant('way', value, title, note)).join('')}</div><h2>Оплата</h2><div class="variants payments">${shopPayments.map(([value, title, note]) => variant('payment', value, title, note)).join('')}</div>${area('Комментарий курьеру (необязательно)', 'Комментарий курьеру', 2)}<p class="error"></p>${below ? confirm : ''}</div></div><div class="side"><div class="plate wide"><h2>Ваш заказ</h2><div class="who">${art(goal.drawing, goal.hue).replace('class="art"', 'class="art tiny"')}<div><b>${goal.name}</b><p class="muted">${chosen.qty} шт. · ${money(goal.price * chosen.qty)}</p></div></div><p class="muted">и ещё 1 товар</p><div class="split"><b>Итого</b><strong class="price">${money(goal.price * chosen.qty + integer(10, 50) * 100)}</strong></div>${below ? '' : confirm}<p class="muted">Нажимая кнопку, вы соглашаетесь с условиями покупки.</p></div></div></div>`, main => {
            const picker = datePicker(record, signal, ['Дата доставки'], {min: addDays(now, 1), max: addDays(now, 45)})
            main.querySelector('.when').replaceWith(picker.element)
            const input = name => main.querySelector(`[data-mark="${name}"]`)
            const value = name => main.querySelector(`input[name=${name}]:checked`)?.value
            const button = main.querySelector('[data-act=confirm]')
            button.addEventListener('click', () => {
                record.meta.submits++
                const chosenDate = picker.chosen.from
                const ok = verify([
                    [input('Город доставки'), input('Город доставки').value.trim() !== '', 'Укажите город'],
                    [input('Улица и дом'), input('Улица и дом').value.trim() !== '', 'Укажите улицу и дом'],
                    [picker.element.querySelector('.datefield'), same(chosenDate, when), chosenDate ? `Нужна дата доставки ${spoken(when)}` : 'Выберите дату доставки'],
                    [main.querySelector('.ways'), value('way') === way, value('way') ? `Нужен способ «${wayLabel}»` : 'Выберите способ доставки'],
                    [main.querySelector('.payments'), value('payment') === payment, value('payment') ? `Нужна оплата «${paymentLabel}»` : 'Выберите способ оплаты'],
                ], main.querySelector('.error'))
                if (ok) {
                    busy(record, signal, button, done, true)
                } else {
                    record.meta.errors++
                }
            })
        }, false)
    })
}

const hotelNames = ['Северная звезда', 'Волжский берег', 'Старый город', 'Панорама', 'Сосновый бор', 'Причал', 'Уютный двор', 'Маяк', 'Вершина', 'Тихая гавань', 'Купеческий дом', 'Набережная', 'Белые ночи', 'Садовая 12', 'Огни города']
const hotelFeatures = ['Завтрак включён', 'Бесплатная отмена', 'Бассейн', 'Парковка', 'Рядом с центром']
const roomKinds = [['Стандарт', 18, 'двуспальная кровать'], ['Улучшенный', 24, 'двуспальная кровать, вид на город'], ['Семейный', 32, 'две комнаты, диван'], ['Студия', 28, 'кухня, двуспальная кровать'], ['Люкс', 45, 'гостиная, ванна']]
const arrivals = ['14:00–16:00', '16:00–18:00', '18:00–20:00', 'После 20:00']
const bookingSorts = ['Сначала популярные', 'Сначала дешевле', 'По рейтингу', 'По расстоянию']
const adultsText = count => `${count} ${plural(count, 'взрослый', 'взрослых', 'взрослых')}`
const kidsText = count => `${count} ${plural(count, 'ребёнок', 'ребёнка', 'детей')}`
const guestsText = (adults, kids) => `${adultsText(adults)}${kids ? `, ${kidsText(kids)}` : ''}`
const bookingTools = '<button data-mark="Мои бронирования">Мои бронирования</button><button class="primary" data-mark="Войти">Войти</button>'


function trip() {
    const now = today()
    const far = Math.random() < 0.4
    const start = far ? dateOf(now.getFullYear(), now.getMonth() + 2, integer(1, 20)) : addDays(now, integer(3, Math.max(4, monthDays(now.getFullYear(), now.getMonth() + 1) + monthDays(now.getFullYear(), now.getMonth()) - now.getDate() - 6)))
    const nights = integer(2, 5)
    const filter = pick(hotelFeatures)
    const hotels = sample(hotelNames, 10).map((name, index) => {
        const features = sample(hotelFeatures.filter(feature => feature !== filter), integer(1, 2))
        return {name, stars: integer(3, 5), rating: uniform(7, 9.7), distance: uniform(0.3, 8), price: integer(25, 120) * 100, hue: integer(0, 359), features: index < 4 ? [...features, filter] : features}
    })
    const goal = hotels[0]
    return {
        city: pick(cities),
        far,
        checkin: start,
        checkout: addDays(start, nights),
        nights,
        adults: integer(1, 3),
        kids: pick([0, 0, 1, 2]),
        filter,
        hotels: shuffle(hotels),
        goal,
        room: pick(roomKinds)[0],
        breakfast: Math.random() < 0.5,
        arrival: pick(arrivals),
        code: `${pick(['А', 'В', 'К', 'М', 'Т'])}${integer(10000, 99999)}`,
    }
}


function bookingSearch(look, plan) {
    const tall = Math.random() < 0.4
    return web('booking', 'search', `Бронирование на «${look.name}»: в поле «Город» начните вводить «${plan.city}» и выберите его в подсказках; заезд ${spoken(plan.checkin)}, выезд ${spoken(plan.checkout)}; гости: ${guestsText(plan.adults, plan.kids)}; нажмите «Найти»`, look, ({record, signal, done, frame}) => {
        Object.assign(record.meta, {city: plan.city, checkin: iso(plan.checkin), checkout: iso(plan.checkout), farMonth: plan.far, adults: plan.adults, kids: plan.kids, tall, picks: 0, wrong: 0, submits: 0, errors: 0})
        arrive(record, signal, frame, look, bookingTools, () => `<section class="hero"><h1>Отели и апартаменты по всей России</h1><p>Более ${integer(20, 90)} 000 вариантов, оплата при заселении.</p><div class="searchbar${tall ? ' tall' : ''}"><div class="field"><span>Город</span><div class="finder"><input data-mark="Город" placeholder="Куда едете?" autocomplete="off" spellcheck="false"></div></div><div class="dates"></div><div class="field"><span>Гости</span><div class="picker"><button type="button" class="datefield" data-act="guests" data-mark="Гости">${guestsText(2, 0)}</button><div class="popover guests" hidden><div class="split"><span>Взрослые</span>${stepper('Взрослые', 2, 1, 6)}</div><div class="split"><span>Дети</span>${stepper('Дети', 0, 0, 4)}</div><button class="primary" data-act="ready" data-mark="Готово">Готово</button></div></div></div><button class="primary" data-act="find" data-mark="Найти">Найти</button></div><p class="error"></p></section><h2>Популярные направления</h2><div class="cards">${sample(cities, 4).map(city => `<div class="offer">${art('hotel', integer(0, 359))}<b>${city}</b><span class="muted">от ${money(integer(18, 60) * 100)} за ночь</span></div>`).join('')}</div>`, main => {
            const bar = main.querySelector('.searchbar')
            const input = bar.querySelector('[data-mark=Город]')
            let city = null
            suggest(input, cities, cities.map(() => 'Россия'), signal, index => {
                record.meta.picks++
                city = cities[index]
                input.value = city
                if (city !== plan.city) {
                    record.meta.wrong++
                }
            })
            input.addEventListener('input', () => {
                city = null
            })
            const picker = datePicker(record, signal, ['Заезд', 'Выезд'], {count: 2, min: today()})
            bar.querySelector('.dates').replaceWith(picker.element)
            const guests = bar.querySelector('[data-act=guests]')
            const pop = guests.nextElementSibling
            const counts = () => [...pop.querySelectorAll('.stepper')].map(box => Number(box.dataset.value))
            steppers(pop, () => {
                guests.textContent = guestsText(...counts())
            })
            addEventListener('pointerdown', e => guests.parentElement.contains(e.target) || (pop.hidden = true), {signal})
            bar.addEventListener('click', e => {
                const act = e.target.closest('[data-act]')?.dataset.act
                if (act === 'guests') {
                    pop.hidden = !pop.hidden
                    if (!pop.hidden) {
                        place(pop)
                    }
                } else if (act === 'ready') {
                    pop.hidden = true
                } else if (act === 'find') {
                    record.meta.submits++
                    const [adults, kids] = counts()
                    const {from, to} = picker.chosen
                    const ok = verify([
                        [input, city === plan.city || input.value.trim().toLowerCase() === plan.city.toLowerCase(), 'Выберите город из подсказок'],
                        [picker.element, same(from, plan.checkin) && same(to, plan.checkout), from && to ? 'Проверьте даты заезда и выезда' : 'Выберите даты заезда и выезда'],
                        [guests, adults === plan.adults && kids === plan.kids, 'Проверьте число гостей'],
                    ], main.querySelector('.hero .error'))
                    if (ok) {
                        busy(record, signal, e.target.closest('[data-act]'), done, true)
                    } else {
                        record.meta.errors++
                    }
                }
            })
        })
    })
}


function bookingResults(look, plan) {
    const where = pick(['left', 'right', 'top'])
    return web('booking', 'results', `Отели в городе ${plan.city}: отметьте фильтр «${plan.filter}» и нажмите «Подробнее» у отеля «${plan.goal.name}»`, look, ({record, signal, done, frame, say}) => {
        Object.assign(record.meta, {filter: plan.filter, hotel: plan.goal.name, filters: where, changes: 0, wrong: 0})
        const state = {features: [], stars: [], sort: bookingSorts[0]}
        const list = () => {
            const order = {'Сначала популярные': () => 0, 'Сначала дешевле': (a, b) => a.price - b.price, 'По рейтингу': (a, b) => b.rating - a.rating, 'По расстоянию': (a, b) => a.distance - b.distance}[state.sort]
            const found = plan.hotels.filter(hotel => state.features.every(feature => hotel.features.includes(feature)) && (!state.stars.length || state.stars.includes(hotel.stars)) && (state.features.includes(plan.filter) || hotel !== plan.goal)).sort(order)
            return `<p class="muted">${found.length} ${plural(found.length, 'вариант', 'варианта', 'вариантов')} · ${plan.nights} ${plural(plan.nights, 'ночь', 'ночи', 'ночей')}</p>${found.map(hotel => `<div class="stay">${art('hotel', hotel.hue)}<div><a data-hotel="${hotel.name}" data-mark="${hotel.name}">Отель «${hotel.name}»</a><span class="score">${'★'.repeat(hotel.stars)}</span><span class="muted">${hotel.distance.toFixed(1)} км от центра</span><span>${hotel.features.map(feature => `<span class="pill">${feature}</span>`).join(' ')}</span></div><div><span><strong class="rate">${hotel.rating.toFixed(1)}</strong></span><span><strong class="price">${money(hotel.price * plan.nights)}</strong><br><span class="muted">за ${plan.nights} ${plural(plan.nights, 'ночь', 'ночи', 'ночей')}</span></span><button class="primary" data-hotel="${hotel.name}" data-mark="Подробнее ${hotel.name}">Подробнее</button></div></div>`).join('') || '<p class="muted">Нет вариантов. Измените фильтры.</p>'}`
        }
        arrive(record, signal, frame, look, bookingTools, () => `${crumbs(['Главная', plan.city, 'Отели'])}<div class="split"><h1>${plan.city}: отели</h1><span class="muted">${dotted(plan.checkin)} — ${dotted(plan.checkout)} · ${guestsText(plan.adults, plan.kids)}</span></div><div class="columns${where === 'right' ? ' flip' : where === 'top' ? ' stack' : ''}"><div class="side"><div class="plate"><h2>Удобства</h2>${hotelFeatures.map(feature => tick(feature, feature)).join('')}</div><div class="plate"><h2>Звёзды</h2>${[3, 4, 5].map(stars => tick(`${stars} ★`, `Звёзд: ${stars}`)).join('')}</div></div><div class="body"><div class="split"><span class="muted">Сортировка</span><div class="sorter"></div></div><div class="results">${list()}</div></div></div>`, main => {
            const results = main.querySelector('.results')
            const update = () => {
                record.meta.changes++
                refresh(record, signal, results, () => {
                    results.innerHTML = list()
                })
            }
            const sorter = dropdown('Сортировка', bookingSorts, signal)
            sorter.dataset.value = sorter.firstElementChild.textContent = state.sort
            main.querySelector('.sorter').replaceWith(sorter)
            sorter.addEventListener('change', () => {
                state.sort = sorter.dataset.value
                update()
            })
            main.querySelector('.side').addEventListener('change', () => {
                const checked = [...main.querySelectorAll('.side .tick')].filter(label => label.querySelector('input').checked).map(label => label.dataset.mark)
                state.features = checked.filter(label => hotelFeatures.includes(label))
                state.stars = checked.filter(label => label.startsWith('Звёзд: ')).map(label => Number(label.slice(7)))
                update()
            })
            results.addEventListener('click', e => {
                const hotel = e.target.closest('[data-hotel]')
                if (hotel?.dataset.hotel === plan.goal.name) {
                    leave(record, signal, frame, done)
                } else if (hotel) {
                    record.meta.wrong++
                    say(`Это другой отель. Отметьте фильтр «${plan.filter}» и нажмите «Подробнее» у отеля «${plan.goal.name}»`)
                }
            })
        }, false)
    })
}

    return web('booking', 'room', `Отель «${hotel.name}»: у номера «${plan.room}» отметьте «${plan.breakfast ? 'С завтраком' : 'Без питания'}» и нажмите «Выбрать»`, look, ({record, signal, done, frame, say}) => {

            const gallery = main.querySelector('.gallery')
            main.addEventListener('click', e => {
                const thumb = e.target.closest('[data-photo]')
                const choose = e.target.closest('[data-act=choose]')
                if (thumb) {
                    record.meta.photos++
                    gallery.firstElementChild.replaceWith(html(thumb.firstElementChild.outerHTML))
                    for (const other of gallery.querySelectorAll('[data-photo]')) {
                        other.classList.toggle('chosen', other === thumb)
                    }
                } else if (choose) {
                    const card = choose.closest('[data-room]')
                    if (card.dataset.room !== plan.room) {
                        record.meta.wrong++
                        say(`Это другой номер. У номера «${plan.room}» отметьте «${plan.breakfast ? 'С завтраком' : 'Без питания'}» и нажмите «Выбрать»`)
                        return
                    }
                    const meal = card.querySelector('input:checked').value === 'yes'
                    if (verify([[card, meal === plan.breakfast, plan.breakfast ? 'Отметьте «С завтраком»' : 'Отметьте «Без питания»']], card.querySelector('.error'))) {
                        busy(record, signal, choose, done, true)
                    } else {
                        record.meta.errors++
                    }
                }
            })
        }, false)
    })
}

    'Обычно всё решается за несколько минут в личном кабинете. Откройте раздел «Мои заказы», выберите нужный заказ и нажмите кнопку справа от него.',
    'Если кнопки нет, значит, заказ уже передан в службу доставки. В этом случае изменения возможны только через поддержку.',
    'Мы отвечаем на обращения в течение 24 часов, в выходные — до двух рабочих дней. Статус обращения виден в разделе «Мои обращения».',
    'Деньги возвращаются тем же способом, которым был оплачен заказ. Банку может понадобиться до 10 рабочих дней, чтобы зачислить их на карту.',
    'Сохраняйте чек и упаковку до конца гарантийного срока: они понадобятся, если товар придётся вернуть или обменять.',
    'Если вы оформляли заказ без регистрации, укажите в обращении номер заказа и почту, на которую пришло подтверждение.',
]
const ticketThemes = ['Заказ не пришёл', 'Возврат денег', 'Проблема с оплатой', 'Повреждённый товар', 'Вход в аккаунт', 'Другое']
const supportTools = '<button data-mark="Мои обращения">Мои обращения</button><button class="primary" data-mark="Войти">Войти</button>'


function supportHome(look, topic, article, viaSearch) {
    const word = article.split(' ').sort((a, b) => b.length - a.length)[0].toLowerCase()
    const titles = helpTopics.flatMap(([title, , items]) => items.map(item => [item, title]))
    const instruction = viaSearch
        ? `Центр помощи «${look.name}»: в поиске начните вводить «${word}» и откройте статью «${article}» из подсказок`
        : `Центр помощи «${look.name}»: откройте раздел «${topic}»`
    return web('support', 'home', instruction, look, ({record, signal, done, frame, say}) => {
        Object.assign(record.meta, {route: viaSearch ? 'search' : 'topic', took: null, wrong: 0})
        const go = took => {
            record.meta.took = took
            leave(record, signal, frame, done)
        }
        const popular = shuffle([article, ...sample(titles.map(([title]) => title).filter(title => title !== article), 4)])
        arrive(record, signal, frame, look, supportTools, () => `<section class="hero"><h1>Чем мы можем помочь?</h1><div class="finder"><input data-mark="Поиск по справке" placeholder="Опишите вопрос" autocomplete="off" spellcheck="false"><button class="primary" data-mark="Найти">Найти</button></div></section><h2>Разделы справки</h2><div class="topics">${helpTopics.map(([title, sign, items]) => `<button data-topic="${title}" data-mark="${title}"><i>${sign}</i><b>${title}</b><small>${items.length} ${plural(items.length, 'статья', 'статьи', 'статей')}</small></button>`).join('')}</div><h2>Популярные вопросы</h2><div class="links">${popular.map(title => `<a data-article="${title}" data-mark="${title}">${title}</a>`).join('')}</div>`, main => {
            const input = main.querySelector('.finder input')
            const lookup = suggest(input, titles.map(([title]) => title), titles.map(([, title]) => title), signal, index => {
                if (titles[index][0] === article) {
                    go('search')
                } else {
                    record.meta.wrong++
                    say(`Это другая статья. ${instruction}`)
                }
            })
            main.querySelector('.finder .primary').addEventListener('click', () => {
                input.focus()
                lookup()
            })
            main.addEventListener('click', e => {
                const tile = e.target.closest('[data-topic]')
                const link = e.target.closest('[data-article]')
                if (tile?.dataset.topic === topic && !viaSearch) {
                    go('topic')
                } else if (link?.dataset.article === article) {
                    go('popular')
                } else if (tile || link) {
                    record.meta.wrong++
                }
            })
        })
    })
}


function supportTopic(look, topic, article) {
    return web('support', 'topic', `Раздел «${topic}»: откройте статью «${article}»`, look, ({record, signal, done, frame}) => {
        record.meta.wrong = 0
        const items = helpTopics.find(([title]) => title === topic)[2]
        arrive(record, signal, frame, look, supportTools, () => `${crumbs(['Помощь', topic])}<div class="columns"><div class="side"><div class="navlist">${helpTopics.map(([title]) => `<button data-mark="Раздел ${title}"${title === topic ? ' class="current"' : ''}>${title}</button>`).join('')}</div></div><div class="body"><h1>${topic}</h1><div class="links">${shuffle(items).map(title => `<a data-article="${title}" data-mark="${title}">${title}</a>`).join('')}</div></div></div>`, main => {
            main.addEventListener('click', e => {
                const link = e.target.closest('[data-article]')
                if (link?.dataset.article === article) {
                    leave(record, signal, frame, done)
                } else if (link) {
                    record.meta.wrong++
                }
            })
        }, false)
    })
}


function supportArticle(look, topic, article) {
    return web('support', 'article', `Статья «${article}» не решила вопрос: внизу статьи нажмите «Не помогло», затем «Написать в поддержку»`, look, ({record, signal, done, frame}) => {
        Object.assign(record.meta, {helpful: 0, early: 0})
        const items = helpTopics.find(([title]) => title === topic)[2]
        const paragraphs = sample(helpParagraphs, 5)
        arrive(record, signal, frame, look, supportTools, () => `${crumbs(['Помощь', topic, article])}<div class="columns${Math.random() < 0.5 ? ' flip' : ''}"><div class="body"><h1>${article}</h1><p class="muted">Обновлено ${integer(1, 28)} ${pick(monthsGenitive)} · ${integer(2, 6)} мин чтения</p>${paragraphs.slice(0, 4).map(text => `<p>${text}</p>`).join('')}<h2>Что ещё может помочь</h2><p>${paragraphs[4]}</p><div class="plate wide feedback"><b>Статья помогла?</b><div class="buttons" style="justify-content:flex-start"><button data-act="yes" data-mark="Да">Да</button><button data-act="no" data-mark="Не помогло">Не помогло</button></div></div></div><div class="side"><div class="plate"><b>В этом разделе</b><div class="links">${items.map(title => `<a data-mark="${title}"${title === article ? ' class="current"' : ''}>${title}</a>`).join('')}</div></div></div></div>`, main => {
            const box = main.querySelector('.feedback')
            box.addEventListener('click', e => {
                const act = e.target.closest('[data-act]')?.dataset.act
                if (act === 'yes') {
                    record.meta.helpful++
                    box.querySelector('b').textContent = 'Спасибо за оценку!'
                } else if (act === 'no' && !box.querySelector('[data-act=write]')) {
                    box.querySelector('b').textContent = 'Жаль, что статья не помогла'
                    box.append(html('<p class="muted">Напишите нам — специалист ответит в течение дня.</p>'), html('<div class="buttons" style="justify-content:flex-start"><button class="primary" data-act="write" data-mark="Написать в поддержку">Написать в поддержку</button><button data-mark="Открыть чат">Открыть чат</button></div>'))
                    mark(record, box.querySelectorAll('[data-mark]'))
                } else if (act === 'write') {
                    leave(record, signal, frame, done)
                }
            })
        }, false)
    })
}


function supportContact(look, topic, article) {
    const subject = pick(ticketThemes)
    const order = String(integer(100000, 999999))
    return web('support', 'contact', `Форма обращения: выберите тему «${subject}», введите номер заказа ${order}, опишите проблему (любой текст от 10 символов), отметьте согласие на обработку данных и нажмите «Отправить»`, look, ({record, signal, done, frame}) => {
        Object.assign(record.meta, {subject, attach: 0, submits: 0, errors: 0})
        arrive(record, signal, frame, look, supportTools, () => `${crumbs(['Помощь', topic, article, 'Обращение'])}<div class="columns${Math.random() < 0.5 ? ' flip' : ''}"><div class="body"><div class="sheet" style="width:100%"><h1>Написать в поддержку</h1><div class="field"><span>Тема обращения</span><div class="theme"></div></div>${field('Номер заказа', 'Номер заказа', 'inputmode="numeric" maxlength="12"')}${area('Сообщение', 'Сообщение', 5)}<div class="split"><button data-act="attach" data-mark="Прикрепить файл">📎 Прикрепить файл</button><span class="muted">До 5 файлов, JPG или PDF</span></div>${tick('Согласен на обработку персональных данных', 'Согласие на обработку данных')}<p class="error"></p><button class="primary" data-act="send" data-mark="Отправить">Отправить</button></div></div><div class="side"><div class="plate"><h2>Другие способы связи</h2><button data-mark="Чат с поддержкой">Чат с поддержкой</button><p class="muted">Телефон: 8 800 ${integer(100, 999)}-${integer(10, 99)}-${integer(10, 99)}, с 8 до 22</p></div></div></div>`, main => {
            const select = dropdown('Тема обращения', ticketThemes, signal)
            main.querySelector('.theme').replaceWith(select)
            const input = name => main.querySelector(`[data-mark="${name}"]`)
            main.querySelector('[data-act=attach]').addEventListener('click', () => record.meta.attach++)
            const button = main.querySelector('[data-act=send]')
            button.addEventListener('click', () => {
                record.meta.submits++
                const ok = verify([
                    [select, select.dataset.value === subject, select.dataset.value ? `Нужна тема «${subject}»` : 'Выберите тему'],
                    [input('Номер заказа'), input('Номер заказа').value.replace(/\D/g, '') === order, `Введите номер заказа ${order}`],
                    [input('Сообщение'), input('Сообщение').value.trim().length >= 10, 'Сообщение — не короче 10 символов'],
                    [main.querySelector('.sheet .tick'), main.querySelector('.sheet .tick input').checked, 'Нужно согласие на обработку данных'],
                ], main.querySelector('.error'))
                if (ok) {
                    busy(record, signal, button, done, true)
                } else {
                    record.meta.errors++
                }
            })
        }, false)
    })
}

async function support() {
    const look = {...theme(), nav: sample(['Магазин', 'Доставка', 'Акции', 'Помощь', 'Контакты'], integer(3, 4))}
    const [topic, , items] = pick(helpTopics)
    const article = pick(items)
    const home = await supportHome(look, topic, article, Math.random() < 0.4)
    if (home.meta.took === 'topic') {
        await supportTopic(look, topic, article)
    }
    await supportArticle(look, topic, article)
    await supportContact(look, topic, article)
    await supportDone(look)
}


const accountSections = [['personal', 'Личные данные'], ['notifications', 'Уведомления'], ['addresses', 'Адреса'], ['security', 'Безопасность'], ['orders', 'Мои заказы']]

const accountPages = {
